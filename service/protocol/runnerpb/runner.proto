syntax = "proto3";

package xflow.runner.v1;

option go_package = "github.com/xbcio/xflow/service/protocol/runnerpb";

// RunnerProtocol is the control-plane <-> execution-plane contract. It mirrors
// the HTTP+JSON Runner Protocol one RPC per endpoint so a runner can switch
// transports without changing its execution loop.
//
// Rich domain payloads (TaskLease, TaskResult) are carried as JSON bytes rather
// than mirrored field-by-field: they embed map[string]any / any structures that
// round-trip cleanly through the engine's existing, tested JSON codecs but map
// poorly onto protobuf. Scalar control fields stay typed for cross-language and
// validation friendliness.
service RunnerProtocol {
  // Connect opens a long-lived bidirectional stream carrying the full runner
  // lifecycle (register, task dispatch, result report, drain). Production path;
  // the unary RPCs below remain for HTTP fallback.
  rpc Connect(stream RunnerFrame) returns (stream ServerFrame);

  // Register announces a runner and its capabilities to the server.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Heartbeat reports runner capacity and liveness.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // PollTask long-polls for one assigned task lease. The response carries an
  // empty lease and a wait hint when nothing is available.
  rpc PollTask(PollTaskRequest) returns (PollTaskResponse);

  // ReportResult commits a finished task result back to the server.
  rpc ReportResult(ReportResultRequest) returns (ReportResultResponse);

  // AckActivation reports the outcome of an activate/deactivate directive
  // back to the server. Mirrors the HTTP ActivationAckPath endpoint exactly:
  // same authz, namespace scoping (resolved server-side from the runner's
  // registration, never from the request), fencing/generation checks, and
  // idempotency. The response carries no payload — success is the RPC
  // returning without error, matching the HTTP transport's 200 with an empty
  // body.
  rpc AckActivation(ActivationAckRequest) returns (ActivationAckResponse);

  // RenewLease extends an active lease's deadline. Mirrors the HTTP
  // RenewLeasePath endpoint exactly: both transports call Core.renewLease,
  // so session validation, lease lookup, execution-deadline enforcement, and
  // the group/node renewal split are never duplicated between them.
  rpc RenewLease(RenewLeaseRequest) returns (RenewLeaseResponse);
}

message Capability {
  string node_type = 1;
  int32 node_version = 2;
  // features are additive runtime protocol capabilities for this node type.
  // Older peers ignore this field; replica activations are assigned only when
  // the feature is observed by the control plane.
  repeated string features = 3;
}

// RunnerControlDirective is the cooperative view of the control plane's
// server-authoritative desired state. The server still gates new claims even
// when an old or faulty runner ignores this directive.
message RunnerControlDirective {
  string desired_state = 1;
  uint64 generation = 2;
  bool recovery_only = 3;
}

// RunnerDrainObservation is emitted only after the runner applied a draining
// directive. in_flight remains a top-level heartbeat field for compatibility.
message RunnerDrainObservation {
  uint64 generation = 1;
  bool recovery_only = 2;
  uint32 active_activations = 3;
}

message RegisterRequest {
  string runner_id = 1;
  int32 concurrency = 2;
  repeated Capability capabilities = 3;
  map<string, string> labels = 4;
  repeated string namespaces = 5;
  repeated ActivationInventoryItem activations = 6;
  // instance_uid identifies the registering process instance; see
  // protocol.RegisterRunnerRequest.InstanceUID.
  string instance_uid = 7;
  // descriptors_json is the versioned runner descriptor envelope
  // (protocol.RunnerDescriptorSchema) encoded as JSON. Empty means the runner
  // reports no node descriptors. Control decodes and validates it; see
  // protocol.RegisterRunnerRequest.DescriptorsJSON.
  bytes descriptors_json = 8;
}

// ActivationInventoryItem reports a single trigger activation the runner is
// currently hosting. Sent during Register so the control plane can reconcile
// on reconnect, and on every heartbeat inside HostedActivationsReport so the
// control plane can notice a directive that never arrived.
message ActivationInventoryItem {
  string workflow_id = 1;
  string entry_unit_id = 2;
  uint64 generation = 3;
  string workflow_version = 4;
  uint32 replica_index = 5;
}

// HostedActivationsReport is present only when the runner reports. Old
// runners leave the field unset; the nested message gives presence so an
// absent field is never mistaken for "hosts nothing". An empty activations
// list is the explicit, meaningful report that this runner currently hosts no
// activation.
message HostedActivationsReport {
  repeated ActivationInventoryItem activations = 1;
}

message RegisterResponse {
  string runner_id = 1;
  string session_id = 2;
  RunnerControlDirective control = 3;
}

message HeartbeatRequest {
  string runner_id = 1;
  int32 capacity = 2;
  int32 in_flight = 3;
  int64 timestamp = 4;
  string session_id = 5;
  map<string, string> supply_observed = 6;
  // supply_key_id is the 4-byte fingerprint (not key material) of the supply
  // encryption key this runner holds. The server returns supply_key_rotation
  // only when it differs from its own, making rotation delivery convergent.
  string supply_key_id = 7;
  RunnerDrainObservation drain_observation = 8;
  // hosted_activations reports the activations this runner currently hosts.
  // Unset means the runner does not report (an old binary); present with an
  // empty list means it reports and hosts nothing. The server records it per
  // runner so reconciliation can redeliver an Activate whose directive never
  // reached the runner instead of renewing an assignment that hosts nothing.
  HostedActivationsReport hosted_activations = 9;
}

message HeartbeatResponse {
  int64 server_time = 1;
  map<string, string> supply_hints = 2;
  string supply_key_rotation = 3;
  // activations_json carries the JSON-encoded HeartbeatActivations struct
  // (activate/deactivate directives). Using JSON bytes avoids modeling
  // map[string]any params in proto — same pattern as lease_json.
  bytes activations_json = 4;
  RunnerControlDirective control = 5;
}

message PollTaskRequest {
  string runner_id = 1;
  int32 capacity = 2;
  repeated Capability capabilities = 3;
  map<string, string> labels = 4;
  string session_id = 5;
  // Leases this runner's workers are executing right now, so the server
  // replays only leases that never reached it rather than also handing a live
  // task to the same runner's idle workers.
  repeated string active_lease_ids = 6;
  // A capable draining runner requests only replay of already-finalized work.
  // The server independently enforces the same safety boundary.
  bool recovery_only = 7;
}

message PollTaskResponse {
  // lease_json is the JSON-encoded engine.TaskLease, empty when no task is
  // available.
  bytes lease_json = 1;
  // wait_nanos is how long the runner should wait before polling again when no
  // lease is returned.
  int64 wait_nanos = 2;
  RunnerControlDirective control = 3;
}

message ReportResultRequest {
  string runner_id = 1;
  // lease_json is the JSON-encoded engine.TaskLease the result belongs to.
  bytes lease_json = 2;
  // result_json is the JSON-encoded protocol task result.
  bytes result_json = 3;
  string session_id = 4;
  // trace_carrier carries W3C traceparent/tracestate headers injected by the
  // runner from its xflow.task.execute span so the server's report/commit span
  // is parented to the runner's execute span (real W3C remote parent, not a
  // trace_id/span_id string reconstruction). Additive map field; older peers
  // that do not populate it simply leave it empty and the server falls back to
  // the lease's dispatch carrier.
  map<string, string> trace_carrier = 5;
}

message ReportResultResponse {
  bool accepted = 1;
  string error = 2;
}

// ActivationAckRequest mirrors protocol.ActivationAck field-for-field. Status
// is carried as the same lowercase string the JSON wire uses ("active",
// "deactivated", "failed") rather than a proto enum, so the two transports
// decode to byte-identical protocol.ActivationStatus values without a mapping
// table that could drift.
message ActivationAckRequest {
  string runner_id = 1;
  string session_id = 2;
  string workflow_id = 3;
  // workflow_version is REQUIRED for a failed or deactivated status; see
  // protocol.ActivationAck.WorkflowVersion.
  string workflow_version = 4;
  string group_id = 5;
  uint32 replica_index = 6;
  uint64 generation = 7;
  string status = 8;
  string error = 9;
}

// ActivationAckResponse is deliberately empty: the HTTP transport answers a
// successful ack with 200 and an empty JSON object, carrying no payload.
// Failure is reported as a gRPC status, mirroring the HTTP non-2xx path.
message ActivationAckResponse {}

// RenewLeaseRequest mirrors protocol.RenewLeaseRequest field-for-field.
// AuthToken is carried on the message for parity with the DTO, but the gRPC
// server ignores it in favor of the Authorization metadata, same as every
// other request (see overrideTokenFromMetadata).
message RenewLeaseRequest {
  string runner_id = 1;
  string session_id = 2;
  string lease_id = 3;
  string lease_token = 4;
  // extend_ms is the requested extension in milliseconds; see
  // protocol.RenewLeaseRequest.Extend.
  int64 extend_ms = 5;
  string auth_token = 6;
}

// RenewLeaseResponse mirrors protocol.RenewLeaseResponse field-for-field.
// deadline_unix_nano is 0 when Renewed is false, matching the HTTP
// transport's zero-value time.Time on a refusal.
message RenewLeaseResponse {
  bool renewed = 1;
  int64 deadline_unix_nano = 2;
  string error = 3;
}

message RunnerFrame {
  oneof frame {
    HelloFrame hello = 1;
    ResultFrame result = 2;
    ByeFrame bye = 3;
    // Reports the runner's applied control state on an established Connect
    // stream. recovery_only is the runner's request for pre-drain debt only.
    ControlObservationFrame control_observation = 4;
  }
}

message HelloFrame {
  string runner_id = 1;
  int32 concurrency = 2;
  repeated Capability capabilities = 3;
  map<string, string> labels = 4;
  repeated string namespaces = 5;
  // instance_uid: see RegisterRequest.instance_uid.
  string instance_uid = 6;
  // descriptors_json: see RegisterRequest.descriptors_json.
  bytes descriptors_json = 7;
}

message ResultFrame {
  string lease_id = 1;
  bytes lease_json = 2;
  bytes result_json = 3;
}

message ByeFrame {}

// ControlObservationFrame is the stream equivalent of a heartbeat drain
// observation. It is scoped to the session established by the stream's HELLO.
// recovery_only requests only pre-drain debt; the server remains authoritative
// for admission and never treats this declaration as an authorization grant.
message ControlObservationFrame {
  uint64 generation = 1;
  bool recovery_only = 2;
  uint32 active_workers = 3;
  uint32 active_activations = 4;
}

message ServerFrame {
  oneof frame {
    WelcomeFrame welcome = 1;
    TaskFrame task = 2;
    AckFrame ack = 3;
    BackoffFrame backoff = 4;
    KeepaliveFrame keepalive = 5;
    // Carries a desired-state update after the initial WelcomeFrame.
    ControlFrame control = 6;
  }
}

message WelcomeFrame {
  string runner_id = 1;
  int64 server_time = 2;
  // Initial desired state for this stream. Older servers leave it unset.
  RunnerControlDirective control = 3;
}

// ControlFrame delivers a later desired-state update on an established stream.
message ControlFrame {
  RunnerControlDirective directive = 1;
}

message TaskFrame {
  bytes lease_json = 1;
}

message AckFrame {
  string lease_id = 1;
  bool accepted = 2;
  string error = 3;
}

message BackoffFrame {
  int64 wait_nanos = 1;
}

message KeepaliveFrame {}
