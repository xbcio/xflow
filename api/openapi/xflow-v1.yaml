      description: Requires `management.runner_pool.read`; `read_global` adds platform and cross-tenant visibility.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Visible runner pools.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/RunnerPoolView"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/management/runner-pools/{id}:
    get:
      operationId: getRunnerPool
      summary: Get a runner pool
      description: Returns the pool when it is visible to the caller; hidden and unknown pools are both 404.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/RunnerPoolId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Runner pool.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RunnerPoolView"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updateRunnerPool
      summary: Update a runner pool
      description: Mutable settings may change, but allowed namespaces and node types may only be narrowed.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/RunnerPoolId"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunnerPoolUpdateRequest"
      responses:
        "200":
          description: Updated runner pool.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RunnerPoolView"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: deleteRunnerPool
      summary: Soft-delete a runner pool
      description: Soft-deletes a visible pool; subsequent reads and enrollments treat it as not found.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/RunnerPoolId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Deletion acknowledged.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RunnerPoolMutationResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/management/runner-pools/{id}/tokens:
    post:
      operationId: createRunnerPoolToken
      summary: Mint a pool-bound registration token
      description: The plaintext registration token is returned exactly once and the response is `no-store`.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/RunnerPoolId"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunnerPoolTokenCreateRequest"
      responses:
        "200":
          description: Newly minted pool token.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              description: Plaintext registration tokens must not be stored.
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RunnerPoolTokenCreateResponse"
        default:
          $ref: "#/components/responses/DefaultError"
    get:
      operationId: listRunnerPoolTokens
      summary: List a runner pool's registration tokens
      description: Returns metadata only; plaintext and hashes are never included.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/RunnerPoolId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Pool token metadata.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/RunnerPoolTokenView"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/management/runner-pools/{id}/tokens/{token_id}:
    delete:
      operationId: revokeRunnerPoolToken
      summary: Revoke one pool-bound registration token
      description: Revokes only the named token; other live tokens and already-issued identities are unaffected.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/RunnerPoolId"
        - $ref: "#/components/parameters/RunnerPoolTokenId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Revocation acknowledged.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RunnerPoolMutationResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/management/runner-pools/{id}/tokens/{token_id}/audit:
    get:
      operationId: getRunnerPoolTokenAudit
      summary: Read the enroll audit trail for a pool token
      description: Returns enroll attempts for the selected token after verifying the caller can read its runner pool.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/RunnerPoolId"
        - $ref: "#/components/parameters/RunnerPoolTokenId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Enroll audit records.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/EnrollAuditView"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/management/runner-pools/{id}/runners:
    get:
      operationId: listRunnerPoolInstances
      summary: List enrolled runner instances in a pool
      description: Lists the stable system-id to runner-id mappings visible in the selected pool.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/RunnerPoolId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Runner instances.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/RunnerPoolInstanceView"
        default:
          $ref: "#/components/responses/DefaultError"

  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      description: |
        Kubernetes liveness probe. NOT enveloped (§7) — load balancers parse it
        directly. Not authenticated. Returns {"status":"ok"}.
      tags: [Probes]
      security: []
      responses:
        "200":
          description: Process is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthzResponse"

  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe
      description: |
        Kubernetes readiness probe. NOT enveloped (§7) — load balancers parse it
        directly. Not authenticated. Returns ready + leader status; non-leader
        replicas remain ready for the read-only management surface. The process
        and required production dependencies must be available; shutdown or a
        dependency check failure returns 503 with `ready=false`.
      tags: [Probes]
      security: []
      responses:
        "200":
          description: Process and required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
              example:
                ready: true
                leader: true
        "503":
          description: Process is shutting down or a required dependency is unavailable; `ready=false`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
              example:
                ready: false
                leader: false

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Server-issued bearer token bound to a (subject, namespace, scopes) principal.

  parameters:
    WorkflowId:
      name: id
      in: path
      required: true
      description: Server-assigned workflow id.
      schema:
        type: string
    WorkflowVersion:
      name: version
      in: path
      required: true
      description: |
        Version label of the addressed workflow — the current version or a
        retired one. A version label is immutable: it always resolves to the
        definition it was published with.
      schema:
        type: string
    ExecutionId:
      name: id
      in: path
      required: true
      description: Execution id.
      schema:
        type: string
    SignalName:
      name: name
      in: path
      required: true
      description: Signal name.
      schema:
        type: string
    SupplyName:
      name: name
      in: path
      required: true
      description: Supply name (single path segment, no namespace).
      schema:
        type: string
    ArtifactDigest:
      name: digest
      in: path
      required: true
      description: Content digest (the store validates the format).
      schema:
        type: string
    RunnerId:
      name: id
      in: path
      required: true
      description: Runner id.
      schema:
        type: string
    DeadLetterExecId:
      name: execID
      in: path
      required: true
      description: Execution id whose dead-letters to list/replay.
      schema:
        type: string
    RunnerPoolId:
      name: id
      in: path
      required: true
      description: Runner pool id.
      schema:
        type: string
    RunnerPoolTokenId:
      name: token_id
      in: path
      required: true
      description: Pool-bound registration token id.
      schema:
        type: string
    NodeTypesNamespace:
      name: namespace
      in: query
      required: false
      description: |
        Namespace whose live runner-reported node types are merged in. Absent
        means the server registry only. The caller must be allowed
        `workflow.read` in this namespace (403 otherwise; the write scope
        `workflow` implies it); a malformed value fails with 400
        (`namespace_invalid`).
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: An ETag from a previous response; when it (or `*`) matches, the server answers 304.
      schema:
        type: string
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Optional client-supplied request id (charset [A-Za-z0-9._-], length
        1..128). When valid it is echoed verbatim in the response header for
        client-side retry correlation (spec §5.2). Never appears in the body.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,128}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Makes the submission safe to retry. A retry carrying the same key and
        the same request (for an inline definition: the same definition, params,
        entry and test flag; for a registered workflow: the same workflow
        version; for a rerun: the same execution, from_node and
        include_success) is answered 200 with `data.duplicate: true`, the
        execution the first attempt created and its current status. Nothing is
        created by the retry.

        The same key with a *different* request is 409
        `idempotency_key_conflict`, and a concurrent request still working on
        the same key and request is 409 `idempotency_key_in_progress` (retry
        it). A key is scoped to the workflow for a submission, and to the parent
        execution for a rerun, below the caller's namespace.

        The shape is 1-255 characters of [A-Za-z0-9._:-]; anything else is 400
        `idempotency_key_invalid` rather than silently ignored. A server whose
        state store cannot hold the claim refuses the keyed request with 503
        `idempotency_unsupported`: a key the server cannot honor must not be
        answered as if it could.

        The key answers for 24 hours by default (the claim window), capped so
        it never outlives the execution's retention: a retry with the same key
        while the claim is held returns that execution instead of starting the
        work again. After the claim lapses the key is not immediately free: as
        long as the execution it created is still retained, the same key still
        answers `data.duplicate` with that execution — creating it again would
        write over it in place. The key starts a new execution only once both
        the claim and the execution are gone.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]{1,255}$'
        maxLength: 255
        example: order-1
    RunnerControlRequestId:
      name: X-Request-Id
      in: header
      required: true
      description: |
        Required idempotency key for a runner drain or resume mutation. It must
        match `[A-Za-z0-9._-]{1,128}`; absent or invalid values return 400
        `request_id_required` rather than creating an untracked transition.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,128}$'
    WebhookNamespace:
      name: namespace
      in: path
      required: true
      description: |
        Namespace the entry was registered in. It is a CLAIM: the server resolves
        the workflow and compares, and a segment naming another tenant's
        namespace is answered 404 rather than served. The admission always runs
        under the record's own namespace.
      schema:
        type: string
    WebhookWorkflowId:
      name: workflow_id
      in: path
      required: true
      description: Server-assigned workflow id of the definition holding the entry.
      schema:
        type: string
    WebhookEntryUnit:
      name: entry_unit
      in: path
      required: true
      description: |
        Name of the webhook trigger node (the entry unit) within that workflow.
      schema:
        type: string
    WebhookSignature:
      name: X-XFlow-Signature
      in: header
      required: true
      description: |
        `sha256=<hex>` — the HMAC-SHA256 of the exact request body bytes under
        the entry's signing secret. The scheme tag is required. The value is
        never echoed, logged, or reported in an error.
      schema:
        type: string
        pattern: '^sha256=[0-9a-f]{64}$'
    ScheduleNode:
      name: node
      in: path
      required: true
      description: |
        Name of the trigger node the schedule belongs to — the same identity the
        definition, the entry unit and the audit row use. It names a cron or
        timer node of the workflow in the `{id}` segment: a name that is not a
        schedule of the current version is 404 `schedule_not_found`, unless an
        overlay still exists for it (an orphan), which stays readable and
        deletable precisely so it can be cleaned up.
      schema:
        type: string
    IfMatchRevision:
      name: If-Match
      in: header
      required: false
      description: |
        Conditional-write precondition, in the overlay store's own revision
        vocabulary: absent is unconditional, `0` means "only if this schedule
        has no overlay yet" (a create), and any other value means "only if the
        overlay's current revision is exactly this". The revision comes from a
        previous read — `revision` on a ScheduleView — so a lost update fails
        with 409 `schedule_revision_conflict` instead of overwriting another
        operator's change.

        HTTP's symbolic `*` is refused (400 `invalid_if_match`) rather than
        mapped onto one of the three cases: its meaning ("the resource exists")
        has no counterpart here, and quietly choosing for the caller would give
        them a guarantee they did not ask for. The presented value is never
        echoed back.
      schema:
        type: string
        pattern: '^[0-9]+$'

  headers:
    XRequestId:
      description: Echoed X-Request-Id (only when the inbound value was valid).
      schema:
        type: string
    NodeTypesETag:
      description: Strong ETag, "sha256:<hex>" of the data payload bytes, recomputed per request.
      schema:
        type: string
        example: '"sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"'
    RetryAfter:
      description: Whole seconds to wait before retrying; at least 1.
      schema:
        type: integer
        minimum: 1
        example: 1

  responses:
    DefaultError:
      description: Error response — a failure Envelope with success=false and no data field.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: |
        `rate_limited`: the caller's namespace spent its API rate budget
        (`--api-rate` / `--api-burst`). Nothing was audited, persisted or
        executed. `Retry-After` is the time until the bucket holds a token
        again, rounded up to whole seconds. It is distinct from the
        `workflow_concurrency_*` 429s, which a workflow's own
        `settings.concurrency` produces after the request was admitted.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            rateLimited:
              summary: The namespace's API rate budget is spent.
              value:
                success: false
                code: rate_limited
                message: rate limit exceeded
                trace_id: 0123456789abcdef0123456789abcdef
    ServerOverloaded:
      description: |
        `server_overloaded`: this replica is already serving its bound of
        concurrent covered requests (`--api-max-inflight`, default 1024).
        Nothing was audited, persisted or executed. `Retry-After` is a floor;
        the server has no release time to promise.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            serverOverloaded:
              summary: The replica's inflight bound is full.
              value:
                success: false
                code: server_overloaded
                message: server is overloaded
                trace_id: 0123456789abcdef0123456789abcdef

  schemas:
    Envelope:
      type: object
      description: |
        The user-face response envelope (spec §3). On success success=true,
        code="200" (string), and data carries the payload. On failure
        success=false, data is omitted (not null) — except for
        workflow_param_invalid, which carries data.param_issues — and code
        carries a stable snake_case business identifier. trace_id is server-authoritative
        (W3C 32-hex).
      required: [success, code, message, trace_id]
      properties:
        success:
          type: boolean
          description: Strictly consistent with the HTTP status (2xx → true).
        code:
          type: string
          description: Machine-readable identifier. "200" on success; stable snake_case business code on failure.
        message:
          type: string
          description: Human-readable text. "" on success. Never carries credentials, node output, SQL, or stack traces (§3.5).
        data:
          description: Payload on success. Omitted on failure, except workflow_param_invalid (see ParamInvalidErrorEnvelope).
        trace_id:
          type: string
          description: Server-authoritative W3C trace id (32 hex).
          pattern: '^[0-9a-f]{32}$'

    ErrorEnvelope:
      type: object
      description: The failure shape of the Envelope — data is absent on failure.
      additionalProperties: false
      required: [success, code, message, trace_id]
      properties:
        success:
          type: boolean
          description: Always false on this shape.
          example: false
        code:
          type: string
          description: Stable snake_case business error code.
          example: workflow_not_found
        message:
          type: string
          description: Human-readable text. May change; clients must branch on code.
          example: workflow not found
        trace_id:
          type: string
          description: Server-authoritative W3C trace id (32 hex).
          pattern: '^[0-9a-f]{32}$'

    RegisterWorkflowResponse:
      type: object
      description: Echoes the persisted workflow id and non-fatal compile warnings.
      required: [workflow_id]
      properties:
        workflow_id:
          type: string
        warnings:
          type: array
          items:
            type: string
          description: Non-fatal compile diagnostics (node/referenced-node names only — never output or parameter values, §3.5).
        param_issues:
          type: array
          items:
            $ref: "#/components/schemas/ParamIssue"
          description: |
            ParamSpec validation findings, separate from the compile warnings.
            In warn mode (the default) every issue is reported and none
            rejects; in enforce mode an error-severity issue rejects the
            request (400 workflow_param_invalid), so only warnings appear here.
            Omitted when there are none or validation is off.

    ParamIssue:
      type: object
      description: |
        One ParamSpec validation finding. Node types not registered in the
        server process are skipped (counted in
        xflow_param_validation_skipped_total), never reported. The message
        names the parameter and the rule, never the value (§3.5).
      required: [node, path, code, message, severity]
      properties:
        node:
          type: string
          description: Node name; inside a sub-graph body, "parent/child".
          example: pause
        path:
          type: string
          description: JSON Pointer relative to the node, e.g. /parameters/method, /parameters/aggregate/dead_letter_topic, /parameters/rules/0/condition.
          example: /parameters/duration
        code:
          type: string
          description: required | enum | one_of | constraint.<name> (min, max, min_length, max_length, pattern, min_items, max_items, unique_items) | format.<name> (duration, cron, expression, sha256-digest, json).
          example: required
        message:
          type: string
          description: Human-readable; may change. Clients branch on code.
          example: duration is required
        severity:
          type: string
          enum: [error, warning]
          description: Only error rejects, and only in enforce mode.

    ParamInvalidErrorEnvelope:
      type: object
      description: |
        The failure Envelope of `workflow_param_invalid` — the one failure that
        carries data, so a client can place every issue on its field.
      additionalProperties: false
      required: [success, code, message, data, trace_id]
      properties:
        success:
          type: boolean
          description: Always false on this shape.
          example: false
        code:
          type: string
          description: Always workflow_param_invalid on this shape.
          enum: [workflow_param_invalid]
        message:
          type: string
          description: Human-readable summary. May change; clients must branch on code.
        data:
          type: object
          description: The rejected definition's findings.
          additionalProperties: false
          required: [param_issues]
          properties:
            param_issues:
              type: array
              description: Every finding, warnings included.
              items:
                $ref: "#/components/schemas/ParamIssue"
        trace_id:
          type: string
          description: Server-authoritative W3C trace id (32 hex).
          pattern: '^[0-9a-f]{32}$'

    ExecuteWorkflowRequest:
      type: object
      required: [workflow]
      properties:
        workflow:
          $ref: "#/components/schemas/WorkflowDef"
        entry:
          type: string
          description: Explicit entry node; empty uses the graph default start node.
        input:
          type: object
          additionalProperties: true
        params:
          type: object
          additionalProperties: true
        test:
          type: boolean
          description: |
            Run as a test execution. Under settings.pin_data_mode test_only
            (the default), only test executions serve pin_data mocks for the
            pinned nodes instead of running them.

    ExecuteRegisteredRequest:
      type: object
      description: Optional body for executing a registered workflow by id.
      properties:
        entry:
          type: string
        input:
          type: object
          additionalProperties: true
        params:
          type: object
          additionalProperties: true
        test:
          type: boolean
          description: |
            Run as a test execution. Under settings.pin_data_mode test_only
            (the default), only test executions serve pin_data mocks for the
            pinned nodes instead of running them.
        version:
          type: string
          description: |
            Which version of the addressed workflow to run. Omitted or equal to
            the current version runs the live record; a retired version runs
            from the graph snapshot captured when it was retired. The name is
            always taken from the path record, so this field can never select
            another workflow; an unknown version is 404
            `workflow_version_not_found`, and a retired payload that no longer
            reproduces under the current compiler is 409
            `workflow_version_unavailable`.
          example: v2

    ExecuteWorkflowResponse:
      type: object
      required: [execution_id]
      properties:
        execution_id:
          type: string
        status:
          # Where the submission landed: `running` when the execution started,
          # `queued` when it is waiting for a workflow concurrency slot
          # (settings.concurrency with mode: queue) and no work has started. It
          # is the execution's status read back after the submission, so a short
          # execution that already finished reports its terminal status instead.
          $ref: "#/components/schemas/ExecutionStatus"
        queue_position:
          type: integer
          minimum: 1
          description: |
            Place in line, 1-based, present only while `status` is `queued`. `1`
            is the head — the submission the next release promotes. Absent for
            every other status: a running execution is not waiting for anything,
            and `0` would read as a position a client could display.
        param_issues:
          type: array
          items:
            $ref: "#/components/schemas/ParamIssue"
          description: |
            ParamSpec validation findings for an inline definition
            (POST /v1/workflows/execute only; a registered workflow was
            validated at registration). Same semantics as
            RegisterWorkflowResponse.param_issues.
        duplicate:
          type: boolean
          description: |
            Present and true when the request carried an Idempotency-Key that
            was already used for the same request: no new execution was
            started, and `execution_id` and `status` describe the execution the
            first request created. `status` is that execution's status read
            now, so it may be `queued`, `paused` or terminal. Absent (or false)
            on a fresh submission and on every request without a key.

    SignalRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        data:
          type: object
          additionalProperties: true

    RerunExecutionRequest:
      type: object
      required: [from_node]
      properties:
        from_node:
          type: string
          description: |
            The node the new execution starts at. Everything upstream of it is
            copied from the source execution; it and everything downstream of it
            run again.
        include_success:
          type: boolean
          default: false
          description: |
            Accept a `success` source execution. `failed`, `canceled` and
            `timeout` sources are accepted either way.

    RerunExecutionResponse:
      type: object
      required: [execution_id]
      properties:
        execution_id:
          type: string
          description: The NEW execution. The source execution is unchanged.
        status:
          $ref: "#/components/schemas/ExecutionStatus"
        queue_position:
          type: integer
          description: |
            The new execution's 1-based place in its workflow's concurrency
            queue while it is `queued`, 0 once it has started. Like the detail's
            `queue_position` it is a snapshot of a line that moves, and it is
            absent for an execution that never queued.
        duplicate:
          type: boolean
          description: |
            Present and true when the request carried an Idempotency-Key that
            was already used for the same rerun of this execution: no new
            execution was created, and `execution_id` and `status` describe the
            rerun the first request created. Absent (or false) on a fresh
            rerun and on every request without a key.

    AcceptedResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
          example: true

    RevokedResponse:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: boolean
          example: true

    RemovedResponse:
      type: object
      required: [removed]
      properties:
        removed:
          type: boolean
          example: true

    WaitTimeoutResponse:
      type: object
      required: [execution_id, status, timed_out]
      properties:
        execution_id:
          type: string
        status:
          $ref: "#/components/schemas/ExecutionStatus"
        timed_out:
          type: boolean
          example: true

    LeaderResponse:
      type: object
      required: [is_leader]
      properties:
        is_leader:
          type: boolean

    HealthzResponse:
      type: object
      description: Bare (non-enveloped) liveness body — load balancers parse it directly.
      required: [status]
      properties:
        status:
          type: string
          example: ok

    WebhookEntryAdmission:
      type: object
      description: |
        The bare (non-enveloped) entry-seed admission result, as the runner
        protocol face defines it (spec §0.1/§8.2). `state` is the discriminator:
        `accepted` (a new execution, or `duplicate: true` for a redelivery the
        engine recognised as the same content under the same event id), `queued`
        (accepted into the workflow's concurrency queue), or `conflict` (the
        event id was already admitted carrying different content — the 409 case,
        which still carries the existing execution id). A refusal is the
        separate 429 shape.
      required: [state, execution_id]
      properties:
        state:
          type: string
          enum: [accepted, queued, conflict]
          example: accepted
        execution_id:
          type: string
          description: |
            Execution this event belongs to. For a redelivery it is the id of the
            execution the first delivery created.
          example: exec-01H8XG
        duplicate:
          type: boolean
          description: True when the event id was already admitted with the same result.
        queued:
          type: boolean
          description: True when the admission was queued rather than started immediately.
        queue_position:
          type: integer
          description: Position in the workflow's concurrency queue, when queued.

    WebhookEntryRefusal:
      type: object
      description: |
        The bare refusal shape (429): nothing was persisted and the caller still
        owns the event, so it retries after `retry_after_seconds`.
      required: [state, error]
      properties:
        state:
          type: string
          enum: [over_limit, queue_full]
          example: over_limit
        error:
          type: string
          enum: [workflow_concurrency_limit, workflow_concurrency_queue_full]
          example: workflow_concurrency_limit
        retry_after_seconds:
          type: integer
          description: |
            Lower bound, in seconds, on how long to wait before retrying. It
            carries the same floor as the Retry-After header, for senders that
            read only the body.
          example: 1

    WebhookEntryError:
      type: object
      description: |
        The bare failure shape: one generic `error` code, and no other field —
        no signature, no secret, no internal path, no echo of the request.
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          description: Stable snake_case code.
          enum:
            - signature_invalid
            - workflow_not_found
            - entry_unit_not_found
            - method_not_allowed
            - payload_too_large
            - body_unreadable
            - entry_unavailable
            - rate_limited
            - server_overloaded
            - route_not_found
            - internal server error
          example: signature_invalid

    ReadyResponse:
      type: object
      description: Bare (non-enveloped) readiness body — load balancers parse it directly.
      required: [ready, leader]
      properties:
        ready:
          type: boolean
        leader:
          type: boolean

    ExecutionDetail:
      type: object
      description: Audit snapshot of an execution (engine.ExecutionDetail).
      required: [execution_id, status]
      additionalProperties: false
      properties:
        execution_id:
          type: string
        workflow_id:
          type: string
          maxLength: 64
          description: |
            The workflow definition identity this execution ran, captured
            immutably at submission (the same identity the `workflow_id` list
            filter matches). Absent when the submission carried no definition
            id — an inline definition with no server id, or an execution
            recorded before the field existed. Absence means unattributed; a
            client must not infer the current workflow from the name.
        workflow_version:
          type: string
          description: |
            The version label of the definition this execution ran, captured
            with `workflow_id`. The editor resolves the run's definition
            snapshot with `GET /v1/workflows/{id}/versions/{version}`.
            Absent when there is no recorded identity or the definition
            declares no version.
        status:
          $ref: "#/components/schemas/ExecutionStatus"
        created_at:
          type: string
          format: date-time
          description: |
            When the backend recorded the execution, from the backend's clock.
            The left edge of a finished run's duration (`updated_at -
            created_at`). Absent for an execution recorded before the backends
            stamped this fact; absence means unknown, never "now".
        updated_at:
          type: string
          format: date-time
          description: |
            The wall clock of the execution's latest accepted status
            transition, creation included. The right edge of a finished run's
            duration. Absent under the same rule as `created_at`.
        parent_execution_id:
          type: string
          description: |
            The execution this one derives from — set only on an execution
            created by POST /v1/executions/{id}/rerun. The link is recorded on
            the NEW execution; the source keeps no reference to its reruns, so a
            client that wants the tree walks from the child up.
        rerun_from:
          type: string
          description: |
            The node the derivation started at: everything upstream of it was
            copied from `parent_execution_id` rather than run again. Set
            together with `parent_execution_id`, absent on every other
            execution.
        parent_node:
          type: string
          description: |
            The `xflow.subworkflow` node of `parent_execution_id` whose wait
            this child execution satisfies. Set only on a sub-workflow child,
            which shares the `parent_execution_id` field with the rerun link —
            the two are told apart by which companion field is present: a rerun
            carries `rerun_from`, a sub-workflow child carries `parent_node`.
            The child-side half of the drill-down; the parent-side half is the
            node's `child_execution_id`.
        error:
          type: string
        queue_position:
          type: integer
          description: |
            Where a `queued` execution stands in its workflow's concurrency
            queue: 1 is the head, the execution the next slot release promotes.
            Absent (and 0 when explicitly read) for every execution that is not
            queued — including all executions of workflows that never queue —
            and for stores that cannot report a position. It is a snapshot of a
            line that moves, so it can be stale by the time it is read; it is
            never a promise of when the execution will start.
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/NodeDetail"

    NodeDetail:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          $ref: "#/components/schemas/NodeStatus"
        attempt:
          type: integer
        port:
          type: string
        error:
          type: string
        error_details:
          type: object
          description: |
            Sanitized, bounded machine-readable failure details. The current
            runtime exposes a flat scalar map for non-private node output; the
            field is absent when no classified failure detail is available.
          additionalProperties: true
        output:
          type: object
          additionalProperties: true
        child_execution_id:
          type: string
          description: |
            The child execution an `xflow.subworkflow` node started and waited
            on; absent on every other node. It survives the node's commit, so a
            finished node's child is still drillable. The parent-side half of
            the drill-down; the child-side half is the child execution's
            `parent_node`.
        started_at:
          type: string
          format: date-time
          description: |
            When the node received its FIRST lease. Write-once: a retry (a new
            attempt) and a cyclic reactivation do not restamp it. Absent when
            the node never started — it was skipped, fanned in without
            execution, or seeded from its parent — and on records written
            before the backends stamped this fact.
        finished_at:
          type: string
          format: date-time
          description: |
            When the node first reached a terminal status. Write-once: a
            duplicate terminal write and a cyclic reactivation keep the first
            value. Absent while the node has not finished, under the same
            "unknown, never guess" rule as `started_at`.

    ExecutionStatus:
      type: string
      description: |
        Lifecycle status of an execution. `pending` is the persisted default
        before a store records a transition; live executions are `running`
        (dispatched), `queued` (a queue-mode submission waiting for a workflow
        concurrency slot) or `paused` (an operator suspended its dispatch).
        Terminal statuses are `success`, `failed`, `canceled` and `timeout`.
        `queued` and `paused` are NOT terminal: both can still be canceled, and
        both are still waited on by GET /v1/executions/{id}/wait.
      enum: [pending, queued, paused, running, success, failed, canceling, canceled, timeout]

    ExecutionListResponse:
      type: object
      description: |
        The `data` payload of an execution collection response — the mandated
        `{list, total}` shape (spec §3.3), never a bare array.
      required: [list, total]
      properties:
        list:
          type: array
          description: The requested page. Empty pages are `[]`, never `null`.
          items:
            $ref: "#/components/schemas/ExecutionListItem"
        total:
          type: integer
          description: |
            The exact number of executions in the caller's own namespace that
            match the request's filter — the size of the collection after
            filtering, which is what spec §3.3 defines `total` as. It is
            independent of the page requested, so `total` may exceed `list`'s
            length; in particular it is not `offset + len(list)` and it does not
            shrink as pages are consumed.
          example: 3

    ExecutionListItem:
      type: object
      description: |
        One row of an execution list: a summary of a recorded execution, not its
        snapshot. The stored definition, params, and runtime JSON are
        deliberately absent — a page of them would be
        O(page × workflow size) on the wire — and are read one execution at a
        time via `GET /v1/executions/{id}`.

        `workflow_id` is the identity of the workflow the execution ran, recorded
        at submit time from the server-resolved definition; it is what the
        `workflow_id` query parameter matches exactly. `workflow_name` beside it
        is the display string and is NOT an identity — two namespaces can hold
        the same name, and it is not immutable across a re-registration under
        the same id.
      required: [execution_id, namespace, workflow_id, workflow_name, status, error, created_at, updated_at]
      properties:
        execution_id:
          type: string
          description: The `{id}` of the inspect/signal/cancel/wait routes.
        namespace:
          type: string
          description: |
            The server-issued isolation scope this execution belongs to. It is
            always the authenticated principal's namespace — a row is returned
            only when the two are exactly equal.
        workflow_id:
          type: string
          description: |
            Server-assigned id of the workflow the execution ran, recorded at
            submit time. `""` means UNATTRIBUTED: the row predates the column,
            or the submission carried no workflow definition id (an inline
            definition with none). An unattributed row matches no `workflow_id`
            filter on the collection endpoint.
        workflow_name:
          type: string
          description: Name of the workflow this execution ran, as recorded at submit time.
        status:
          $ref: "#/components/schemas/ExecutionStatus"
        error:
          type: string
          description: Failure message when the execution failed; `""` otherwise.
        created_at:
          type: string
          format: date-time
          description: When the execution was created. The listing's primary sort key, descending.
        updated_at:
          type: string
          format: date-time
          description: When the execution row was last updated.
        queue_position:
          type: integer
          description: |
            Where a `queued` row stands in its workflow's concurrency queue:
            `1` is the head, the execution the next slot release promotes.
            Present only while `status` is `queued`; absent for every other
            status and when the server could not read the live position, in
            which case the place in line is UNKNOWN — absence never means the
            head. Same semantics as `ExecutionDetail.queue_position`: it is
            read from live queue state at list time, not stored with the row,
            and the read is best effort so a position that is unavailable
            omits the field rather than failing the page.

    NodeStatus:
      type: string
      enum: [pending, running, committing, success, failed, skipped, pinned, expired, suspended, continued, canceled, waiting]
      description: |
        Lifecycle state of a node in an execution detail. `expired` is
        derived, not stored: it marks a member of a transient group
        (`groups[].mode: transient`) whose records are gone because the
        execution is terminal and the group's artifacts have passed their
        completion TTL. Within that window the member's exit output is served
        normally.

    RunnerListItem:
      type: object
      description: |
        One entry in the fleet roster. Includes runners that enrolled and received
        an identity but never registered (state: never_connected), which the runner
        directory itself cannot enumerate.
      required: [runner_id, enrolled, state]
      properties:
        runner_id:
          type: string
        enrolled:
          type: boolean
          description: |
            Whether this runner's credential came from the enrollment endpoint
            rather than a static policy file. This is NOT "is it active".
        state:
          type: string
          enum: [online, offline, never_connected]
          description: |
            Server-computed liveness. Do not recompute the threshold client-side:
            `online` has a fresh heartbeat, `offline` has no fresh heartbeat
            confirmed, and `never_connected` is an enrollment-issued identity
            absent from the current directory. This is not task-placement
            readiness; inspect desired_state as well.
        last_heartbeat:
          type: string
          format: date-time
          description: Most recent runner heartbeat when a directory snapshot is available.
        issued_at:
          type: string
          format: date-time
          description: Credential issuance time when recorded; may be present for enrolled runners, including never_connected ones.
        revoked_at:
          type: string
          format: date-time
          description: Credential revocation time, independent of the runner's liveness state.
        desired_state:
          type: string
          enum: [active, draining]
          description: |
            Present when the runner has a control snapshot. `draining` means the
            runner is winding down but may still be heartbeating and reporting
            state: online.

    RunnerSnapshot:
      type: object
      description: Read-only registration and liveness view of one runner.
      required: [runner_id, capacity, in_flight, last_heartbeat]
      properties:
        runner_id:
          type: string
        capacity:
          type: integer
        in_flight:
          type: integer
        labels:
          type: object
          additionalProperties:
            type: string
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        namespaces:
          type: array
          items:
            type: string
        last_heartbeat:
          type: string
          format: date-time
        control:
          $ref: "#/components/schemas/RunnerControlSnapshot"

    RunnerControlRequest:
      type: object
      description: Operator rationale for a drain or resume mutation.
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          description: Required operator rationale after leading/trailing whitespace is removed; the server limits its UTF-8 encoding to 512 bytes.

    RunnerControlSnapshot:
      type: object
      description: |
        Durable desired state and current drain projection for one runner. A
        drain response confirms the server-side new-claim gate only.
        `phase=complete` is a conditional convergence observation, not a remote
        shutdown, a command to terminate a worker, or authorization to discard
        unknown or unsettled work. `phase=timed_out` means the drain deadline
        elapsed while the server-side admission gate remains closed; it does not
        resume, evict, cancel, or reclaim work.
      required: [desired_state, generation]
      properties:
        desired_state:
          type: string
          enum: [active, draining]
        generation:
          type: integer
          format: uint64
          minimum: 0
          description: Monotonically increasing desired-state transition generation.
        requested_at:
          type: string
          format: date-time
        reason:
          type: string
        drain:
          $ref: "#/components/schemas/RunnerDrainSnapshot"

    RunnerDrainSnapshot:
      type: object
      description: |
        Durable server-side debt and runner-local observation projection while
        the desired state is `draining`. `phase=complete` requires both the
        server-side debt predicate and a fresh quiet observation from the current
        live runner session for the current control generation. `phase=timed_out`
        leaves the runner draining and can later become `complete` after the
        blockers settle. A complete or timed_out phase never proves that the
        runner process exited, forces a worker to stop, or authorizes discarding
        unknown or unsettled work.
      required: [phase, active_claims, leased_tasks, unsettled_drain_debt, handoff_debt, lease_may_exist_debt, replayable_debt, pending_activation_cleanup, server_quiescent, runner_quiescent]
      properties:
        phase:
          type: string
          enum: [quiescing, complete, timed_out]
          description: Complete only when both `server_quiescent` and `runner_quiescent` are true. Timed out means the deadline elapsed with one or more blockers and leaves the admission gate closed.
        deadline_at:
          type: string
          format: date-time
          description: Fixed deadline created by the ACTIVE-to-DRAINING transition. Same-state requests, receipt replays, and runner re-registration do not extend it.
        active_claims:
          type: integer
          minimum: 0
        leased_tasks:
          type: integer
          minimum: 0
        unsettled_drain_debt:
          type: integer
          minimum: 0
          description: Authoritative count of non-terminal pre-drain handoffs owned by this runner.
        handoff_debt:
          type: integer
          minimum: 0
          description: Unfinalized handoffs that require an engine-aware resolver.
        lease_may_exist_debt:
          type: integer
          minimum: 0
          description: Crash-fenced handoffs for which an engine lease may exist but is not yet confirmed.
        replayable_debt:
          type: integer
          minimum: 0
          description: Finalized lease handoffs awaiting result commit or token-fenced reclaim.
        pending_activation_cleanup:
          type: integer
          minimum: 0
          description: Durable drain-triggered trigger deactivation obligations awaiting a matching session- and generation-fenced receipt.
        server_quiescent:
          type: boolean
          description: True only when the built-in directory has zero active claims, leased tasks, unsettled handoff debt, and durable activation-cleanup obligations for this runner.
        runner_quiescent:
          type: boolean
          description: True only after a heartbeat observation from the current live session, fenced to the current control generation, reports `recovery_only=true`, `in_flight=0`, and `active_activations=0`.

    Capability:
      type: object
      required: [node_type]
      properties:
        node_type:
          type: string
        node_version:
          type: integer
        runtimes:
          type: array
          items:
            type: string
        features:
          type: array
          items:
            type: string
        resources:
          type: array
          items:
            type: string
        credentials:
          type: array
          items:
            type: string

    DeadLetterListResponse:
      type: object
      description: One cursor-paginated page of dead-lettered outbox entries.
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/OutboxEntry"
        next_cursor:
          type: string
          description: Omitted (or empty) when the page is the last.

    OutboxEntry:
      type: object
      description: A durable task-delivery intent (engine.OutboxEntry).
      required: [id, task]
      properties:
        id:
          type: string
        task:
          $ref: "#/components/schemas/Task"
        available_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        attempts:
          type: integer
        leased_from_score_ms:
          type: integer
          description: Internal lease bookkeeping; present only on leased entries.
        lease_deadline_ms:
          type: integer
          description: Internal lease bookkeeping; present only on leased entries.

    Task:
      type: object
      required: [execution_id, node_name, node_idx, type]
      properties:
        execution_id:
          type: string
        node_name:
          type: string
        node_idx:
          type: integer
        type:
          type: integer
          description: Task type discriminator (engine.TaskType; 0 = node exec, 1 = node resume).
        payload:
          type: object
          additionalProperties: true
          description: Present only for node-resume tasks.

    DeadLetterReplayRequest:
      type: object
      required: [entry_id, reason]
      properties:
        entry_id:
          type: string
        request_id:
          type: string
          description: Caller-supplied idempotency key; empty means the store mints one.
        reason:
          type: string
          description: Required, length-bounded operator rationale.

    DeadLetterReplayResponse:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          description: |
            Stable replay outcome (replayed, already_replayed, not_found,
            rejected_terminal, rejected_inactive, rejected_node_terminal,
            rejected_activation_mismatch, rejected_metadata_missing,
            invalid_request, unauthorized).
        audit_id:
          type: string
        execution_id:
          type: string
        node_id:
          type: string
        activation_id:
          type: string

    RunnerPoolCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        owner_kind:
          type: string
          enum: [tenant, platform]
          default: tenant
        allowed_namespaces:
          type: array
          items:
            type: string
        allowed_node_types:
          type: array
          items:
            type: string
          description: Non-global callers must list concrete node types and cannot use `*`.
        labels:
          type: object
          additionalProperties:
            type: string
        max_instances:
          type: integer
          minimum: 0
          description: Zero means unlimited.
        inherit_namespaces:
          type: boolean
        paused:
          type: boolean

    RunnerPoolUpdateRequest:
      type: object
      description: Every field is optional. Scope fields may only narrow their current values.
      properties:
        name:
          type: string
          minLength: 1
        allowed_namespaces:
          type: array
          items:
            type: string
        allowed_node_types:
          type: array
          items:
            type: string
        labels:
          type: object
          additionalProperties:
            type: string
        max_instances:
          type: integer
          minimum: 0
        inherit_namespaces:
          type: boolean
        paused:
          type: boolean

    RunnerPoolView:
      type: object
      required: [id, name, owner_kind, owner_namespace, allowed_namespaces, allowed_node_types, labels, max_instances, inherit_namespaces, paused, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        owner_kind:
          type: string
          enum: [tenant, platform]
        owner_namespace:
          type: string
          description: Empty for platform-owned pools.
        allowed_namespaces:
          type: array
          items:
            type: string
        allowed_node_types:
          type: array
          items:
            type: string
        labels:
          type: object
          additionalProperties:
            type: string
        max_instances:
          type: integer
          minimum: 0
        inherit_namespaces:
          type: boolean
        paused:
          type: boolean
        created_at:
          type: string
          format: date-time

    RunnerPoolTokenCreateRequest:
      type: object
      properties:
        expires_in_seconds:
          type: integer
          format: int64
          minimum: 0
          description: Omit for the deployment default; zero requests no expiry.

    RunnerPoolInstanceView:
      type: object
      required: [system_id, runner_id, state, created_at, last_enrolled_at]
      properties:
        system_id:
          type: string
        runner_id:
          type: string
        instance_uid:
          type: string
        state:
          type: string
          enum: [active, draining, pruned]
        created_at:
          type: string
          format: date-time
        last_enrolled_at:
          type: string
          format: date-time

    RunnerPoolMutationResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [deleted, revoked]

    RunnerPoolTokenCreateResponse:
      type: object
      description: |
        The ONLY place the plaintext code ever appears in this API. It is not
        recoverable afterwards — not from the list endpoint, not from the
        database (only its hash is persisted).
      required: [id, code, max_uses]
      properties:
        id:
          type: string
        code:
          type: string
          description: |
            Plaintext registration code. Returned only here, never again —
            but usable for as many enrollments as its lifetime and `max_uses`
            allow.
        expires_at:
          type: string
          format: date-time
          description: Absolute UTC expiry time. Omitted when the code does not expire.
        max_uses:
          type: integer
          minimum: 0
          description: Maximum enrollments permitted; 0 means unlimited.


    RunnerPoolTokenView:
      type: object
      description: |
        The list projection of a registration code. Deliberately carries
        neither the plaintext nor its hash: publishing sha256(code) would make
        every code offline-crackable by anyone who can read the list.
      required: [id, revoked, created_at, allowed_namespaces, allowed_node_types, max_uses, use_count]
      properties:
        id:
          type: string
        allowed_namespaces:
          type: array
          items:
            type: string
          description: |
            Always present, `[]` rather than `null` when the code grants
            nothing. Required so a generated client can type it as a plain
            array; the server normalizes at the projection boundary.
        allowed_node_types:
          type: array
          items:
            type: string
          description: |
            Always present, `[]` rather than `null`. An empty list is not "no
            restriction": `RunnerPolicy.Allows` reports false for every node
            type, so a runner enrolled with such a code can execute nothing.
        revoked:
          type: boolean
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: |
            When the code stops being accepted by enroll. Absent means it
            never expires. There is deliberately no computed `expired`
            boolean beside it: a second representation of the same fact is a
            second thing that can drift from the server's own verdict.
        max_uses:
          type: integer
          description: |
            The code's enrollment ceiling; 0 means unlimited. Always present,
            including the 0 an uncapped code carries — omitting it would make
            "unlimited" indistinguishable from a server too old to have the
            field.
        use_count:
          type: integer
          description: |
            How many runners this code has already enrolled. Always present,
            and always meaningful: it counts up even for an uncapped code, so
            it is the record of how widely a code has been used regardless of
            whether a ceiling was ever set.

            Compare it against `max_uses` to see how much of the ceiling is
            spent. There is deliberately no computed `exhausted` boolean, for
            the same reason there is no `expired` one.

    EnrollAuditView:
      type: object
      description: One recorded enroll attempt (successful or failed) against a registration code.
      required: [success, at]
      properties:
        success:
          type: boolean
        reason:
          type: string
          description: Present only on a failed attempt.
        runner_id:
          type: string
          description: Present only on a successful attempt.
        source_ip:
          type: string
        at:
          type: string
          format: date-time

    WorkflowListResponse:
      type: object
      description: |
        The `data` payload of a workflow collection response — the mandated
        `{list, total}` shape (spec §3.3), never a bare array.
      required: [list, total]
      properties:
        list:
          type: array
          description: The requested page. Empty pages are `[]`, never `null`.
          items:
            $ref: "#/components/schemas/WorkflowListItem"
        total:
          type: integer
          description: |
            The exact number of workflows registered in the caller's own
            namespace — the size of the collection after filtering, which is
            what spec §3.3 defines `total` as. It is independent of the page
            requested, so `total` may exceed `list`'s length; in particular it
            is not `offset + len(list)` and it does not shrink as pages are
            consumed.
          example: 3

    WorkflowListItem:
      type: object
      description: |
        One row of a workflow list: a summary of a registered workflow, not its
        definition. The definition and compiled graph are deliberately absent —
        a page of definitions would be O(page × definition size) on the wire —
        and are read one at a time via `GET /v1/workflows/{id}`.
      required: [id, name, version, definition_hash, registry_revision]
      properties:
        id:
          type: string
          description: Server-assigned workflow id (the `{id}` of the read/replace/deregister routes).
        name:
          type: string
        version:
          type: string
        definition_hash:
          type: string
          description: |
            Opaque identifier of the stored definition's runtime semantics.
            Compare it only for equality; its format is not part of the
            contract. It ignores the description, ids and editor metadata, and
            a builtin node parameter left out hashes like its declared default,
            so it does not change on every definition change: detect a
            metadata edit through `registry_revision`. The server may rewrite
            it in place to a newer hash format (for example `sha256:` to
            `runtime-sha256:`) without any change to the definition; such an
            upgrade still advances `registry_revision`.
        registry_revision:
          type: integer
          format: uint64
          description: |
            The registry's monotonically increasing revision for this record.
            Opaque except for ordering and equality; it is the compare-and-swap
            token a replacement must present.

    WorkflowVersionListResponse:
      type: object
      description: |
        The `data` payload of `GET /v1/workflows/{id}/versions` — the mandated
        `{list, total}` shape (spec §3.3), never a bare array.
      required: [list, total]
      properties:
        list:
          type: array
          description: |
            The requested page, ordered current version first, then retired
            versions newest-retirement first. Empty pages are `[]`, never
            `null`.
          items:
            $ref: "#/components/schemas/WorkflowVersionListItem"
        total:
          type: integer
          description: |
            The exact size of the workflow's version history — the current
            version plus every retained retired version — independent of the
            page requested.
          example: 3

    WorkflowVersionListItem:
      type: object
      description: |
        One row of a workflow's version list: a label, not a definition. The
        definition and compiled graph are deliberately absent, for the same
        reason a `WorkflowListItem` omits them; read one version's definition
        via `GET /v1/workflows/{id}/versions/{version}`.
      required: [version, definition_hash, registry_revision, current, archived]
      properties:
        version:
          type: string
          description: The version label. Immutable once published.
        definition_hash:
          type: string
          description: |
            Opaque identifier of this version's stored definition — the hash
            the version was published with. Compare it only for equality; its
            format is not part of the contract.
        registry_revision:
          type: integer
          format: uint64
          description: |
            For the current row, the live record's compare-and-swap revision.
            For an archived row, the revision the version was retired at, which
            is also its retirement order (newest first down the list).
        current:
          type: boolean
          description: Whether this is the version the live record represents.
        archived:
          type: boolean
          description: |
            Whether this version is a retired history entry. Complementary to
            `current`; both are carried so a row's state is readable without
            inferring it from position.

    RollbackWorkflowRequest:
      type: object
      description: Body of `POST /v1/workflows/{id}/rollback`.
      properties:
        version:
          type: string
          description: |
            The version to install as the current record. An omitted or empty
            value means the current version, which is the no-op branch.
          example: v1

    RollbackWorkflowResponse:
      type: object
      description: The outcome of a rollback.
      required: [workflow_id, version, unchanged]
      properties:
        workflow_id:
          type: string
          description: The workflow id — unchanged by a rollback (version ownership follows the id).
        version:
          type: string
          description: The version that is now current.
        unchanged:
          type: boolean
          description: |
            True when nothing was written because the requested version already
            was the current one (including on a replayed request).

    WorkflowDef:
      type: object
      description: |
        The top-level DSL workflow definition (types.WorkflowDef). On write
        requests, id and namespace are optional server-authoritative fields.
      required: [name]
      properties:
        id:
          type: string
          description: Server-assigned resource id. Refused on registration (`POST /v1/workflows`, 400 `workflow_invalid`) and on inline execute; for PUT it must match the path id when supplied.
        namespace:
          type: string
          description: Server-authoritative isolation scope; optional on writes, injected by the handler, and never trusted from the client body.
        name:
          type: string
        version:
          type: string
        description:
          type: string
        spec:
          type: string
        runner_selector:
          $ref: "#/components/schemas/RunnerSelector"
        context:
          $ref: "#/components/schemas/WorkflowContext"
        settings:
          $ref: "#/components/schemas/WorkflowSettings"
        options:
          $ref: "#/components/schemas/WorkflowOptions"
        credentials:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CredentialDef"
        params:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ParamDef"
        node_templates:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/NodeTemplate"
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/NodeDef"
        groups:
          type: array
          description: Co-location groups declared by the workflow definition.
          items:
            $ref: "#/components/schemas/GroupDef"
        connections:
          $ref: "#/components/schemas/Connections"
        outputs:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/WorkflowOutput"
        pin_data:
          type: object
          additionalProperties: true
        dependency_edges:
          type: array
          items:
            $ref: "#/components/schemas/DependencyEdge"

    NodeDef:
      type: object
      description: |
        NodeDef carries no editor-only fields (ADR-D4 D6). Visual position,
        UI theme, and author notes live exclusively in EditorMetadata, keyed
        by this node's `id` (or `name` when `id` is absent).
      required: [name, type]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        kind:
          $ref: "#/components/schemas/NodeKind"
        version:
          type: integer
        template:
          type: string
        disabled:
          type: boolean
        on_error:
          type: string
          enum: ["", stop, error_output, main_output, continue]
          description: |
            Node failure policy, applied once the node's retries are
            exhausted. Omit or use an empty value to inherit
            `settings.on_error`, whose own default is `stop`.

            - `stop`: the execution fails; the node is `failed`.
            - `error_output`: the failure leaves through this node's `error`
              port; the node is `success` and the execution continues.
            - `main_output`: the failure leaves through the `main` port; the
              node is `success` and downstream reads the error as
              `$input.error`.
            - `continue`: the failure leaves through the `main` port; the node
              is `continued` and no `error` field is injected.
        runner_selector:
          $ref: "#/components/schemas/RunnerSelector"
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/PortDecl"
        output_schema:
          type: object
          additionalProperties: true
        output:
          $ref: "#/components/schemas/NodeOutputPolicy"
        parameters:
          type: object
          additionalProperties: true
        retry:
          $ref: "#/components/schemas/RetrySettings"
        timeout:
          type: integer
          format: int64
          description: Go duration (nanoseconds) for one node attempt.
        activation_replicas:
          type: integer
          format: uint32
          minimum: 0
          maximum: 4294967295
          description: |
            Desired number of distinct runner activations for a trigger entry.
            Omit or use 0 for the legacy single-activation behavior; values
            greater than 1 are meaningful for partitioned trigger sources.

    NodeOutputPolicy:
      type: object
      description: Controls whether a node's runtime output is exposed publicly.
      properties:
        private:
          type: boolean
          description: When true, public execution inspection redacts this node's output and error details.

    GroupDef:
      type: object
      description: |
        A co-location unit containing connected workflow nodes. The graph
        compiler requires non-empty `name` and `members` values, then validates
        member existence, placement, and entry constraints after decoding this
        definition.
      required: [name, members]
      properties:
        name:
          type: string
          minLength: 1
        members:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        runner_selector:
          $ref: "#/components/schemas/RunnerSelector"
        on_error:
          type: string
          default: stop
          enum: ["", stop, continue, error_output]
          description: |
            Group failure policy. Omit or use an empty value for the default
            `stop`. `continue` and `error_output` are supported;
            `error_output` requires at least one `error_outputs` target, and
            `error_outputs` under any other policy is rejected — a route no
            policy reaches is the same silent no-op class as one that routes
            nowhere. `main_output` is rejected: unlike a node, a group that
            failed before committing has no single member output to stand in
            for the group's main result.
        error_outputs:
          type: array
          items:
            $ref: "#/components/schemas/Connection"
          description: |
            Downstream targets for the group's synthesized `error` output
            port. Required and non-empty when `on_error` is `error_output`;
            targets declared under any other policy are a compile error.
            Each target must be a real node outside the group — a failed
            group has no running member engine left to deliver to — and must
            respect the target's declared inputs. An empty array is
            equivalent to omission and is legal under the policies that do
            not route to it.
        retry:
          type: "null"
          deprecated: true
          description: |
            Group-level retry is not implemented. Omit this property; an
            explicit `null` is accepted as equivalent to omission for
            compatibility. Any retry configuration is rejected by the graph
            compiler. Configure retry on individual member nodes instead.
        timeout:
          type: integer
          format: int64
          description: Go duration (nanoseconds) for the group's business deadline.
        mode:
          type: string
          enum: ["", transient]
          default: ""
          description: |
            Group retention mode. The empty default (`durable`) keeps the
            group's artifacts — its boundary exit outputs, and the group
            unit's status and lease fence keys — for the execution's own
            retention. `transient` shortens them to a completion TTL once the
            execution reaches a terminal status, not when the group commits,
            so reads the same execution makes behave exactly as in a durable
            group. The TTL resolves from `options.transient_completion_ttl`,
            then the execution's transient marker or the deployment-wide
            transient completion TTL, then 30s, capped at the execution's
            active TTL; the lease fence keys are additionally floored at two
            lease windows. Unknown values are rejected at compile time, as are
            transient groups with a suspending member or with
            `activation_replicas` > 1 on a trigger-entry group. Once the
            artifacts have expired, Inspect reports the member as `expired`.
            Only retention differs; execution, commit, and replay semantics
            are the same as a durable group's.
        activation_replicas:
          type: integer
          format: uint32
          minimum: 0
          maximum: 4294967295
          description: |
            Desired number of distinct runner activations for a trigger-entry
            group. Omit or use 0 for the legacy single-activation behavior.

    NodeKind:
      type: string
      enum: [action, trigger, supply]

    Position:
      type: object
      properties:
        x:
          type: number
        y:
          type: number

    Viewport:
      type: object
      description: Editor canvas pan/zoom state.
      properties:
        x:
          type: number
        y:
          type: number
        zoom:
          type: number

    WorkflowEditorMetadata:
      type: object
      description: |
        Editor-only sibling of WorkflowDef (ADR-D4 §2.2-§2.3, D1): visual node
        positions, canvas viewport, per-node UI state, and author notes. None
        of these fields have any execution effect and none participate in the
        runtime conflict hash. Every node-keyed map is keyed by the node's
        stable id (`NodeDef.id`), falling back to `NodeDef.name` when the node
        has no id -- a fallback that triggers a NODE_METADATA_KEYED_BY_NAME
        warning in the response's `warnings` array. A key matching no node is
        dropped silently.
      properties:
        positions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Position"
        viewport:
          $ref: "#/components/schemas/Viewport"
        ui:
          type: object
          additionalProperties: true
        notes:
          type: object
          additionalProperties:
            type: string

    WorkflowDefWithEditorMetadata:
      description: |
        The wire shape for GET /v1/workflows/{id} responses and the
        POST/PUT /v1/workflows request and response bodies: every WorkflowDef
        field plus an optional `editor_metadata` sibling (ADR-D4 §2.3/§4, D2).
        `editor_metadata` is never part of the runtime conflict hash; a change
        to it alone still advances `registry_revision` on PUT (D3).
      allOf:
        - $ref: "#/components/schemas/WorkflowDef"
        - type: object
          properties:
            editor_metadata:
              $ref: "#/components/schemas/WorkflowEditorMetadata"

    PortDecl:
      type: object
      properties:
        name:
          type: string
        required:
          type: boolean

    Connection:
      type: object
      description: |
        One target of a source port. `node` is required and must identify an
        existing workflow node. This schema validates presence and a non-empty
        value; the graph compiler validates that the named node exists.

        `input` selects a data input port. It must be omitted for a target of
        a dependency port: dependency consumers read `$supplies.<source>` and
        have no matching input port. That type-dependent rule is enforced by
        the graph compiler, not by this shared target schema.
      required: [node]
      properties:
        node:
          type: string
          minLength: 1
        input:
          type: string

    Connections:
      type: object
      description: |
        Map[source_node]map[output_port]edges. Data ports normally marshal
        as the array shorthand ([]Connection) for a byte-identical runtime
        hash. The object form accepts an explicit or omitted data type and is
        required for dependency ports. Both forms decode on read
        (types.PortConnections custom marshal/unmarshal).
      additionalProperties:
        type: object
        additionalProperties:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/Connection"
            - $ref: "#/components/schemas/PortConnections"

    PortConnections:
      type: object
      description: |
        The object form declares the targets of one source port. `type` is
        optional: an omitted value decodes as `data`, matching
        types.PortConnections.UnmarshalJSON. Dependency ports use this form;
        a data port normally serializes to the legacy array shorthand
        ([]Connection). `additionalProperties: false` keeps the object form
        strict while retaining both wire-compatible data representations.

        Every target must supply `node`. A dependency target must omit
        `input`; the current OpenAPI schema deliberately documents rather
        than conditionally validates that rule because `Connection` is shared
        with data-port targets. The graph compiler rejects a dependency target
        carrying `input`.
      additionalProperties: false
      required: [targets]
      properties:
        type:
          type: string
          enum: [data, dependency]
          default: data
        targets:
          type: array
          items:
            $ref: "#/components/schemas/Connection"

    DependencyEdge:
      type: object
      required: [node, supply]
      properties:
        node:
          type: string
        supply:
          type: string

    WorkflowContext:
      type: object
      properties:
        vars:
          type: object
          additionalProperties: true
        config:
          type: object
          additionalProperties: true

    WorkflowSettings:
      type: object
      properties:
        concurrency:
          type: integer
        timezone:
          type: string
        on_error:
          type: string
          enum: ["", stop, error_output, main_output, continue]
          description: |
            Workflow default failure policy, applied to nodes that do not
            declare their own `on_error`. Omit or use an empty value for
            `stop`; a node's explicit `on_error` wins over this value, and
            groups do not inherit it. Any other value is rejected at compile
            time.
        pin_data_mode:
          type: string
        retry:
          $ref: "#/components/schemas/RetrySettings"

    WorkflowOptions:
      type: object
      properties:
        allow_cycles:
          type: boolean
        max_auto_depth:
          type: integer
        experimental_node_group:
          type: boolean
        transient:
          type: boolean
        transient_ttl:
          type: integer
        transient_completion_ttl:
          type: integer
        faf:
          type: boolean
          description: >-
            Local SDK-only fire-and-forget mode. It is available only through an owned local
            Engine's FireAndForget method; all HTTP workflow registration, replacement, and
            execute endpoints reject faf: true.

    RetrySettings:
      type: object
      properties:
        enabled:
          type: boolean
        max_attempts:
          type: integer
        strategy:
          type: string
        initial_interval:
          type: integer
        max_interval:
          type: integer
        multiplier:
          type: number

    RunnerSelector:
      type: object
      properties:
        mode:
          type: string
          enum: [default, required]
        match_labels:
          type: object
          additionalProperties:
            type: string

    CredentialDef:
      type: object
      properties:
        name:
          type: string
        type:
          type: string

    ParamDef:
      type: object
      properties:
        type:
          type: string
        required:
          type: boolean
        display_name:
          type: string
        default: {}
        validation:
          type: object
          additionalProperties: true

    NodeTemplate:
      type: object
      properties:
        type:
          type: string
        parameters:
          type: object
          additionalProperties: true

    WorkflowOutput:
      type: object
      properties:
        value: {}
        display_name:
          type: string

    ScheduleView:
      type: object
      description: |
        One schedule: a trigger node's own timing with its runtime overlay
        applied, plus the two instants that live in neither. It is a snapshot,
        not a handle — `revision` is what a conditional write echoes back in
        `If-Match`, so a caller never needs a second read to write safely.

        `kind` is `cron` or `timer` for a live node and EMPTY for an orphaned
        overlay: the kind is read from the node, and an orphaned overlay has no
        node to read it from. The overlay deliberately stores no kind, because a
        stored copy is exactly what goes stale when a node changes type.

        `expression`, `timezone`, `misfire` and `overlap` are the EFFECTIVE
        values — the overlay's where it speaks, the definition's where it does
        not. `misfire` and `overlap` are reported resolved to the node's
        documented defaults (`skip` and `allow`) where the definition is silent,
        because "what will happen" is the question an operator is asking;
        `overridden` is how the definition's own silence stays visible.
      required: [workflow_id, node, kind, expression, paused, overridden, orphaned, last_scheduled, next_fire, revision]
      properties:
        workflow_id:
          type: string
          description: The `{id}` of the workflow that declares the node.
        node:
          type: string
          description: |
            Name of the trigger node. It is the overlay's key, so an overlay
            follows the NAME across re-registrations, and one whose name is gone
            from the new version becomes `orphaned` rather than being dropped.
        kind:
          type: string
          enum: ["", cron, timer]
          description: |
            `cron` or `timer` for a live schedule; the empty string for an
            orphaned overlay, which has no node left to read a kind from.
        expression:
          type: string
          description: |
            The effective timing rule: a cron node's `expression`, a timer's
            `interval`.
        timezone:
          type: string
          description: |
            The effective cron timezone — the overlay's, else the node's
            parameter, else the workflow's `settings.timezone`, else `UTC`. It is
            what the schedule will run in, not what the definition spells out.
            Absent for a timer, which has no zone (its grid is UTC).
        misfire:
          type: string
          enum: [skip, fire_once, fire_all]
          description: |
            The effective misfire policy for missed firings. Cron only, and
            reported resolved to the node's default (`skip`) when the definition
            is silent.
        overlap:
          type: string
          enum: [allow, skip]
          description: |
            The effective overlap policy for a firing that arrives while the
            previous run is still going. Cron only, reported resolved to the
            node's default (`allow`) when the definition is silent. `queue` is
            deliberately not a value: serialising runs is the workflow's
            concurrency setting (`settings.concurrency`), not a property of the
            trigger, and the cron node rejects it for exactly that reason.
        paused:
          type: boolean
          description: |
            The schedule does not fire, but its watermark keeps advancing — which
            is why resuming never replays the paused window and why
            `POST .../backfill` exists for the instants an operator does want.
        overridden:
          type: boolean
          description: |
            An overlay row exists for this node, whether or not it changes
            anything. False means every value above is the definition's own.
        orphaned:
          type: boolean
          description: |
            The overlay's node is no longer a trigger node of the workflow's
            current version (renamed, deleted, or changed to another type). Such
            rows are listed rather than deleted, and `DELETE .../override` is the
            only operation that reaches them.
        last_scheduled:
          type: [string, "null"]
          format: date-time
          description: |
            When the schedule last fired, from the trigger host's own watermark
            — or null when that is unknown: no firing has been recorded yet, or
            this server does not host the trigger and cannot read its state. Null
            is an honest "unknown", never a guess.
        next_fire:
          type: [string, "null"]
          format: date-time
          description: |
            The next instant the effective schedule would fire, derived from the
            effective expression — or null when the expression cannot be parsed
            (a definition may hold one the trigger itself refuses at activation,
            and that is reported here rather than failing the whole read).
        revision:
          type: integer
          minimum: 0
          description: |
            The overlay's write-side revision, bumped by every write (even one
            that changes nothing). Zero when no overlay exists. It is the value
            `If-Match` carries.
        updated_at:
          type: string
          format: date-time
          description: When the overlay was last written. Absent when there is none.
        updated_by:
          type: string
          description: |
            The subject of the principal whose change the overlay records, taken
            from the authenticated request that wrote it. Absent for a deployment
            that authenticates without principals, and when there is no overlay.
      example:
        workflow_id: wf-01H8XG
        node: nightly
        kind: cron
        expression: 0 2 * * *
        timezone: Europe/Berlin
        misfire: skip
        overlap: allow
        paused: false
        overridden: true
        orphaned: false
        last_scheduled: "2026-05-03T02:00:00Z"
        next_fire: "2026-05-05T00:00:00Z"
        revision: 3
        updated_at: "2026-05-04T11:59:00Z"
        updated_by: operator@example.com

    ScheduleListResponse:
      type: object
      description: |
        The `data` payload of the schedule collection response — the mandated
        `{list, total}` shape (spec §3.3), never a bare array. There is no page
        parameter to go with it: the collection is bounded by the number of
        trigger nodes in one definition.
      required: [list, total]
      properties:
        list:
          type: array
          description: |
            Every schedule of the workflow, definition order first, then orphaned
            overlays by node name. Empty collections are `[]`, never `null`.
          items:
            $ref: "#/components/schemas/ScheduleView"
        total:
          type: integer
          description: The exact number of rows in `list`.
          example: 2

    SchedulePatchRequest:
      type: object
      description: |
        A partial update of one schedule's overlay. Presence is carried by the
        KEY rather than the value, because the three cases are genuinely
        distinct: an absent key leaves the overlay's field alone, a key with a
        value overrides it, and a key with an explicit `null` reverts that field
        to the definition's. The third is what lets an operator who pinned an
        expression and a timezone hand one of them back without dropping both.

        An empty object — or no body at all — is a read with a precondition: it
        answers with the current view and writes nothing, which is what makes
        `If-Match` usable on its own. Naming a key always writes, bumping
        `revision` even when the value is unchanged.

        Which keys a schedule actually accepts depends on its kind: a timer node
        declares only its interval, so `timezone`, `misfire` and `overlap` on a
        timer are refused (400 `invalid_schedule_field`) rather than stored as an
        override nothing reads.

        `paused` is deliberately not a key here. Pausing has its own route and
        its own audit row; it is not a state to reach by including a field in a
        request about a cron expression.
      additionalProperties: false
      properties:
        expression:
          type: [string, "null"]
          description: |
            The timing rule: a cron expression for a cron node (`0 2 * * *`), an
            interval for a timer (`1m`). Validated with the node's own parser, so
            a rule the trigger would refuse at activation cannot be stored.
          example: "0 3 * * *"
        timezone:
          type: [string, "null"]
          description: |
            An IANA time zone for a cron node. An unknown zone is refused (400)
            rather than stored; a timer has no zone and refuses the key.
          example: Europe/Berlin
        misfire:
          type: [string, "null"]
          enum: ["skip", "fire_once", "fire_all", "null"]
          description: |
            Policy for firings missed while no trigger host was running, for a
            cron node. Restated from the cron node's own enum so an unknown
            policy is refused at write time instead of leaving the schedule
            silently dead until someone notices it stopped firing.
        overlap:
          type: [string, "null"]
          enum: ["allow", "skip", "null"]
          description: |
            Policy for a firing that arrives while the previous run is still
            going, for a cron node.

    ScheduleBackfillRequest:
      type: object
      description: |
        The range to backfill and whether to plan it only. `from` is exclusive
        and `to` inclusive: an instant exactly at `from` is normally one that
        already fired, and asking for its re-run is a different request than
        asking for a range.
      required: [from, to]
      additionalProperties: false
      properties:
        from:
          type: string
          format: date-time
          description: Exclusive lower bound, RFC3339.
          example: "2026-05-04T12:00:00Z"
        to:
          type: string
          format: date-time
          description: |
            Inclusive upper bound, RFC3339. It must not be in the future: an
            instant the schedule has not reached belongs to the live trigger.
          example: "2026-05-04T12:03:00Z"
        dry_run:
          type: boolean
          default: false
          description: |
            Plan without firing. This is how a range is inspected before it runs,
            and it is bound by the same 1000-instant cap as a real run — the plan
            is what the cap protects, so a dry run is not a way around it.

    ScheduleBackfillResult:
      type: object
      description: |
        What a backfill planned and what happened to each instant. Every planned
        instant ends up in exactly one of `emitted` or `skipped`, so the two
        lists are the whole answer — nothing is reported as a count alone, and a
        partly successful range is honestly reported rather than summarised.
      required: [from, to, dry_run, planned, emitted, skipped]
      properties:
        from:
          type: string
          format: date-time
          description: The exclusive lower bound the request asked for.
        to:
          type: string
          format: date-time
          description: The inclusive upper bound the request asked for.
        dry_run:
          type: boolean
          description: |
            Whether anything was fired. A dry run leaves `emitted` and `skipped`
            empty and reports only `planned`.
        planned:
          type: array
          description: |
            The instants the range holds, oldest first, as the EFFECTIVE schedule
            identifies them. Empty is `[]`, never `null`.
          items:
            type: string
            format: date-time
        emitted:
          type: array
          description: The instants that started an execution, each with the execution it started.
          items:
            $ref: "#/components/schemas/ScheduleBackfillEmission"
        skipped:
          type: array
          description: The instants that did not run, each with why.
          items:
            $ref: "#/components/schemas/ScheduleBackfillSkip"

    ScheduleBackfillEmission:
      type: object
      description: One instant a backfill fired, and the execution it started.
      required: [instant, execution_id]
      properties:
        instant:
          type: string
          format: date-time
          description: The instant of the schedule's own timeline that was fired.
        execution_id:
          type: string
          description: |
            The execution that instant started. It is a normal execution of the
            workflow: it contends for the workflow's concurrency limit like any
            other admission, and it appears in the execution list.

    ScheduleBackfillSkip:
      type: object
      description: |
        One instant a backfill did not run, and why. The reason is stable wire
        vocabulary — an operator decides what to do next from it — while
        `detail` carries what the engine said and is present only for an actual
        failure.
      required: [instant, reason]
      properties:
        instant:
          type: string
          format: date-time
          description: The instant of the schedule's own timeline that did not run.
        reason:
          type: string
          enum: [duplicate, refused, failed]
          description: |
            `duplicate` — the instant had already fired, or already ran in an
            earlier call to this route. Nothing is wrong and nothing needs doing;
            it is what makes a repeated backfill safe. `refused` — the
            workflow's own admission refused it (its concurrency limit in reject
            mode, or a full concurrency queue), which is what a live firing of
            that instant would have hit too. `failed` — the admission failed for
            any other reason.
        detail:
          type: string
          description: |
            The underlying failure as the engine reported it. Absent for a
            duplicate, which is not a failure.

    CurrentUserResponse:
      type: object
      description: |
        GET /v1/current-user payload: the caller's own verified identity. Every
        field is server-issued from the authenticated credential; none is read
        from the request. The names are the server's vocabulary rather than any
        one client's — a surface that wants different names maps them on its
        side, so the contract does not have to be renamed when a surface is.
      additionalProperties: false
      required: [subject, namespace, scopes]
      properties:
        subject:
          type: string
          description: The subject the authenticator verified for the presented credential.
          example: dev-operator
        namespace:
          type: string
          description: |
            The namespace that credential is bound to — server-issued and
            authoritative. It is the same value every other scoped read on this
            API draws from, never a client-supplied one.
          example: default
        scopes:
          type: array
          description: |
            The scopes the credential was issued, in issue order. Empty — never
            null — when it carries none, so a client can iterate without a null
            guard. These are the values an authorizer checks, so a client that
            keys UI capability off them must expect the same granularity: the
            scope vocabulary is per-operation, not per-resource-per-verb.
          items:
            type: string
          example: ["workflow", "execution"]

    NodeTypesResponse:
      type: object
      description: GET /v1/node-types payload.
      additionalProperties: false
      required: [param_validation_mode, node_types]
      properties:
        param_validation_mode:
          type: string
          enum: ["off", warn, enforce]
          description: The server's ParamSpec validation mode for registration and inline execution.
        node_types:
          type: array
          description: One schema per registered (type, version), sorted by type then version.
          items:
            $ref: "#/components/schemas/NodeFormSchema"

    NodeFormSchema:
      type: object
      description: |
        NodeFormSchema v1: a projection of one registered node type's Go
        Descriptor for editor forms (a domain schema, not a layout). Optional
        keys are omitted rather than written as null.
      additionalProperties: false
      required: [spec, node_type, node_version, kind, fields]
      properties:
        spec:
          type: string
          enum: [node-form/v1]
          description: Schema format version.
        node_type:
          type: string
          description: Node type, e.g. xflow.wait.
        node_version:
          type: integer
          minimum: 1
          description: Registered version this schema describes.
        kind:
          type: string
          enum: [action, trigger, supply]
          description: Node kind; a Descriptor without one projects as action.
        display_name:
          type: string
          description: Descriptor display name.
        category:
          type: string
          enum: [trigger, control, action, code, transform, human, unknown]
          description: |
            Editor node category (spec §5). The editor draws the node's icon and
            palette colour from it. Absent means the editor maps the type by
            prefix instead; `unknown` is the explicit catch-all, declared for
            builtin kinds the table does not name (the supply nodes).
        card_summary:
          type: array
          description: |
            Params a node card shows as its configuration summary, in display
            order, at most three rows. An entry is a top-level param name;
            `a+b` joins two params into one row (HTTP's `method+url`). Absent
            means the editor falls back to the first three required params.
          items:
            type: string
          maxItems: 3
        description:
          type: string
          description: Reserved; Descriptor has no description today, so the server never writes it.
        docs:
          type: string
          description: Long-form documentation (Markdown).
        capabilities:
          type: array
          description: Open-set capability tags.
          items:
            type: string
        credentials:
          type: array
          description: Credential names the node declares it needs (display only in v1).
          items:
            type: string
        ports:
          $ref: "#/components/schemas/NodeFormPorts"
        groups:
          type: array
          description: Editor sections fields join via `group`, in display order.
          items:
            $ref: "#/components/schemas/NodeFormGroup"
        one_of:
          type: array
          description: Cross-parameter cardinality rules over top-level params.
          items:
            $ref: "#/components/schemas/NodeFormOneOf"
        fields:
          type: array
          description: Top-level parameters in declaration order.
          items:
            $ref: "#/components/schemas/NodeFormField"
        source:
          type: string
          enum: [runner]
          description: |
            Where the schema came from. `runner` means live runners reported
            it; absent means the server's own registry.
        runner_pools:
          type: array
          description: |
            Sorted names of the runner pools that report this type. Absent for
            server types and for runners registered without a pool.
          items:
            type: string

    NodeFormPorts:
      type: object
      description: Declared ports. `dynamic_outputs` is present only for node types whose output ports also come from a parameter (e.g. xflow.switch).
      additionalProperties: false
      properties:
        inputs:
          type: array
          description: Input ports.
          items:
            $ref: "#/components/schemas/NodeFormPort"
        outputs:
          type: array
          description: Output ports.
          items:
            $ref: "#/components/schemas/NodeFormPort"
        dynamic_outputs:
          type: object
          description: Extra output ports listed by a parameter's value (strings, or objects with a `name`), on top of `outputs`.
          required: [from]
          additionalProperties: false
          properties:
            from:
              type: string
              description: JSON Pointer of the parameter listing the port names.

    NodeFormPort:
      type: object
      description: One port.
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          description: Port name.
        display_name:
          type: string
          description: Port display name.

    NodeFormGroup:
      type: object
      description: One editor section.
      additionalProperties: false
      required: [key]
      properties:
        key:
          type: string
          description: Key fields name in `group`.
        display_name:
          type: string
          description: Section title.
        description:
          type: string
          description: Section description.
        collapsed:
          type: boolean
          description: Initially collapsed.

    NodeFormOneOf:
      type: object
      description: How many of `params` may be set.
      additionalProperties: false
      required: [params]
      properties:
        params:
          type: array
          description: Top-level param names.
          items:
            type: string
        mode:
          type: string
          enum: [exactly, at_most, at_least]
          description: Omitted means exactly.

    NodeFormField:
      description: One parameter. A NodeFormItem plus its identity (`name`, `path`).
      allOf:
        - $ref: "#/components/schemas/NodeFormItem"
        - type: object
          required: [name, path]

    NodeFormItem:
      type: object
      description: |
        A field's schema without required identity; used as-is for array
        element schemas (`item`). All values are display metadata or
        ParamSpec rules; `default` and `fallback` are hints and are never
        written into a definition.
      additionalProperties: false
      required: [type]
      properties:
        name:
          type: string
          description: Parameter name; absent on an array element schema.
        path:
          type: string
          description: |
            JSON Pointer from the WorkflowNode root ("/parameters/a/b") for
            top-level params and object sub-fields; relative to the element
            ("condition", "cfg/x") inside an array element schema.
        label:
          type: string
          description: Display name, falling back to the parameter name.
        type:
          type: string
          enum: [string, number, boolean, array, object]
          description: Value type (Go ParamBool is spelled boolean).
        widget:
          type: string
          description: Editor widget name; open set, unknown names degrade by type.
        required:
          type: boolean
          description: Always required.
        required_when:
          $ref: "#/components/schemas/NodeFormCondition"
        default:
          $ref: "#/components/schemas/NodeFormValue"
        fallback:
          $ref: "#/components/schemas/NodeFormValue"
        help:
          type: string
          description: Parameter description.
        group:
          type: string
          description: Key of a schema `groups` entry.
        order:
          type: integer
          description: Sort key within the group (ascending; ties keep declaration order).
        secret:
          type: boolean
          description: Mask the value.
        deprecated:
          type: string
          description: Deprecation note; present only when deprecated.
        expression:
          type: object
          description: The backend's expression classification of this parameter path.
          additionalProperties: false
          required: [mode]
          properties:
            mode:
              type: string
              enum: [none, pure, template, literal]
              description: none = never evaluated; pure = whole value is an expression; template = literal with embedded templates; literal = host source code.
        rules:
          type: array
          description: Projected Constraints.
          items:
            $ref: "#/components/schemas/NodeFormRule"
        visible_when:
          $ref: "#/components/schemas/NodeFormCondition"
        options:
          type: array
          description: Allowed values (Enum).
          items:
            $ref: "#/components/schemas/NodeFormEnumOption"
        options_when:
          type: array
          description: Conditional Enum overrides; the first entry whose `when` holds wins.
          items:
            $ref: "#/components/schemas/NodeFormConditionalOptions"
        item:
          $ref: "#/components/schemas/NodeFormItem"
        fields:
          type: array
          description: Known sub-fields of an object; absent means a free map.
          items:
            $ref: "#/components/schemas/NodeFormField"

    NodeFormRule:
      type: object
      description: One projected Constraints entry. `advisory` rules are not enforced by the backend.
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [required, min, max, min_length, max_length, pattern, format, min_items, max_items, unique_items, json_parsable]
          description: Rule kind.
        value:
          type: number
          description: Bound for min/max/min_length/max_length/min_items/max_items.
        pattern:
          type: string
          description: RE2 pattern.
        format:
          type: string
          description: Format name (duration, cron, expression, sha256-digest, json enforced; url, host-port, code advisory).
        advisory:
          type: boolean
          description: The backend does not enforce this rule.
        message:
          type: string
          description: Reserved override message; the server does not write it today.

    NodeFormEnumOption:
      type: object
      description: One allowed value.
      additionalProperties: false
      required: [value]
      properties:
        value:
          $ref: "#/components/schemas/NodeFormValue"
        label:
          type: string
          description: Display name.
        description:
          type: string
          description: Option description.

    NodeFormConditionalOptions:
      type: object
      description: An Enum that applies while `when` holds.
      additionalProperties: false
      required: [when, options]
      properties:
        when:
          $ref: "#/components/schemas/NodeFormCondition"
        options:
          type: array
          description: Allowed values while `when` holds.
          items:
            $ref: "#/components/schemas/NodeFormEnumOption"

    NodeFormValue:
      description: |
        Any JSON value, null included: a Descriptor Default, a handler
        fallback, an enum value, or a condition operand. `default` and
        `fallback` are display-only hints; condition `eq` compares
        numerically.
      type: [string, number, boolean, object, array, "null"]
      items:
        $ref: "#/components/schemas/NodeFormValue"

    NodeFormCondition:
      type: object
      description: |
        A predicate over sibling params (Go types.Condition). All present
        clauses must hold; no clauses holds. A missing param compares as null.
        `eq` is present only when the Go Eq is set — `eq: null` would be a
        real "param is unset" clause, so it is never written for "no Eq".
        `in` and `any_of` are present whenever the Go slice is non-nil, even
        when empty (an empty `in` / `any_of` never holds).
      additionalProperties: false
      properties:
        param:
          type: string
          description: Sibling param the eq/in/truthy clauses test.
        eq:
          $ref: "#/components/schemas/NodeFormValue"
        in:
          type: array
          description: Is one of (numbers compare numerically); null entries match an unset param.
          items:
            $ref: "#/components/schemas/NodeFormValue"
        truthy:
          type: boolean
          description: JavaScript truthiness must equal this.
        all_of:
          type: array
          description: Every sub-condition holds.
          items:
            $ref: "#/components/schemas/NodeFormCondition"
        any_of:
          type: array
          description: Some sub-condition holds.
          items:
            $ref: "#/components/schemas/NodeFormCondition"
        not:
          $ref: "#/components/schemas/NodeFormCondition"
