openapi: 3.1.0
info:
  title: xflow Workflow Management API
  version: 1.0.0
  description: |
    User-facing HTTP contract for xflow. This spec mirrors the routes that are
    actually registered on the apiserver mux (docs/design/API-SPECIFICATION.md
    §7, §10). The runner protocol face — including POST /v1/executions
    (entry-seed) and the entire /v1/runners/* family — is intentionally absent:
    per spec §0.1 / §10 the OpenAPI contract describes only the user face.

    Every user-face JSON response is wrapped in the Envelope (§3). The only
    exceptions are the raw-byte streams (GET /v1/supplies/{name},
    GET|HEAD /v1/artifacts/{digest}) whose 2xx bodies are octet-streams (their
    failure bodies are still JSON Envelopes — spec §3.4) and the /healthz and
    /readyz probes, which load balancers parse directly and must not be
    enveloped (§7).

    The webhook entry route POST|{method} /v1/hooks/{namespace}/{workflow_id}/
    {entry_unit} is the third exception, for the same underlying reason: it is
    not addressed by a platform client but by an external system, and it speaks
    the entry-seed admission shape (bare `state`/`execution_id` objects and bare
    `error` objects) that the runner protocol face defines. Its authentication
    is not bearerAuth either — it is a per-entry HMAC signature over the request
    body, so its operation carries `security: []`. See its own description.

    Delivery semantics, stated once here instead of per endpoint: the handler
    boundary and the Runner Protocol are at-least-once — lease replay, node
    execution timeout and failover can each invoke the same handler twice — so
    business side effects are the host's responsibility, with
    `execution_id` + `node_name` as the recommended idempotency key. Those are
    the faces this document deliberately omits (spec §0.1 / §10); see
    docs/design/RELEASE-GATES.md §3 and §3.1. No endpoint below promises
    exactly-once delivery.
  contact:
    name: xflow maintainers
    url: https://github.com/xbcio/xflow
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /
    description: Paths are absolute so the contract compares cleanly against the server path constants.

tags:
  - name: Workflows
    description: Register, read, replace, deregister, and execute workflow definitions.
  - name: Executions
    description: Inspect, signal, cancel, and wait for executions.
  - name: NodeTypes
    description: Editor form schemas (NodeFormSchema) of the node types registered in the server process.
  - name: CurrentUser
    description: The caller's own verified identity (subject, namespace, scopes).
  - name: Supplies
    description: Push and read supply content (raw-byte stream on success).
  - name: Artifacts
    description: Fetch script artifact bytes (raw-byte stream on success).
  - name: Management
    description: "Ops surface: leader status, runner/execution inspect, dead-letter list/replay."
  - name: Probes
    description: Liveness and readiness probes (not enveloped, not authenticated).
  - name: Webhooks
    description: |
      Server-hosted webhook entry routes. Registered by the server (a runner has
      no inbound address), authenticated per entry by an HMAC signature rather
      than by bearerAuth, and answered with the bare entry-seed shapes rather
      than the Envelope.
  - name: Schedules
    description: |
      A workflow's cron and timer trigger nodes, and the runtime overlay an
      operator writes against one without registering a new version: read the
      effective timing, retime it, pause and resume it, drop the overlay, or
      backfill a past range of its instants.

security:
  - bearerAuth: []

paths:
  /v1/workflows:
    post:
      operationId: registerWorkflow
      summary: Register a workflow definition
      description: |
        Compiles the submitted definition and persists the compiled graph in the
        server-side registry (spec §7). Namespace is resolved server-side from
        the authenticated principal — never from the request body (§6.2).
        Returns 201 with a Location header pointing at the new resource.

        Registration is idempotent on the runtime-semantic definition. When the
        key already holds a definition that differs only in description, ids
        or editor metadata, or only by a builtin node parameter given as its
        declared default versus left out, the call returns 201 with the
        existing workflow id and leaves the stored definition unchanged (only
        its `definition_hash` may be upgraded to a newer format). Update
        metadata through `PUT /v1/workflows/{id}`.
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowDefWithEditorMetadata"
      responses:
        "201":
          description: Workflow registered.
          headers:
            Location:
              description: Absolute path of the newly registered workflow.
              schema:
                type: string
                example: /v1/workflows/wf-01H8XG...
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RegisterWorkflowResponse"
        "400":
          description: |
            The definition is invalid. A non-empty `workflow.id` is refused with
            `workflow_invalid`: registration mints the id server-side, and a
            client-supplied one would choose the identity every execution of the
            workflow is attributed to. `workflow_compile_failed` (ErrorEnvelope)
            when the compiler rejects it; `workflow_param_invalid`
            (ParamInvalidErrorEnvelope, carrying `data.param_issues`) when the
            server runs ParamSpec validation in enforce mode and a node
            parameter violates its node type's Descriptor.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - $ref: "#/components/schemas/ParamInvalidErrorEnvelope"
              examples:
                workflowParamInvalid:
                  summary: Enforce-mode ParamSpec validation rejected a node parameter.
                  value:
                    success: false
                    code: workflow_param_invalid
                    message: 'workflow "orders": 1 invalid parameter(s): node "pause": duration is required'
                    data:
                      param_issues:
                        - node: pause
                          path: /parameters/duration
                          code: required
                          message: duration is required
                          severity: error
                    trace_id: 0123456789abcdef0123456789abcdef
        "409":
          description: |
            The registration cannot be installed as presented. The code says
            which constraint refused it, because each sends the caller to a
            different fix:

            - `workflow_conflict` — a different definition already occupies the
              (namespace, name, version) key. Registration identity is the
              runtime-semantic definition: a definition that differs from the
              stored one only in its description, ids or editor metadata (node
              position, UI, notes) is not a conflict, and a builtin node
              parameter left out counts as its declared default. An explicit
              empty value (for example `"method": ""`) is a value, not an
              omission: it is not filled with the default, so it conflicts with
              a stored definition that leaves the parameter out or spells out
              its default. A custom node type's defaults are never filled. Use
              `PUT /v1/workflows/{id}` to change the stored definition.
            - `workflow_version_immutable` — this version label is already
              published with a different definition. A version label is a
              promise about semantics: it is what a pinned replay and a
              subworkflow reference resolve to. Publish a new label instead.
            - `workflow_name_conflict` — another live workflow already holds
              this (namespace, name). Two live records sharing a name share an
              activation key space and silently split the workflow the name
              refers to, so only one may exist. Address the existing record
              (`PUT /v1/workflows/{id}`) or delete it; changing the definition
              does not resolve this.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                workflowConflict:
                  summary: The key holds a definition with different runtime semantics.
                  value:
                    success: false
                    code: workflow_conflict
                    message: workflow definition conflicts with an existing registration
                    trace_id: 0123456789abcdef0123456789abcdef
                workflowVersionImmutable:
                  summary: This version label was already published with a different definition.
                  value:
                    success: false
                    code: workflow_version_immutable
                    message: workflow version was already published with a different definition
                    trace_id: 0123456789abcdef0123456789abcdef
                workflowNameConflict:
                  summary: Another live workflow already holds this (namespace, name).
                  value:
                    success: false
                    code: workflow_name_conflict
                    message: another live workflow already holds this namespace and name
                    trace_id: 0123456789abcdef0123456789abcdef
        default:
          $ref: "#/components/responses/DefaultError"
    get:
      operationId: listWorkflows
      summary: List registered workflows
      description: |
        One offset-paginated page of the workflows registered in the caller's
        own namespace (spec §3.3 page list). Namespace is resolved server-side
        from the authenticated principal — there is no `namespace` parameter,
        and a caller can never list another tenant's workflows.

        `list` holds summary rows, not definitions; read a definition with
        `GET /v1/workflows/{id}`. Rows are ordered newest registry revision
        first, then by id ascending, so the order is total and stable across
        pages. `total` is the exact size of the collection in the caller's
        namespace — what a pagination control needs, independent of the page
        requested.

        Offset pagination is the page-list default by rule: the
        cursor-paginated endpoints exist only for machine scans, and no
        endpoint carries both.
      tags: [Workflows]
      parameters:
        - name: page
          in: query
          required: false
          description: |
            1-based page number (spec §3.3); `page=1` is the first page.
            Malformed pagination input is never a business error: an absent,
            empty, non-numeric, zero, or negative value falls back to 1. The
            constraints below describe the domain the server honors, not a
            request-validation gate.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          description: |
            Rows per page (spec §3.3). Defaults to 20. The server enforces a
            hard ceiling of 200 and CLAMPS a larger request to 200 rather than
            rejecting it — that ceiling is a security control (a sensitive-data
            enumeration endpoint must not permit full-table traversal), not a
            performance knob. An absent, empty, non-numeric, zero, or negative
            value falls back to 20.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: One page of workflows.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WorkflowListResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/workflows/{id}:
    get:
      operationId: getWorkflow
      summary: Read a workflow definition
      description: Returns the stored definition for one workflow id. A cross-namespace id resolves to not-found → 404.
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: The workflow definition.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WorkflowDefWithEditorMetadata"
        default:
          $ref: "#/components/responses/DefaultError"
    put:
      operationId: replaceWorkflow
      summary: Replace a workflow definition
      description: |
        Replaces the workflow resource selected by the path `id`; the path
        `id` is the authoritative resource identity. The body `id` is optional,
        but when present it must equal the path `id`, otherwise the request
        fails with 400 (`workflow_id_mismatch`).

        Namespace comes from the authenticated principal, never from the body.
        A missing path target, including a workflow owned by another namespace,
        fails with 404 (`workflow_not_found`).

        The replacement may rename the workflow or change its version while
        preserving the path id when the resulting (namespace, name, version)
        destination key is free. If another workflow owns that key, the request
        fails with 409 (`workflow_conflict`). PUT never deletes or overwrites a
        different workflow merely because its key is named by the body.

        Two further constraints guard version identity: the destination name
        must not be held by another live workflow, even when the key is free
        (409 `workflow_name_conflict` — two live records sharing a name would
        host both definitions' entry activations side by side), and a version
        label already published with a different definition cannot be
        re-installed through PUT (409 `workflow_version_immutable`; use
        `POST /v1/workflows/{id}/rollback` to install a retired version with
        the payload it was published with).
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        description: |
          Complete replacement as a types.WorkflowDef JSON object, plus an
          optional `editor_metadata` sibling (ADR-D4 D2). `id` may be omitted;
          if supplied it must match the path. `namespace` may also be omitted
          and cannot select the target because the server overwrites it with
          the authenticated principal's namespace. A PUT that changes only
          `editor_metadata` is still a normal revision: `registry_revision`
          advances, but the runtime conflict hash does not change (D3).
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowDefWithEditorMetadata"
      responses:
        "200":
          description: Workflow replaced.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RegisterWorkflowResponse"
        "400":
          description: |
            The body id differs from the path id (`workflow_id_mismatch`), the
            compiler rejects the replacement (`workflow_compile_failed`), or
            enforce-mode ParamSpec validation rejects a node parameter
            (`workflow_param_invalid`, a ParamInvalidErrorEnvelope carrying
            `data.param_issues`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - $ref: "#/components/schemas/ParamInvalidErrorEnvelope"
              examples:
                workflowParamInvalid:
                  summary: Enforce-mode ParamSpec validation rejected a node parameter.
                  value:
                    success: false
                    code: workflow_param_invalid
                    message: 'workflow "orders": 1 invalid parameter(s): node "pause": duration is required'
                    data:
                      param_issues:
                        - node: pause
                          path: /parameters/duration
                          code: required
                          message: duration is required
                          severity: error
                    trace_id: 0123456789abcdef0123456789abcdef
                workflowIdMismatch:
                  summary: The optional body id does not match the authoritative path id.
                  value:
                    success: false
                    code: workflow_id_mismatch
                    message: workflow id does not match path
                    trace_id: 0123456789abcdef0123456789abcdef
        "404":
          description: No workflow with the path id exists in the authenticated namespace.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                workflowNotFound:
                  summary: Missing and cross-namespace targets are indistinguishable.
                  value:
                    success: false
                    code: workflow_not_found
                    message: workflow not found
                    trace_id: 0123456789abcdef0123456789abcdef
        "409":
          description: |
            The replacement cannot be installed as presented. `workflow_conflict`
            means another workflow owns the replacement's destination
            (namespace, name, version) key; neither workflow is replaced.
            `workflow_name_conflict` means the rename target's (namespace, name)
            is held by another live workflow at a different version — the
            destination KEY is free, but two live records sharing a name are
            refused. `workflow_version_immutable` means the replacement would
            install a retired version label with a payload it was not published
            with (install it via `POST /v1/workflows/{id}/rollback` instead,
            which carries the published payload).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                workflowConflict:
                  summary: A rename or version change selected an occupied destination key.
                  value:
                    success: false
                    code: workflow_conflict
                    message: workflow definition conflicts with an existing registration
                    trace_id: 0123456789abcdef0123456789abcdef
                workflowNameConflict:
                  summary: The rename target's name is held by another live workflow.
                  value:
                    success: false
                    code: workflow_name_conflict
                    message: another live workflow already holds this namespace and name
                    trace_id: 0123456789abcdef0123456789abcdef
                workflowVersionImmutable:
                  summary: The replacement would rewrite a retired version label.
                  value:
                    success: false
                    code: workflow_version_immutable
                    message: workflow version was already published with a different definition
                    trace_id: 0123456789abcdef0123456789abcdef
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: deregisterWorkflow
      summary: Deregister a workflow definition
      description: Removes the persisted record for the given workflow id.
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Workflow removed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RemovedResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/workflows/execute:
    post:
      operationId: executeInlineWorkflow
      summary: Compile and execute an inline workflow definition
      description: |
        Merges the old submit/invoke shapes: when entry is empty the graph's
        default start node is used; when set, that entry node drives the
        explicit-entry path (spec §7, §9.1).

        The body runs an inline definition, so it must not carry a workflow
        `id`: ids are server-assigned (`WorkflowDef.id`), and a client-supplied
        one would both choose the execution's `workflow_id` attribution and
        escape the `ExecutionDetail.workflow_id` length bound. A non-empty id
        is refused with 400 `workflow_invalid`; run a registered workflow
        through `POST /v1/workflows/{id}/execute`, which stamps the path id.
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteWorkflowRequest"
      responses:
        "200":
          description: |
            The submission was accepted. `data.status` says where it landed:
            `running` for an execution that started, `queued` for one waiting
            for a workflow concurrency slot, in which case
            `data.queue_position` carries its 1-based place in line.

            When the request carried an Idempotency-Key that had already started
            this execution, `data.duplicate` is true: the execution id and
            status are the ORIGINAL execution's, and this request created
            nothing. The status is read back, so a duplicate of an execution
            that has since been paused or finished reports that status.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ExecuteWorkflowResponse"
        "400":
          description: |
            The definition is invalid, or the body carried a `workflow.id` the
            inline route refuses (`workflow_invalid`; see the operation
            description). `workflow_compile_failed` (ErrorEnvelope)
            when the compiler rejects it; `workflow_param_invalid`
            (ParamInvalidErrorEnvelope, carrying `data.param_issues`) when the
            server runs ParamSpec validation in enforce mode and a node
            parameter violates its node type's Descriptor.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - $ref: "#/components/schemas/ParamInvalidErrorEnvelope"
              examples:
                workflowParamInvalid:
                  summary: Enforce-mode ParamSpec validation rejected a node parameter.
                  value:
                    success: false
                    code: workflow_param_invalid
                    message: 'workflow "orders": 1 invalid parameter(s): node "pause": duration is required'
                    data:
                      param_issues:
                        - node: pause
                          path: /parameters/duration
                          code: required
                          message: duration is required
                          severity: error
                    trace_id: 0123456789abcdef0123456789abcdef
                idempotencyKeyInvalid:
                  summary: The Idempotency-Key is outside the accepted shape, so it was refused rather than ignored.
                  value:
                    success: false
                    code: idempotency_key_invalid
                    message: 'Idempotency-Key must be 1-255 characters of A-Za-z0-9._:-'
                    trace_id: 0123456789abcdef0123456789abcdef
        "409":
          description: |
            The request's Idempotency-Key is not usable for it. Two codes share
            this status: `idempotency_key_conflict` when the key already started
            a DIFFERENT request (a different definition, params, entry or test
            flag) — reusing a key for other work is a caller bug, and answering
            it with the original execution would hand back the result of work
            the caller did not ask for — and `idempotency_key_in_progress` when
            another request with the same key and the same request is still
            creating its execution. Nothing was persisted by the refused
            request either way.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                idempotencyKeyConflict:
                  summary: The key was already used for a different request.
                  value:
                    success: false
                    code: idempotency_key_conflict
                    message: the idempotency key was already used for a different request
                    trace_id: 0123456789abcdef0123456789abcdef
                idempotencyKeyInProgress:
                  summary: A concurrent request with the same key and request is still creating its execution.
                  value:
                    success: false
                    code: idempotency_key_in_progress
                    message: a request with this idempotency key is still in progress
                    trace_id: 0123456789abcdef0123456789abcdef
        "429":
          description: |
            The workflow refused the submission because of its own declared
            limits (`settings.concurrency`), before anything was persisted —
            there is no execution to inspect or cancel. Two codes share this
            status: `workflow_concurrency_limit` when the running executions are
            already at `limit`, and `workflow_concurrency_queue_full` when the
            queue backlog is at `max_queued`. Both are retryable, and the code
            says which wait is in front of the caller — a slot to free or a
            backlog to drain. `Retry-After` is a floor rather than a prediction:
            the server has no release time to promise (the submission is not
            queued when it is refused), and the header exists so a client can
            back off instead of spinning.
            The API admission layer answers this status too, with
            `rate_limited`, when the caller's namespace has spent its API rate
            budget; that refusal precedes the workflow and is described by
            the RateLimited response.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Retry-After:
              description: Seconds to wait before retrying, as a floor.
              schema:
                type: integer
                example: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                workflowConcurrencyLimit:
                  summary: The workflow is already running as many executions as its limit allows.
                  value:
                    success: false
                    code: workflow_concurrency_limit
                    message: workflow is at its concurrency limit
                    trace_id: 0123456789abcdef0123456789abcdef
                workflowConcurrencyQueueFull:
                  summary: The workflow's queue backlog is at its max_queued bound.
                  value:
                    success: false
                    code: workflow_concurrency_queue_full
                    message: workflow concurrency queue is full
                    trace_id: 0123456789abcdef0123456789abcdef
                rateLimited:
                  summary: The namespace's API rate budget is spent (admission, before the workflow is consulted).
                  value:
                    success: false
                    code: rate_limited
                    message: rate limit exceeded
                    trace_id: 0123456789abcdef0123456789abcdef
        "503":
          description: |
            The definition declares a concurrency limit this server's state
            store cannot honour, so the submission was refused rather than
            silently downgraded — admitting it would break the limit the
            definition declared. Two causes share the code
            `workflow_concurrency_unavailable`: the workflow asks for
            `mode: queue` and the store cannot park executions, or the store
            cannot enforce a limit at all. It is not retryable in any useful
            sense: the answer changes when the deployment does, not when the
            caller retries. There is no `Retry-After` for that reason, and
            nothing was persisted in either case.

            `idempotency_unsupported` is the same kind of refusal for a keyed
            request: the store cannot hold a claim, so the key cannot be
            honoured, and accepting the request would make the caller believe a
            retry is safe when it is not. Nothing was persisted.

            The API admission layer answers this status too, with
            `server_overloaded` and a `Retry-After` floor, when this replica is
            at its inflight bound; that refusal is retryable and is described
            by the ServerOverloaded response.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                workflowConcurrencyUnavailable:
                  summary: The server's state store cannot queue, and the workflow asked for queue mode.
                  value:
                    success: false
                    code: workflow_concurrency_unavailable
                    message: workflow concurrency queue is not available on this server
                    trace_id: 0123456789abcdef0123456789abcdef
                workflowConcurrencyLimitsUnavailable:
                  summary: The server's state store cannot enforce a concurrency limit at all.
                  value:
                    success: false
                    code: workflow_concurrency_unavailable
                    message: workflow concurrency is not available on this server
                    trace_id: 0123456789abcdef0123456789abcdef
                idempotencyUnsupported:
                  summary: The server's state store cannot hold an idempotency claim.
                  value:
                    success: false
                    code: idempotency_unsupported
                    message: idempotency keys are not available on this server
                    trace_id: 0123456789abcdef0123456789abcdef
                serverOverloaded:
                  summary: The replica's inflight bound is full.
                  value:
                    success: false
                    code: server_overloaded
                    message: server is overloaded
                    trace_id: 0123456789abcdef0123456789abcdef
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/workflows/{id}/execute:
    post:
      operationId: executeRegisteredWorkflow
      summary: Execute an already-registered workflow by id
      description: |
        Resolves the stored compiled graph and submits it. The body is optional.

        `version` selects which version of the ADDRESSED workflow to run. It is
        omitted (or equal to the current version) by default, which runs the
        live record — the behavior this route had before versions existed. A
        retired version runs from the graph snapshot captured when it was
        retired, never a recompile. The name always comes from the path record,
        so a version string can never redirect the call to another workflow,
        and an unknown version is 404 `workflow_version_not_found`. A retired
        payload that no longer reproduces under the current compiler fails
        closed with 409 `workflow_version_unavailable` rather than running
        same-label-different-semantics code.

        An Idempotency-Key makes a retry return the execution the first call
        started; its request fingerprint is taken from the graph the call
        actually runs, so pinning `version` is what keeps that replay stable
        across an intervening publish. An unpinned retry after a new version is
        published is a different request and is refused with 409
        `idempotency_key_conflict`.
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteRegisteredRequest"
      responses:
        "200":
          description: |
            The submission was accepted. `data.status` says where it landed:
            `running` for an execution that started, `queued` for one waiting
            for a workflow concurrency slot, in which case
            `data.queue_position` carries its 1-based place in line.

            When the request carried an Idempotency-Key that had already started
            this execution for this workflow, `data.duplicate` is true and the
            execution id and status are the ORIGINAL execution's.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ExecuteWorkflowResponse"
        "400":
          description: |
            The Idempotency-Key header is outside the accepted shape
            (`idempotency_key_invalid`). It is refused rather than ignored: the
            caller must not believe a retry is safe when the server cannot
            recognize it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                idempotencyKeyInvalid:
                  summary: The key does not match 1-255 characters of [A-Za-z0-9._:-].
                  value:
                    success: false
                    code: idempotency_key_invalid
                    message: 'Idempotency-Key must be 1-255 characters of A-Za-z0-9._:-'
                    trace_id: 0123456789abcdef0123456789abcdef
        "404":
          description: |
            No workflow with the path id exists in the authenticated namespace
            (`workflow_not_found`), or the addressed workflow never published
            the requested `version` (`workflow_version_not_found`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                workflowNotFound:
                  summary: Missing and cross-namespace targets are indistinguishable.
                  value:
                    success: false
                    code: workflow_not_found
                    message: workflow not found
                    trace_id: 0123456789abcdef0123456789abcdef
                workflowVersionNotFound:
                  summary: The workflow exists but has no such version, current or archived.
                  value:
                    success: false
                    code: workflow_version_not_found
                    message: workflow version not found
                    trace_id: 0123456789abcdef0123456789abcdef
        "409":
          description: |
            The request's Idempotency-Key is not usable for it: it already
            started a different request for this workflow
            (`idempotency_key_conflict`), or another request with the same key
            and the same request is still creating its execution
            (`idempotency_key_in_progress`). Nothing was persisted by the
            refused request.

            The requested `version` may also be refused here when it is retired
            and its stored payload does not reproduce under the current compiler
            (`workflow_version_unavailable`); nothing is submitted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                idempotencyKeyConflict:
                  summary: The key was already used for a different request.
                  value:
                    success: false
                    code: idempotency_key_conflict
                    message: the idempotency key was already used for a different request
                    trace_id: 0123456789abcdef0123456789abcdef
                idempotencyKeyInProgress:
                  summary: A concurrent request with the same key and request is still creating its execution.
                  value:
                    success: false
                    code: idempotency_key_in_progress
                    message: a request with this idempotency key is still in progress
                    trace_id: 0123456789abcdef0123456789abcdef
                workflowVersionUnavailable:
                  summary: Fail closed rather than run a same-label-different-semantics definition.
                  value:
                    success: false
                    code: workflow_version_unavailable
                    message: workflow version is not reproducible under the current compiler
                    trace_id: 0123456789abcdef0123456789abcdef
        "429":
          description: |
            The workflow refused the submission because of its own declared
            limits (`settings.concurrency`). Same contract as
            POST /v1/workflows/execute: nothing was persisted, `Retry-After` is
            a floor, and the code is `workflow_concurrency_limit` for a reached
            limit or `workflow_concurrency_queue_full` for a full queue.
            The API admission layer answers this status too, with
            `rate_limited`, when the caller's namespace has spent its API rate
            budget; that refusal precedes the workflow and is described by
            the RateLimited response.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Retry-After:
              description: Seconds to wait before retrying, as a floor.
              schema:
                type: integer
                example: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                workflowConcurrencyLimit:
                  summary: The workflow is already running as many executions as its limit allows.
                  value:
                    success: false
                    code: workflow_concurrency_limit
                    message: workflow is at its concurrency limit
                    trace_id: 0123456789abcdef0123456789abcdef
                workflowConcurrencyQueueFull:
                  summary: The workflow's queue backlog is at its max_queued bound.
                  value:
                    success: false
                    code: workflow_concurrency_queue_full
                    message: workflow concurrency queue is full
                    trace_id: 0123456789abcdef0123456789abcdef
                rateLimited:
                  summary: The namespace's API rate budget is spent (admission, before the workflow is consulted).
                  value:
                    success: false
                    code: rate_limited
                    message: rate limit exceeded
                    trace_id: 0123456789abcdef0123456789abcdef
        "503":
          description: |
            The definition declares a concurrency limit this server's state
            store cannot honour — either it cannot park executions for
            `mode: queue`, or it cannot enforce a limit at all. Same contract as
            POST /v1/workflows/execute: the code is
            `workflow_concurrency_unavailable`, nothing was persisted, and
            retrying does not change the answer.

            `idempotency_unsupported` is the same kind of refusal for a keyed
            request: this server's store cannot hold the claim the key needs.
            Nothing was persisted.
            The API admission layer answers this status too, with
            `server_overloaded` and a `Retry-After` floor, when this replica is
            at its inflight bound; that refusal is retryable and is described
            by the ServerOverloaded response.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                workflowConcurrencyUnavailable:
                  summary: The server's state store cannot queue, and the workflow asked for queue mode.
                  value:
                    success: false
                    code: workflow_concurrency_unavailable
                    message: workflow concurrency queue is not available on this server
                    trace_id: 0123456789abcdef0123456789abcdef
                workflowConcurrencyLimitsUnavailable:
                  summary: The server's state store cannot enforce a concurrency limit at all.
                  value:
                    success: false
                    code: workflow_concurrency_unavailable
                    message: workflow concurrency is not available on this server
                    trace_id: 0123456789abcdef0123456789abcdef
                idempotencyUnsupported:
                  summary: The server's state store cannot hold an idempotency claim.
                  value:
                    success: false
                    code: idempotency_unsupported
                    message: idempotency keys are not available on this server
                    trace_id: 0123456789abcdef0123456789abcdef
                serverOverloaded:
                  summary: The replica's inflight bound is full.
                  value:
                    success: false
                    code: server_overloaded
                    message: server is overloaded
                    trace_id: 0123456789abcdef0123456789abcdef
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/workflows/{id}/versions:
    get:
      operationId: listWorkflowVersions
      summary: List a workflow's versions
      description: |
        One offset-paginated page of the addressed workflow's version history:
        the current version first, then retired versions newest-retirement
        first. A version is a label on one workflow; version ownership follows
        the workflow id, so a rename or replace that preserves the id preserves
        the history.

        `list` holds label rows, not definitions — read one version's definition
        with `GET /v1/workflows/{id}/versions/{version}`. `total` is the exact
        size of the history (bounded by the registry's retention limit plus the
        live record), independent of the page requested. A workflow that was
        never replaced lists exactly its current version.

        Namespace is resolved server-side from the authenticated principal; a
        cross-namespace id and an unknown id both answer 404
        `workflow_not_found`, never an empty history.
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
        - name: page
          in: query
          required: false
          description: |
            1-based page number (spec §3.3); `page=1` is the first page.
            Malformed pagination input is never a business error: an absent,
            empty, non-numeric, zero, or negative value falls back to 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          description: |
            Rows per page (spec §3.3). Defaults to 20. The server enforces a
            hard ceiling of 200 and CLAMPS a larger request to 200 rather than
            rejecting it. An absent, empty, non-numeric, zero, or negative
            value falls back to 20.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: One page of the workflow's versions.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WorkflowVersionListResponse"
        "404":
          description: No workflow with the path id exists in the authenticated namespace.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                workflowNotFound:
                  summary: Missing and cross-namespace targets are indistinguishable.
                  value:
                    success: false
                    code: workflow_not_found
                    message: workflow not found
                    trace_id: 0123456789abcdef0123456789abcdef
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/workflows/{id}/versions/{version}:
    get:
      operationId: getWorkflowVersion
      summary: Read one workflow version
      description: |
        Returns one version's full record in the same wire shape as
        `GET /v1/workflows/{id}` — this is where the definition the version list
        deliberately omits is read back, one version at a time.

        The current version resolves to the live record; a retired version
        resolves to the payload captured when it was retired, so a version
        remains readable (and pinnable for a replay) after it has been replaced.
        An unknown version is 404 `workflow_version_not_found` — deliberately
        distinct from `workflow_not_found` so a caller can tell "this workflow
        is gone" from "this workflow never published that version". A
        cross-namespace id is reported as `workflow_not_found`.
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/WorkflowVersion"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: The version's stored record.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WorkflowDefWithEditorMetadata"
        "404":
          description: |
            No workflow with the path id exists in the authenticated namespace
            (`workflow_not_found`), or it never published that version
            (`workflow_version_not_found`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                workflowNotFound:
                  summary: Missing and cross-namespace targets are indistinguishable.
                  value:
                    success: false
                    code: workflow_not_found
                    message: workflow not found
                    trace_id: 0123456789abcdef0123456789abcdef
                workflowVersionNotFound:
                  summary: The workflow exists but has no such version.
                  value:
                    success: false
                    code: workflow_version_not_found
                    message: workflow version not found
                    trace_id: 0123456789abcdef0123456789abcdef
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/workflows/{id}/rollback:
    post:
      operationId: rollbackWorkflow
      summary: Roll a workflow back to an archived version
      description: |
        Installs a retired version of the addressed workflow as its current
        record, under the same id, atomically: the live record is replaced in
        one compare-and-swap and the replaced current version is appended to
        history — the exact dual of the retirement that put the target version
        there. History is never rewritten, so the version rolled back FROM
        remains readable and selectable.

        The installed record carries the definition hash the target version was
        PUBLISHED with; if recomputing that hash under the current compiler does
        not reproduce it, the rollback fails closed with 409
        `workflow_version_unavailable` rather than publishing the same version
        label with different semantics.

        An omitted `version`, or one equal to the current version, is the
        idempotent no-op: nothing is written and the response is
        `{unchanged: true}`. Supplying `X-Request-Id` makes a retry of a
        response-lost rollback replay instead of writing a second revision.
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackWorkflowRequest"
      responses:
        "200":
          description: The version is now current (or already was).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RollbackWorkflowResponse"
        "404":
          description: |
            No workflow with the path id exists in the authenticated namespace
            (`workflow_not_found`), or it never published the requested version
            (`workflow_version_not_found`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                workflowNotFound:
                  summary: Missing and cross-namespace targets are indistinguishable.
                  value:
                    success: false
                    code: workflow_not_found
                    message: workflow not found
                    trace_id: 0123456789abcdef0123456789abcdef
                workflowVersionNotFound:
                  summary: The workflow exists but has no such version.
                  value:
                    success: false
                    code: workflow_version_not_found
                    message: workflow version not found
                    trace_id: 0123456789abcdef0123456789abcdef
        "409":
          description: |
            The requested version's stored payload does not reproduce under the
            current compiler (`workflow_version_unavailable`), or the
            replacement cannot be installed because its destination key is
            occupied (`workflow_conflict`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                workflowVersionUnavailable:
                  summary: Fail closed rather than install a same-label-different-semantics definition.
                  value:
                    success: false
                    code: workflow_version_unavailable
                    message: workflow version is not reproducible under the current compiler
                    trace_id: 0123456789abcdef0123456789abcdef
                workflowConflict:
                  summary: The destination key is occupied by another workflow.
                  value:
                    success: false
                    code: workflow_conflict
                    message: workflow definition conflicts with an existing registration
                    trace_id: 0123456789abcdef0123456789abcdef
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/workflows/{id}/schedules:
    get:
      operationId: listSchedules
      summary: List a workflow's schedules
      description: |
        Every schedule the workflow's current version declares, each with its
        runtime overlay applied, followed by overlays whose node the version no
        longer declares.

        A schedule is not an entity of its own: it is a trigger node with a
        timing rule (a cron node or a timer node) plus whatever an operator has
        changed about it without registering a new version. That is why these
        routes live under the workflow — there is no `/v1/schedules`
        collection, and no way to address one without naming its workflow.

        Rows carry the EFFECTIVE timing: the overlay's value where it speaks,
        the definition's where it does not. An overlay whose node is gone
        (renamed, deleted, or changed to another type) is listed as `orphaned`
        with an empty `kind` rather than dropped — the node may return under the
        same name in the next version, and an overlay that silently vanished
        would be indistinguishable from one that was never written.

        The list is not paginated, and that is a property of the resource rather
        than an omission: it is bounded by the number of trigger nodes in ONE
        definition, so there is no unbounded scan for a page size to protect.
        `total` is the exact number of rows.

        Namespace comes from the authenticated principal and never from the
        path. A workflow id owned by another namespace is answered 404
        `workflow_not_found`, exactly as an unknown id is — a 403 would confirm
        that the id exists.

        Requires the `schedule.read` scope.
      tags: [Schedules]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: "Every schedule of the workflow — definition order first, then orphaned overlays."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ScheduleListResponse"
        "404":
          description: |
            No such workflow in the caller's namespace: `workflow_not_found` is
            the same answer for an id that does not exist and one that exists in
            another namespace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                workflowNotFound:
                  summary: The id is unknown, or belongs to another namespace.
                  value:
                    success: false
                    code: workflow_not_found
                    message: workflow not found
                    trace_id: 0123456789abcdef0123456789abcdef
        "501":
          description: |
            This deployment has no schedule overlay store, so it cannot serve
            schedules. The routes are registered anyway — a 404 would read as
            "this server is older than the route", which is a different and
            false statement; what is missing is the store behind them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                notConfigured:
                  summary: No schedule overlay store is configured on this server.
                  value:
                    success: false
                    code: schedules_unavailable
                    message: the schedules API is not configured on this server
                    trace_id: 0123456789abcdef0123456789abcdef
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/workflows/{id}/schedules/{node}:
    get:
      operationId: getSchedule
      summary: Read one schedule
      description: |
        One schedule: a trigger node of the workflow with its overlay applied, or
        the orphaned overlay of a node the current version no longer declares.

        `last_scheduled` and `next_fire` are null when the answer is unknown
        rather than guessed: no firing has been recorded yet, this server cannot
        read the trigger's watermark (`last_scheduled` — the watermark is written
        by whichever process hosts the trigger), or the effective expression
        cannot be parsed (`next_fire` — a definition may hold an expression the
        trigger itself refuses at activation, and the view reports that as a
        missing instant instead of failing the read).

        Requires the `schedule.read` scope.
      tags: [Schedules]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/ScheduleNode"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: The schedule, with its overlay applied.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ScheduleView"
        "404":
          description: |
            Two codes share this status and are deliberately not distinguished
            further: `workflow_not_found` when the workflow is unknown (or in
            another namespace), `schedule_not_found` when the workflow exists but
            the node is neither a schedule of it nor the address of an existing
            overlay. A node that is not a schedule and a node that does not exist
            answer the same way, because telling them apart would map out which
            names a workflow declares.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                workflowNotFound:
                  summary: The workflow id is unknown, or belongs to another namespace.
                  value:
                    success: false
                    code: workflow_not_found
                    message: workflow not found
                    trace_id: 0123456789abcdef0123456789abcdef
                scheduleNotFound:
                  summary: The node is not a schedule of this workflow and has no overlay.
                  value:
                    success: false
                    code: schedule_not_found
                    message: schedule not found
                    trace_id: 0123456789abcdef0123456789abcdef
        "501":
          description: This deployment has no schedule overlay store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                notConfigured:
                  summary: No schedule overlay store is configured on this server.
                  value:
                    success: false
                    code: schedules_unavailable
                    message: the schedules API is not configured on this server
                    trace_id: 0123456789abcdef0123456789abcdef
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: patchSchedule
      summary: Retime a schedule without registering a new version
      description: |
        A partial update of one schedule's overlay, creating it when there is
        none, and returns the resulting view. This is the operation the whole
        feature exists for: a schedule has to change faster than a definition
        does, and an operator retiming a nightly job must not have to publish a
        new workflow version to do it.

        The three states of a field are carried by the KEY of the request body:
        absent leaves the overlay's field alone, a value overrides it, and an
        explicit `null` reverts it to the definition's. The third is why
        `DELETE .../override` is not the only way back — an operator who pinned
        an expression and a timezone and then wants only the expression to
        follow the definition again would otherwise have to drop both.

        The write is validated against the live node's KIND before it is stored:
        a timezone on a timer is refused (400 `invalid_schedule_field`) because
        the timer handler has no such parameter, and storing it would report an
        override as in effect while the trigger ran unchanged.

        A patch that names at least one field always writes, bumping `revision`
        even when the value is what it already was — that is what a conditional
        writer expects. A patch that names nothing is a read: it answers with the
        current view, checks `If-Match`, and writes nothing.

        `paused` is not a field of this request on purpose: pausing has its own
        route and its own audit row, and it is not a state to reach by including
        a key in a request about a cron expression.

        The reply is 200 when the write landed and the trigger host was told, and
        202 when the write is durable but the host could not be notified. 202 is
        not a failure: the state the caller asked for IS the state that was
        stored, the `If-Match` chain is intact, and the change takes effect at
        the host's next activation (any later write also re-announces it).

        Requires the `schedule.write` scope — deliberately not
        `schedule.backfill`: retiming a schedule and running its past instants
        are different trust, and a principal granted one is not thereby granted
        the other.
      tags: [Schedules]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/ScheduleNode"
        - $ref: "#/components/parameters/IfMatchRevision"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePatchRequest"
      responses:
        "200":
          description: The overlay was stored and the trigger host was notified.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ScheduleView"
        "202":
          description: |
            The overlay was stored, but the trigger host was not notified
            (a reload failure). The `data` payload is the same view: the state
            the caller asked for is the state that was stored.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ScheduleView"
        "400":
          description: |
            Three refusals share this status, each with its own code:
            `invalid_schedule_field` when a named field is not overridable for
            this kind or holds a value the kind cannot use (the message names the
            field), `bad_request` when the body is not JSON, and
            `invalid_if_match` when the precondition is not a revision number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                fieldNotOverridable:
                  summary: A timer has no timezone to override.
                  value:
                    success: false
                    code: invalid_schedule_field
                    message: 'control: invalid schedule field "timezone": a timer schedule has no timezone'
                    trace_id: 0123456789abcdef0123456789abcdef
                unknownField:
                  summary: The key is not an overridable schedule field.
                  value:
                    success: false
                    code: invalid_schedule_field
                    message: 'control: invalid schedule field "nope": not an overridable schedule field'
                    trace_id: 0123456789abcdef0123456789abcdef
                invalidIfMatch:
                  summary: The precondition is not a revision number (the value is not echoed).
                  value:
                    success: false
                    code: invalid_if_match
                    message: If-Match must be the revision number a previous read reported, or 0 for create-only-if-absent
                    trace_id: 0123456789abcdef0123456789abcdef
        "404":
          description: |
            `workflow_not_found`, or `schedule_not_found` — an orphaned overlay
            cannot be patched either: a patch is validated against the node it
            targets, and there is no kind left to refuse a timer's timezone with.
            Deleting the orphan is what `DELETE .../override` is for.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                scheduleNotFound:
                  summary: The node is not a schedule of this workflow and has no overlay.
                  value:
                    success: false
                    code: schedule_not_found
                    message: schedule not found
                    trace_id: 0123456789abcdef0123456789abcdef
        "409":
          description: |
            The `If-Match` precondition does not hold: the schedule changed since
            it was read, or the caller asked for a create-only write on an
            overlay that already exists. Nothing was written — re-read the
            schedule and retry with the current `revision`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                revisionConflict:
                  summary: The overlay's revision is not the one the caller asserted.
                  value:
                    success: false
                    code: schedule_revision_conflict
                    message: the schedule changed since it was read; re-read it and retry with the current revision
                    trace_id: 0123456789abcdef0123456789abcdef
        "501":
          description: This deployment has no schedule overlay store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                notConfigured:
                  summary: No schedule overlay store is configured on this server.
                  value:
                    success: false
                    code: schedules_unavailable
                    message: the schedules API is not configured on this server
                    trace_id: 0123456789abcdef0123456789abcdef
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/workflows/{id}/schedules/{node}/override:
    delete:
      operationId: deleteScheduleOverride
      summary: Drop a schedule's overlay
      description: |
        Removes the overlay, returning the schedule to what its definition says,
        and returns the resulting view (`overridden` false).

        This is the only operation that works on an ORPHANED overlay — one whose
        node the current version no longer declares — and that is the point: a
        leftover row nobody can see is also a leftover row nobody can clean up.
        Every other route resolves the node first and refuses without one.

        Deleting an overlay that was never written is 404, not success: the
        caller addressed something that does not exist rather than asking for a
        state that already holds. The `If-Match` precondition applies as it does
        on write.

        Requires the `schedule.write` scope.
      tags: [Schedules]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/ScheduleNode"
        - $ref: "#/components/parameters/IfMatchRevision"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: The overlay is gone; the view describes the definition-backed schedule.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ScheduleView"
        "202":
          description: |
            The overlay was removed, but the trigger host was not notified
            (a reload failure). The removal is durable; the schedule stops
            following the dropped overlay at the host's next activation.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ScheduleView"
        "400":
          description: The `If-Match` precondition is not a revision number (`invalid_if_match`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalidIfMatch:
                  summary: The precondition is not a revision number (the value is not echoed).
                  value:
                    success: false
                    code: invalid_if_match
                    message: If-Match must be the revision number a previous read reported, or 0 for create-only-if-absent
                    trace_id: 0123456789abcdef0123456789abcdef
        "404":
          description: |
            `workflow_not_found`, or `schedule_not_found` when there is no
            overlay at that address to drop.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                noOverlay:
                  summary: No overlay exists for that node.
                  value:
                    success: false
                    code: schedule_not_found
                    message: schedule not found
                    trace_id: 0123456789abcdef0123456789abcdef
        "409":
          description: The `If-Match` precondition does not hold; nothing was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                revisionConflict:
                  summary: The overlay's revision is not the one the caller asserted.
                  value:
                    success: false
                    code: schedule_revision_conflict
                    message: the schedule changed since it was read; re-read it and retry with the current revision
                    trace_id: 0123456789abcdef0123456789abcdef
        "501":
          description: This deployment has no schedule overlay store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                notConfigured:
                  summary: No schedule overlay store is configured on this server.
                  value:
                    success: false
                    code: schedules_unavailable
                    message: the schedules API is not configured on this server
                    trace_id: 0123456789abcdef0123456789abcdef
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/workflows/{id}/schedules/{node}/pause:
    post:
      operationId: pauseSchedule
      summary: Pause a schedule
      description: |
        Stops the schedule from firing without changing what it says, and returns
        the resulting view (`paused` true).

        Pausing is idempotent: pausing an already-paused schedule writes nothing
        and bumps no `revision`, so a retried or concurrent pause cannot
        invalidate another operator's `If-Match`.

        Pausing does NOT take the schedule out of the trigger host's hands. The
        host keeps the subscription and drops each firing, which is what keeps
        the watermark advancing — and that is why resuming never replays the
        paused window. Asking for those instants is what the backfill route is
        for.

        Nothing is validated about the expression: pause is the action an
        operator reaches for when a schedule is misbehaving, and refusing it
        because the definition holds an expression the trigger rejects would be
        exactly backwards.

        Requires the `schedule.write` scope.
      tags: [Schedules]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/ScheduleNode"
        - $ref: "#/components/parameters/IfMatchRevision"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: The schedule is paused (or already was).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ScheduleView"
        "202":
          description: |
            The pause was stored, but the trigger host was not notified
            (a reload failure). The schedule keeps firing until the host reads
            the new overlay at its next activation.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ScheduleView"
        "400":
          description: The `If-Match` precondition is not a revision number (`invalid_if_match`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalidIfMatch:
                  summary: The precondition is not a revision number (the value is not echoed).
                  value:
                    success: false
                    code: invalid_if_match
                    message: If-Match must be the revision number a previous read reported, or 0 for create-only-if-absent
                    trace_id: 0123456789abcdef0123456789abcdef
        "404":
          description: |
            `workflow_not_found`, or `schedule_not_found` — an orphaned overlay
            has no firing to pause.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                scheduleNotFound:
                  summary: The node is not a schedule of this workflow.
                  value:
                    success: false
                    code: schedule_not_found
                    message: schedule not found
                    trace_id: 0123456789abcdef0123456789abcdef
        "409":
          description: The `If-Match` precondition does not hold; the schedule is unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                revisionConflict:
                  summary: The overlay's revision is not the one the caller asserted.
                  value:
                    success: false
                    code: schedule_revision_conflict
                    message: the schedule changed since it was read; re-read it and retry with the current revision
                    trace_id: 0123456789abcdef0123456789abcdef
        "501":
          description: This deployment has no schedule overlay store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                notConfigured:
                  summary: No schedule overlay store is configured on this server.
                  value:
                    success: false
                    code: schedules_unavailable
                    message: the schedules API is not configured on this server
                    trace_id: 0123456789abcdef0123456789abcdef
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/workflows/{id}/schedules/{node}/resume:
    post:
      operationId: resumeSchedule
      summary: Resume a paused schedule
      description: |
        Lets the schedule fire again and returns the resulting view (`paused`
        false).

        Resuming is not a catch-up: what the pause skipped stays skipped. The
        watermark kept advancing while the schedule was paused, so the next
        firing is the next instant of the schedule's own grid rather than the
        first one missed.

        Like pause it is idempotent — resuming a schedule that is not paused
        writes nothing and bumps no revision.

        Requires the `schedule.write` scope.
      tags: [Schedules]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/ScheduleNode"
        - $ref: "#/components/parameters/IfMatchRevision"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: The schedule fires again (or already did).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ScheduleView"
        "202":
          description: |
            The resume was stored, but the trigger host was not notified
            (a reload failure). The schedule starts firing again at the host's
            next activation, still without replaying the paused window.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ScheduleView"
        "400":
          description: The `If-Match` precondition is not a revision number (`invalid_if_match`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalidIfMatch:
                  summary: The precondition is not a revision number (the value is not echoed).
                  value:
                    success: false
                    code: invalid_if_match
                    message: If-Match must be the revision number a previous read reported, or 0 for create-only-if-absent
                    trace_id: 0123456789abcdef0123456789abcdef
        "404":
          description: |
            `workflow_not_found`, or `schedule_not_found` — an orphaned overlay
            has no firing to resume.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                scheduleNotFound:
                  summary: The node is not a schedule of this workflow.
                  value:
                    success: false
                    code: schedule_not_found
                    message: schedule not found
                    trace_id: 0123456789abcdef0123456789abcdef
        "409":
          description: The `If-Match` precondition does not hold; the schedule is unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                revisionConflict:
                  summary: The overlay's revision is not the one the caller asserted.
                  value:
                    success: false
                    code: schedule_revision_conflict
                    message: the schedule changed since it was read; re-read it and retry with the current revision
                    trace_id: 0123456789abcdef0123456789abcdef
        "501":
          description: This deployment has no schedule overlay store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                notConfigured:
                  summary: No schedule overlay store is configured on this server.
                  value:
                    success: false
                    code: schedules_unavailable
                    message: the schedules API is not configured on this server
                    trace_id: 0123456789abcdef0123456789abcdef
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/workflows/{id}/schedules/{node}/backfill:
    post:
      operationId: backfillSchedule
      summary: Run a schedule's past instants over a range
      description: |
        Fires the instants of a PAST range, one at a time, oldest first, and
        reports what happened to each. This is the explicit replay a pause does
        not promise: resuming after a pause continues the schedule's grid, and
        an operator who wants the instants the pause skipped asks for them here.

        The range is `(from, to]`. An instant exactly at `from` is normally one
        that already fired — it is where a watermark sits — and asking for its
        re-run is a different request than asking for a range. A `to` in the
        FUTURE is refused rather than clamped: an instant the schedule has not
        reached yet belongs to the live trigger, and firing it here would either
        suppress the real firing or be forgotten before it, depending on how far
        ahead the range reaches.

        The plan is capped at 1000 instants and the cap is a refusal, not a
        truncation: a backfill is a request to have a named set of instants run,
        and silently planning the oldest thousand of two thousand would leave the
        operator believing they asked for less than they did. A dry run is bound
        by the same cap — the plan is what is being capped — so a wide range is
        explored by narrowing it until the plan fits.

        The instants are the EFFECTIVE schedule's: the overlay's expression where
        the operator retimed the node, the definition's where they did not, so a
        backfill plans what the schedule the operator is looking at would have
        fired.

        Running it is safe to repeat. Each instant is identified by the schedule's
        own timeline and claimed under the backfill's own deduplication, so an
        instant that already ran is reported as a `duplicate` skip rather than run
        again, and a partly successful range can simply be re-run.

        A refusal is answered with the error alone: no plan is returned beside a
        400, because a client reading one as "these ran" would be wrong. Narrow
        the range the error asks for and dry-run that.

        Requires the `schedule.backfill` scope, and NOT `schedule.write`: this is
        the one schedule operation that starts executions, so it is the one whose
        grant is separate.
      tags: [Schedules]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/ScheduleNode"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleBackfillRequest"
      responses:
        "200":
          description: |
            The range was planned. `dry_run` says whether it was also fired;
            `emitted` and `skipped` together account for every planned instant.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ScheduleBackfillResult"
        "400":
          description: |
            The range cannot be planned: `invalid_backfill_range` for an inverted
            or empty range, a `to` in the future, a range holding more than 1000
            instants, or a timestamp that is missing or not RFC3339 (the message
            names the field). `schedule_not_found` is 404, not this.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                future:
                  summary: A backfill reaches only instants the schedule has already reached.
                  value:
                    success: false
                    code: invalid_backfill_range
                    message: "control: invalid backfill range: to (2026-05-04T13:00:00Z) is in the future; a backfill reaches only instants the schedule has already reached"
                    trace_id: 0123456789abcdef0123456789abcdef
                overCap:
                  summary: The range holds more instants than one request may plan.
                  value:
                    success: false
                    code: invalid_backfill_range
                    message: "control: invalid backfill range: the range holds more than 1000 instants; narrow it (or dry-run a narrower range first)"
                    trace_id: 0123456789abcdef0123456789abcdef
                missingField:
                  summary: A required timestamp is missing or not RFC3339.
                  value:
                    success: false
                    code: invalid_backfill_range
                    message: from is required and must be an RFC3339 timestamp
                    trace_id: 0123456789abcdef0123456789abcdef
        "404":
          description: |
            `workflow_not_found`, or `schedule_not_found` — an orphaned overlay
            has no live rule to plan instants from.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                scheduleNotFound:
                  summary: The node is not a schedule of this workflow.
                  value:
                    success: false
                    code: schedule_not_found
                    message: schedule not found
                    trace_id: 0123456789abcdef0123456789abcdef
        "501":
          description: |
            Two codes share this status. `schedules_unavailable` when this
            deployment has no overlay store at all, and `backfill_unavailable`
            when it stores schedules but does not host the workflow's triggers —
            firing an instant outside an activation is the trigger host's job, and
            a control plane whose triggers run on runners has nothing here to
            call. The plan is still answerable in that deployment: dry-run it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                noHost:
                  summary: This server does not host the workflow's triggers.
                  value:
                    success: false
                    code: backfill_unavailable
                    message: this server does not host the workflow's triggers, so it cannot fire a backfilled instant
                    trace_id: 0123456789abcdef0123456789abcdef
                notConfigured:
                  summary: No schedule overlay store is configured on this server.
                  value:
                    success: false
                    code: schedules_unavailable
                    message: the schedules API is not configured on this server
                    trace_id: 0123456789abcdef0123456789abcdef
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServerOverloaded"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/executions:
    get:
      operationId: listExecutions
      summary: List executions
      description: |
        One offset-paginated page of the executions recorded in the caller's own
        namespace (spec §3.3 page list). Namespace is resolved server-side from
        the authenticated principal — there is no `namespace` parameter, and a
        caller can never list another tenant's executions.

        `list` holds summary rows, not execution snapshots; read one execution
        with `GET /v1/executions/{id}`. Rows are ordered newest first
        (`created_at` descending, then `id` descending), so the order is total
        and stable across pages. `total` is the exact size of the collection in
        the caller's namespace AFTER filtering — what a pagination control
        needs, independent of the page requested.

        Every row carries the namespace it belongs to, and only rows whose
        namespace is exactly the caller's are returned. Rows whose namespace is
        the unattributed sentinel `""` — written before the namespace column
        existed, or by a writer that did not set it — are unreachable from every
        scope and every filter. That is deliberate: it is better to under-report
        an execution than to show one tenant another tenant's row.

        Offset pagination is the page-list default by rule: the
        cursor-paginated endpoints exist only for machine scans, and no endpoint
        carries both.
      tags: [Executions]
      parameters:
        - name: page
          in: query
          required: false
          description: |
            1-based page number (spec §3.3); `page=1` is the first page.
            Malformed pagination input is never a business error: an absent,
            empty, non-numeric, zero, or negative value falls back to 1. The
            constraints below describe the domain the server honors, not a
            request-validation gate.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          description: |
            Rows per page (spec §3.3). Defaults to 20. The server enforces a
            hard ceiling of 200 and CLAMPS a larger request to 200 rather than
            rejecting it — that ceiling is a security control (a sensitive-data
            enumeration endpoint must not permit full-table traversal), not a
            performance knob. An absent, empty, non-numeric, zero, or negative
            value falls back to 20.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - name: status
          in: query
          required: false
          description: |
            Narrows the page to one lifecycle status. Both the page and `total`
            are narrowed by it, so `total` is the size of the filtered set.

            An unrecognized value is a 400 `execution_status_invalid`, NOT an
            empty page: a typo served as `list: []` is indistinguishable from
            "no executions have that status".
          schema:
            $ref: "#/components/schemas/ExecutionStatus"
        - name: workflow_id
          in: query
          required: false
          description: |
            Narrows the page to one workflow, by the server-assigned workflow id
            and EXACT match — not a workflow name, and not a prefix. Both the
            page and `total` are narrowed by it.

            Rows recorded before the column existed, or submitted without a
            workflow definition id, carry the unattributed sentinel `""` and
            match NO `workflow_id` filter: an execution is never guessed into a
            workflow. An absent or empty value means unfiltered.

            A value longer than 64 characters can never equal a stored id and is a
            400 `execution_workflow_id_invalid` rather than being ignored —
            ignoring it would answer with the whole namespace as if it were the
            filtered page.
          schema:
            type: string
            maxLength: 64
        - name: created_after
          in: query
          required: false
          description: |
            Lower bound on `created_at`, RFC3339 (a fractional second is
            accepted). The bound is EXCLUSIVE: an execution created exactly at
            it is not returned. Absent means unbounded on that side.

            A value that does not parse is a 400
            `execution_list_time_invalid` rather than being ignored: an ignored
            lower bound silently widens the result set, and widening a
            tenant-scoped enumeration is the direction that costs data.
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          required: false
          description: |
            Upper bound on `created_at`, RFC3339 (a fractional second is
            accepted). The bound is EXCLUSIVE — an execution created exactly at
            it is not returned — so a caller walking adjacent windows
            (`[t0,t1)`, `[t1,t2)`) cannot double-count a row landing on `t1`.
            Absent means unbounded on that side. A value that does not parse is
            a 400 `execution_list_time_invalid`.
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: One page of executions.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ExecutionListResponse"
        "400":
          description: |
            A filter value is unusable: an unrecognized `status`, a
            `workflow_id` longer than the 64-byte identity column, or a
            `created_after` / `created_before` that is not an RFC3339
            date-time.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                unknownStatus:
                  summary: The status filter is not a lifecycle status.
                  value:
                    success: false
                    code: execution_status_invalid
                    message: status must be one of pending, queued, paused, running, success, failed, canceling, canceled, timeout
                    trace_id: 0123456789abcdef0123456789abcdef
                unparsableBound:
                  summary: A created_at bound is not an RFC3339 date-time.
                  value:
                    success: false
                    code: execution_list_time_invalid
                    message: created_after must be an RFC3339 date-time
                    trace_id: 0123456789abcdef0123456789abcdef
                overlongWorkflowId:
                  summary: The workflow_id filter cannot equal any stored id.
                  value:
                    success: false
                    code: execution_workflow_id_invalid
                    message: workflow_id must be at most 64 characters
                    trace_id: 0123456789abcdef0123456789abcdef
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/executions/{id}:
    get:
      operationId: getExecution
      summary: Inspect an execution
      description: Returns the current execution detail (audit snapshot of status + per-node state).
      tags: [Executions]
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Execution detail.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ExecutionDetail"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/executions/{id}/cancel:
    post:
      operationId: cancelExecution
      summary: Cancel an execution
      description: Requests cancellation of the named execution.
      tags: [Executions]
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Cancel accepted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AcceptedResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServerOverloaded"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/executions/{id}/pause:
    post:
      operationId: pauseExecution
      summary: Pause an execution
      description: |
        Suspends dispatch of a running execution and returns the resulting
        execution detail. The status becomes `paused`, which is not terminal.

        Work already leased to a runner is NOT interrupted: it runs to
        completion and commits its result — including the commit that happens to
        finish the execution — after which nothing new is dispatched. Suspended
        nodes stay suspended, and a signal that arrives while paused is still
        recorded; neither advances the run.

        A paused execution keeps its concurrency slot: it still holds the run it
        was admitted for, and releasing the slot would leave `resume` with
        nowhere to return. `cancel` accepts a paused execution, which is the way
        to release the slot without resuming.

        Pausing an already-paused execution succeeds (the operation is
        idempotent), so a retried request whose response was lost does not read
        as a conflict. A `queued` execution cannot be paused — it has not
        started, so there is no dispatch to hold — and neither can a terminal
        one; both are 409.

        Requires the `execution.control` scope.
      tags: [Executions]
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Paused, or already paused. The detail carries the current status.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ExecutionDetail"
        "404":
          description: No such execution in the caller's namespace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                notFound:
                  summary: The execution does not exist (or belongs to another namespace).
                  value:
                    success: false
                    code: execution_not_found
                    message: execution not found
                    trace_id: 0123456789abcdef0123456789abcdef
        "409":
          description: |
            The execution is not in a pausable status. Check the `code`:
            `execution_not_pausable` covers both the queued and the terminal
            case, so a client that wants to tell them apart reads the status
            from `GET /v1/executions/{id}`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                queued:
                  summary: A queued execution has no running dispatch to hold.
                  value:
                    success: false
                    code: execution_not_pausable
                    message: execution is not in a pausable status
                    trace_id: 0123456789abcdef0123456789abcdef
        "501":
          description: This deployment cannot suspend dispatch at all (no pause capability).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                unsupported:
                  summary: Neither the server nor its state store can hold dispatch.
                  value:
                    success: false
                    code: execution_control_unsupported
                    message: execution control is not supported
                    trace_id: 0123456789abcdef0123456789abcdef
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServerOverloaded"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/executions/{id}/resume:
    post:
      operationId: resumeExecution
      summary: Resume an execution
      description: |
        Returns a paused execution to dispatch and queues the work the pause
        held, then returns the resulting execution detail. The held work keeps
        the deadline it was written with — a delayed intent is not pulled
        forward — so an execution paused across a timer resumes on that timer's
        original schedule, not immediately.

        Only a `paused` execution can be resumed; every other status is 409
        `execution_not_paused`, including a paused execution that reached a
        terminal status while it was held (a task leased before the pause is
        allowed to finish it).

        Requires the `execution.control` scope.
      tags: [Executions]
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Resumed. The detail carries the current status.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ExecutionDetail"
        "404":
          description: No such execution in the caller's namespace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                notFound:
                  summary: The execution does not exist (or belongs to another namespace).
                  value:
                    success: false
                    code: execution_not_found
                    message: execution not found
                    trace_id: 0123456789abcdef0123456789abcdef
        "409":
          description: The execution is not paused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                notPaused:
                  summary: A resume is not a general restart.
                  value:
                    success: false
                    code: execution_not_paused
                    message: execution is not paused
                    trace_id: 0123456789abcdef0123456789abcdef
        "501":
          description: This deployment cannot suspend dispatch at all (no pause capability).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                unsupported:
                  summary: Neither the server nor its state store can hold dispatch.
                  value:
                    success: false
                    code: execution_control_unsupported
                    message: execution control is not supported
                    trace_id: 0123456789abcdef0123456789abcdef
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServerOverloaded"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/executions/{id}/rerun:
    post:
      operationId: rerunExecution
      summary: Rerun an execution from a node
      description: |
        Creates a NEW execution derived from a terminal one and returns the new
        execution's id, starting at `from_node`.

        Everything upstream of `from_node` is copied from the execution being
        rerun — each node's stored output and chosen port, or the skip the
        original resolved it with — and `from_node` and everything downstream of
        it run again. The result is a complete execution, not a fragment, and it
        carries `parent_execution_id` and `rerun_from` so the derivation stays
        readable after the original's retention expires.

        The execution being rerun is NEVER modified: no node result, lease or
        audit row of it is disturbed. That is what makes this safe to offer for
        any terminal execution, and it is also why a rerun is not a way to
        "reset" an execution in place — a caller that wants the original
        untouched and a second result gets exactly that, and a caller watching
        the original sees nothing change.

        `failed`, `canceled` and `timeout` sources are always accepted; a
        `success` source requires `include_success` — rerunning what already
        worked is a deliberate act. Every other status is 409
        `execution_not_rerunnable`, including `paused`: a live execution is
        allowed to finish (or is canceled), and deriving from a moving target
        would copy a prefix that is still being written.

        The new execution contends for its workflow's concurrency limit as any
        other admission does: it is judged by the definition that ran, so a
        limit lowered since then does not retroactively refuse it. Under
        `mode: queue` it is parked with a `queue_position`; over the limit it is
        429 with nothing persisted.

        Requires the `execution.rerun` scope — deliberately not
        `execution.control`: suspending a running pipeline and deriving a new
        execution from a terminal one are different trust.

        An Idempotency-Key makes the rerun safe to retry: the key is scoped to
        the execution being rerun, and the fingerprint covers that execution,
        `from_node` and `include_success`, so a retry of the same request is
        answered with the rerun the first attempt created
        (`data.duplicate: true`) and the same key on a different request is 409
        `idempotency_key_conflict`.
      tags: [Executions]
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RerunExecutionRequest"
      responses:
        "200":
          description: |
            The rerun was admitted. `data.execution_id` is the NEW execution;
            the execution this call addressed is unchanged.

            When the request carried an Idempotency-Key that had already
            created this rerun, `data.duplicate` is true: the execution id and
            status are the ORIGINAL rerun's, and this request created nothing.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RerunExecutionResponse"
        "400":
          description: |
            The request names no rerun point, names one the execution's graph
            does not define, or carries an Idempotency-Key outside the accepted
            shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                fromNodeRequired:
                  summary: An empty from_node is refused rather than defaulted — a default would silently re-run the whole workflow.
                  value:
                    success: false
                    code: from_node_required
                    message: from_node is required
                    trace_id: 0123456789abcdef0123456789abcdef
                nodeNotFound:
                  summary: The node is not in the graph this execution ran.
                  value:
                    success: false
                    code: rerun_node_not_found
                    message: from_node is not in the execution's graph
                    trace_id: 0123456789abcdef0123456789abcdef
                idempotencyKeyInvalid:
                  summary: The Idempotency-Key does not match 1-255 characters of [A-Za-z0-9._:-].
                  value:
                    success: false
                    code: idempotency_key_invalid
                    message: 'Idempotency-Key must be 1-255 characters of A-Za-z0-9._:-'
                    trace_id: 0123456789abcdef0123456789abcdef
        "404":
          description: |
            No such execution in the caller's namespace — or the execution's
            definition is gone with its expired retention, which leaves nothing
            to rerun.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                notFound:
                  summary: The execution does not exist (or belongs to another namespace).
                  value:
                    success: false
                    code: execution_not_found
                    message: execution not found
                    trace_id: 0123456789abcdef0123456789abcdef
        "409":
          description: |
            The execution cannot be rerun from that node, or the request's
            Idempotency-Key is not usable for it.

            Four codes describe an unusable rerun source:
            `execution_not_rerunnable` for a source whose status is not an
            acceptable one (pass `include_success` to accept a successful
            source), `rerun_upstream_incomplete` when a node above the rerun
            point has no result to copy — rerun from that node instead, which is
            where the missing result stops being an input — and
            `rerun_graph_unsupported` when the graph's shape cannot be seeded
            from a node (a cyclic graph, or a group unit outside the rerun
            subtree). The last is a property of the definition, so retrying
            changes nothing.

            Two describe the key: `idempotency_key_conflict` when the key
            already created a rerun of a DIFFERENT request from this same
            execution (a different from_node or include_success), and
            `idempotency_key_in_progress` when a concurrent request with the
            same key and request is still creating its execution. Nothing was
            persisted by the refused request in any of the six cases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                notRerunnable:
                  summary: A live execution is not rerunnable.
                  value:
                    success: false
                    code: execution_not_rerunnable
                    message: execution is not in a rerunnable status
                    trace_id: 0123456789abcdef0123456789abcdef
                upstreamIncomplete:
                  summary: A node upstream of the rerun point never reached an outcome, so there is nothing to copy.
                  value:
                    success: false
                    code: rerun_upstream_incomplete
                    message: a node upstream of the rerun point has no result to copy
                    trace_id: 0123456789abcdef0123456789abcdef
                graphUnsupported:
                  summary: The definition cannot be seeded from a node.
                  value:
                    success: false
                    code: rerun_graph_unsupported
                    message: the execution's graph does not support rerun from a node
                    trace_id: 0123456789abcdef0123456789abcdef
                idempotencyKeyConflict:
                  summary: The key was already used for a different rerun of this execution.
                  value:
                    success: false
                    code: idempotency_key_conflict
                    message: the idempotency key was already used for a different request
                    trace_id: 0123456789abcdef0123456789abcdef
                idempotencyKeyInProgress:
                  summary: A concurrent request with the same key and request is still creating its rerun.
                  value:
                    success: false
                    code: idempotency_key_in_progress
                    message: a request with this idempotency key is still in progress
                    trace_id: 0123456789abcdef0123456789abcdef
        "429":
          description: |
            The workflow refused the rerun because of its own declared limits
            (`settings.concurrency`). Same contract as
            POST /v1/workflows/execute: nothing was persisted, `Retry-After` is
            a floor, and the code is `workflow_concurrency_limit` for a reached
            limit or `workflow_concurrency_queue_full` for a full queue.
            The API admission layer answers this status too, with
            `rate_limited`, when the caller's namespace has spent its API rate
            budget; that refusal precedes the workflow and is described by
            the RateLimited response.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Retry-After:
              description: Seconds to wait before retrying, as a floor.
              schema:
                type: integer
                example: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                workflowConcurrencyLimit:
                  summary: The workflow is already running as many executions as its limit allows.
                  value:
                    success: false
                    code: workflow_concurrency_limit
                    message: workflow is at its concurrency limit
                    trace_id: 0123456789abcdef0123456789abcdef
                rateLimited:
                  summary: The namespace's API rate budget is spent (admission, before the workflow is consulted).
                  value:
                    success: false
                    code: rate_limited
                    message: rate limit exceeded
                    trace_id: 0123456789abcdef0123456789abcdef
        "501":
          description: |
            This deployment cannot seed an execution (no rerun capability), so
            there is no rerun to serve — the answer changes when the deployment
            does, not when the caller retries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                unsupported:
                  summary: Neither the server nor its state store can seed an execution.
                  value:
                    success: false
                    code: execution_rerun_unsupported
                    message: execution rerun is not supported
                    trace_id: 0123456789abcdef0123456789abcdef
        "503":
          $ref: "#/components/responses/ServerOverloaded"
        default:
          $ref: "#/components/responses/DefaultError"

