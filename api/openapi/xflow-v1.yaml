openapi: 3.1.0
info:
  title: xflow Workflow Management API
  version: 1.0.0
  description: |
    User-facing HTTP contract for xflow. This spec mirrors the routes that are
    actually registered on the apiserver mux (docs/design/API-SPECIFICATION.md
    §7, §10). The runner protocol face — including POST /v1/executions
    (entry-seed) and the entire /v1/runners/* family — is intentionally absent:
    per spec §0.1 / §10 the OpenAPI contract describes only the user face.

    Every user-face JSON response is wrapped in the Envelope (§3). The only
    exceptions are the raw-byte streams (GET /v1/supplies/{name},
    GET|HEAD /v1/artifacts/{digest}) whose 2xx bodies are octet-streams (their
    failure bodies are still JSON Envelopes — spec §3.4) and the /healthz and
    /readyz probes, which load balancers parse directly and must not be
    enveloped (§7).
  contact:
    name: xflow maintainers
    url: https://github.com/xbcio/xflow
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /
    description: Paths are absolute so the contract compares cleanly against the server path constants.

tags:
  - name: Workflows
    description: Register, read, replace, deregister, and execute workflow definitions.
  - name: Executions
    description: Inspect, signal, cancel, and wait for executions.
  - name: Supplies
    description: Push and read supply content (raw-byte stream on success).
  - name: Artifacts
    description: Fetch script artifact bytes (raw-byte stream on success).
  - name: Management
    description: "Ops surface: leader status, runner/execution inspect, dead-letter list/replay."
  - name: Probes
    description: Liveness and readiness probes (not enveloped, not authenticated).

security:
  - bearerAuth: []

paths:
  /v1/workflows:
    post:
      operationId: registerWorkflow
      summary: Register a workflow definition
      description: |
        Compiles the submitted definition and persists the compiled graph in the
        server-side registry (spec §7). Namespace is resolved server-side from
        the authenticated principal — never from the request body (§6.2).
        Returns 201 with a Location header pointing at the new resource.
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowDef"
      responses:
        "201":
          description: Workflow registered.
          headers:
            Location:
              description: Absolute path of the newly registered workflow.
              schema:
                type: string
                example: /v1/workflows/wf-01H8XG...
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RegisterWorkflowResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/workflows/{id}:
    get:
      operationId: getWorkflow
      summary: Read a workflow definition
      description: Returns the stored definition for one workflow id. A cross-namespace id resolves to not-found → 404.
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: The workflow definition.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WorkflowDef"
        default:
          $ref: "#/components/responses/DefaultError"
    put:
      operationId: replaceWorkflow
      summary: Replace a workflow definition
      description: |
        Replaces the workflow resource selected by the path `id`; the path
        `id` is the authoritative resource identity. The body `id` is optional,
        but when present it must equal the path `id`, otherwise the request
        fails with 400 (`workflow_id_mismatch`).

        Namespace comes from the authenticated principal, never from the body.
        A missing path target, including a workflow owned by another namespace,
        fails with 404 (`workflow_not_found`).

        The replacement may rename the workflow or change its version while
        preserving the path id when the resulting (namespace, name, version)
        destination key is free. If another workflow owns that key, the request
        fails with 409 (`workflow_conflict`). PUT never deletes or overwrites a
        different workflow merely because its key is named by the body.
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        description: |
          Complete replacement as a types.WorkflowDef JSON object. `id` may be
          omitted; if supplied it must match the path. `namespace` may also be
          omitted and cannot select the target because the server overwrites it
          with the authenticated principal's namespace.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowDef"
      responses:
        "200":
          description: Workflow replaced.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RegisterWorkflowResponse"
        "400":
          description: The body id differs from the path id, or the replacement definition is invalid.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                workflowIdMismatch:
                  summary: The optional body id does not match the authoritative path id.
                  value:
                    success: false
                    code: workflow_id_mismatch
                    message: workflow id does not match path
                    trace_id: 0123456789abcdef0123456789abcdef
        "404":
          description: No workflow with the path id exists in the authenticated namespace.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                workflowNotFound:
                  summary: Missing and cross-namespace targets are indistinguishable.
                  value:
                    success: false
                    code: workflow_not_found
                    message: workflow not found
                    trace_id: 0123456789abcdef0123456789abcdef
        "409":
          description: Another workflow owns the replacement's destination (namespace, name, version) key; neither workflow is replaced.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                workflowConflict:
                  summary: A rename or version change selected an occupied destination key.
                  value:
                    success: false
                    code: workflow_conflict
                    message: workflow definition conflicts with an existing registration
                    trace_id: 0123456789abcdef0123456789abcdef
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: deregisterWorkflow
      summary: Deregister a workflow definition
      description: Removes the persisted record for the given workflow id.
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Workflow removed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RemovedResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/workflows/execute:
    post:
      operationId: executeInlineWorkflow
      summary: Compile and execute an inline workflow definition
      description: |
        Merges the old submit/invoke shapes: when entry is empty the graph's
        default start node is used; when set, that entry node drives the
        explicit-entry path (spec §7, §9.1).
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteWorkflowRequest"
      responses:
        "200":
          description: Execution started.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ExecuteWorkflowResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/workflows/{id}/execute:
    post:
      operationId: executeRegisteredWorkflow
      summary: Execute an already-registered workflow by id
      description: Resolves the stored compiled graph and submits it. The body is optional.
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteRegisteredRequest"
      responses:
        "200":
          description: Execution started.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ExecuteWorkflowResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/executions/{id}:
    get:
      operationId: getExecution
      summary: Inspect an execution
      description: Returns the current execution detail (audit snapshot of status + per-node state).
      tags: [Executions]
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Execution detail.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ExecutionDetail"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/executions/{id}/cancel:
    post:
      operationId: cancelExecution
      summary: Cancel an execution
      description: Requests cancellation of the named execution.
      tags: [Executions]
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Cancel accepted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AcceptedResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/executions/{id}/signals:
    post:
      operationId: deliverSignal
      summary: Deliver a signal to an execution
      description: Delivers a named signal with an optional data payload.
      tags: [Executions]
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignalRequest"
      responses:
        "200":
          description: Signal accepted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AcceptedResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/executions/{id}/signals/{name}:
    delete:
      operationId: revokeSignal
      summary: Revoke a signal
      description: Revokes a not-yet-consumed signal by name. The name travels in the path (§9.1).
      tags: [Executions]
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
        - $ref: "#/components/parameters/SignalName"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Signal revoked.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RevokedResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/executions/{id}/wait:
    get:
      operationId: waitExecution
      summary: Long-poll an execution until terminal
      description: |
        Long-polls until the execution reaches a terminal state or the timeout
        elapses. On terminal returns the ExecutionDetail (200); on timeout
        returns 202 with a timeout descriptor. The optional ?timeout= query
        parameter is a Go duration (default 5s, capped at 10m).
      tags: [Executions]
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
        - name: timeout
          in: query
          description: Go duration string (default 5s, max 10m).
          schema:
            type: string
            example: 30s
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Terminal execution detail.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ExecutionDetail"
        "202":
          description: Timed out before reaching a terminal state.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WaitTimeoutResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/supplies/{name}:
    # The write verb (PUT) is sealed (spec appendix Z.5). The only write entry
    # point is in-process: sdk/xflow.Server.UpdateSupply / UpdateSupplyIfMatch,
    # which an embedder is expected to wrap with its own session, authorization,
    # and audit. This path serves GET only.
    get:
      operationId: getSupply
      summary: Read supply content
      description: |
        Returns the raw supply bytes (§3.4). Success is application/octet-stream
        (or the stored content type, or application/x-xflow-encrypted when the
        runner requests it). Failure is a JSON Envelope. ETag carries the
        content hash; X-Supply-Revision carries the revision.
      tags: [Supplies]
      parameters:
        - $ref: "#/components/parameters/SupplyName"
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
        - name: Accept
          in: header
          required: false
          description: Send application/x-xflow-encrypted to request encrypted content.
          schema:
            type: string
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Supply bytes.
          headers:
            ETag:
              schema:
                type: string
            X-Supply-Revision:
              schema:
                type: string
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/x-xflow-encrypted:
              schema:
                type: string
                format: binary
        "304":
          description: Not modified (If-None-Match matched).
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/artifacts/{digest}:
    get:
      operationId: getArtifact
      summary: Fetch artifact bytes
      description: |
        Returns the raw bytes for a digest the caller's namespace references
        (§3.4). Authorization is an identity-table lookup, so an unreferenced or
        cross-namespace digest answers 404 (not 403) to avoid leaking existence.
      tags: [Artifacts]
      parameters:
        - $ref: "#/components/parameters/ArtifactDigest"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Artifact bytes.
          headers:
            ETag:
              schema:
                type: string
            Content-Length:
              schema:
                type: string
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/DefaultError"
    head:
      operationId: statArtifact
      summary: Stat an artifact
      description: Returns headers only (size, ETag) without the body.
      tags: [Artifacts]
      parameters:
        - $ref: "#/components/parameters/ArtifactDigest"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Artifact stat.
          headers:
            ETag:
              schema:
                type: string
            Content-Length:
              schema:
                type: string
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/management/leader:
    get:
      operationId: getLeader
      summary: Report leadership status
      description: Returns whether this replica currently holds leadership.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Leader status.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LeaderResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/management/runners:
    get:
      operationId: listRunners
      summary: Enumerate the runner directory
      description: |
        Lists every runner id known to the directory, with whether each was
        issued its credential through the enrollment endpoint (`enrolled:
        true`) or a static policy file (`enrolled: false`). This is what tells
        an operator which runners a revoked registration code would affect.

        Returns 501 `runner_listing_unsupported` when the configured runner
        directory does not structurally support enumeration, rather than an
        empty array — an empty list and "this backend cannot answer" must
        stay visibly distinct.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Runner list.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/RunnerListItem"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/management/runners/{id}:
    get:
      operationId: getRunner
      summary: Inspect a single runner
      description: Returns the registration and liveness snapshot for one runner id. No list API exists.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/RunnerId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Runner snapshot.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RunnerSnapshot"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/management/runners/{id}/revoke-identity:
    post:
      operationId: revokeRunnerIdentity
      summary: Revoke a runner's issued identity
      description: |
        Revokes one runner's issued identity, taking effect on its next
        authenticated call. Requires `management.runner.revoke_identity`.

        This is a PLATFORM-LEVEL operation with no per-namespace confinement.
        An issued identity's scope is a set of namespaces, not a single owner,
        so "may this tenant revoke this runner" has no single correct answer —
        intersection would let one tenant kill another's runner, containment
        would be no confinement at all. Until that is designed, grant this
        scope to platform operators only.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/RunnerId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Revocation acknowledged.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          runner_id:
                            type: string
                          status:
                            type: string
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/management/executions/{id}:
    get:
      operationId: inspectExecutionManagement
      summary: Inspect an execution (management view)
      description: |
        Ops view of a single execution. Returns byte-identical body to
        GET /v1/executions/{id} (spec §7.2); the two Ops stay distinct so an
        ops token and a business token may be granted separately.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Execution detail.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ExecutionDetail"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/management/dead-letters/{execID}:
    get:
      operationId: listDeadLetters
      summary: List dead-lettered outbox entries
      description: |
        Cursor-paginated list of dead-lettered durable outbox entries for one
        execution (spec §3.3 cursor exception — this is the machine-scan
        endpoint, not a page list). An empty cursor starts from the oldest
        entry.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/DeadLetterExecId"
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Dead-letter page.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DeadLetterListResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/management/dead-letters/{execID}/replay:
    post:
      operationId: replayDeadLetter
      summary: Replay a dead-lettered entry
      description: |
        Moves a dead-lettered entry atomically back to the ready set for
        redelivery. Activation-safe: rejects entries whose node is terminal or
        whose activation no longer matches. Idempotent under request_id.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/DeadLetterExecId"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeadLetterReplayRequest"
      responses:
        "200":
          description: Replay result.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DeadLetterReplayResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/management/registration-codes:
    post:
      operationId: createRegistrationCode
      summary: Mint a runner registration code
      description: |
        Mints a registration code a runner presents to the enroll endpoint to
        obtain a signed identity. The plaintext code is returned exactly once,
        in this response; it is never recoverable afterwards, including from
        the list endpoint below.

        The code itself is REUSABLE: a successful enroll does not consume it,
        so one code can enroll a whole fleet. Bound its blast radius with
        `expires_in_seconds` and by revoking it once the fleet is up.

        Requires the `management.registration_code.create` scope.

        The code's `allowed_namespaces` may never exceed the caller's own
        namespace grant: a request naming `*`, or naming any namespace other
        than the caller's, is rejected with 403 `namespace_forbidden`.
        Omitting `allowed_namespaces` stores the caller's own namespace
        explicitly — it is not left empty, because an empty set means "the
        default namespace" to the enrollment path.

        A principal that additionally holds
        `management.registration_code.create_global` is a platform operator
        and is exempt from the ceiling; it may mint `*`. The omission rule
        above does NOT extend to it: a global creator that omits
        `allowed_namespaces` is rejected with 400 `bad_request`, because it
        has no namespace-of-its-own reading to fall back to and defaulting
        the omission to `*` would be the implicit maximal grant this ceiling
        exists to eliminate.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationCodeCreateRequest"
      responses:
        "200":
          description: The newly minted code. The plaintext is returned only here.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RegistrationCodeCreateResponse"
        default:
          $ref: "#/components/responses/DefaultError"
    get:
      operationId: listRegistrationCodes
      summary: List registration codes
      description: |
        Lists minted registration codes. Neither the plaintext code nor its
        hash is ever included — only the id, scope, revocation status, and
        creation time.

        Requires the `management.registration_code.list` scope. By default
        the caller sees only registration codes owned by its own namespace.
        A principal that additionally holds
        `management.registration_code.list_global` is a platform operator
        and sees every registration code across every namespace, including
        codes minted before per-namespace ownership existed.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Registration code list.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/RegistrationCodeView"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/management/registration-codes/{id}:
    delete:
      operationId: revokeRegistrationCode
      summary: Revoke a registration code
      description: |
        Revokes a registration code so it can no longer be redeemed by the
        enroll endpoint. Already-issued runner identities are unaffected;
        revoking a code does not revoke identities minted from it. Revoking
        an unknown id is a 404, not a silent success.

        Requires the `management.registration_code.revoke` scope. By default
        the caller may only revoke a code owned by its own namespace;
        revoking an id owned by another namespace is a 404, indistinguishable
        from an unknown id. A principal that additionally holds
        `management.registration_code.revoke_global` is a platform operator
        and may revoke any registration code id regardless of which
        namespace(s) it grants, including codes minted before per-namespace
        ownership existed.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/RegistrationCodeId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Revocation acknowledged.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                          status:
                            type: string
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/management/registration-codes/{id}/audit:
    get:
      operationId: getRegistrationCodeAudit
      summary: Read the enroll audit trail for a registration code
      description: |
        Returns every enroll attempt (successful or failed) recorded against
        this registration code id, oldest first.

        Requires the `management.registration_code.audit` scope. By default
        the caller may only read the audit trail for a code owned by its own
        namespace; requesting the audit for an id owned by another namespace
        is a 404, indistinguishable from an unknown id. A principal that
        additionally holds `management.registration_code.audit_global` is a
        platform operator and may read the audit trail for any registration
        code id, including codes minted before per-namespace ownership
        existed.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/RegistrationCodeId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Enroll audit records.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/EnrollAuditView"
        default:
          $ref: "#/components/responses/DefaultError"

  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      description: |
        Kubernetes liveness probe. NOT enveloped (§7) — load balancers parse it
        directly. Not authenticated. Returns {"status":"ok"}.
      tags: [Probes]
      security: []
      responses:
        "200":
          description: Process is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthzResponse"

  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe
      description: |
        Kubernetes readiness probe. NOT enveloped (§7) — load balancers parse it
        directly. Not authenticated. Returns ready + leader status; non-leader
        replicas remain ready for the read-only management surface. The process
        and required production dependencies must be available; shutdown or a
        dependency check failure returns 503 with `ready=false`.
      tags: [Probes]
      security: []
      responses:
        "200":
          description: Process and required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
              example:
                ready: true
                leader: true
        "503":
          description: Process is shutting down or a required dependency is unavailable; `ready=false`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
              example:
                ready: false
                leader: false

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Server-issued bearer token bound to a (subject, namespace, scopes) principal.

  parameters:
    WorkflowId:
      name: id
      in: path
      required: true
      description: Server-assigned workflow id.
      schema:
        type: string
    ExecutionId:
      name: id
      in: path
      required: true
      description: Execution id.
      schema:
        type: string
    SignalName:
      name: name
      in: path
      required: true
      description: Signal name.
      schema:
        type: string
    SupplyName:
      name: name
      in: path
      required: true
      description: Supply name (single path segment, no namespace).
      schema:
        type: string
    ArtifactDigest:
      name: digest
      in: path
      required: true
      description: Content digest (the store validates the format).
      schema:
        type: string
    RunnerId:
      name: id
      in: path
      required: true
      description: Runner id.
      schema:
        type: string
    DeadLetterExecId:
      name: execID
      in: path
      required: true
      description: Execution id whose dead-letters to list/replay.
      schema:
        type: string
    RegistrationCodeId:
      name: id
      in: path
      required: true
      description: Registration code id.
      schema:
        type: string
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Optional client-supplied request id (charset [A-Za-z0-9._-], length
        1..128). When valid it is echoed verbatim in the response header for
        client-side retry correlation (spec §5.2). Never appears in the body.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,128}$'

  headers:
    XRequestId:
      description: Echoed X-Request-Id (only when the inbound value was valid).
      schema:
        type: string

  responses:
    DefaultError:
      description: Error response — a failure Envelope with success=false and no data field.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    Envelope:
      type: object
      description: |
        The user-face response envelope (spec §3). On success success=true,
        code="200" (string), and data carries the payload. On failure
        success=false, data is omitted (not null), and code carries a stable
        snake_case business identifier. trace_id is server-authoritative
        (W3C 32-hex).
      required: [success, code, message, trace_id]
      properties:
        success:
          type: boolean
          description: Strictly consistent with the HTTP status (2xx → true).
        code:
          type: string
          description: Machine-readable identifier. "200" on success; stable snake_case business code on failure.
        message:
          type: string
          description: Human-readable text. "" on success. Never carries credentials, node output, SQL, or stack traces (§3.5).
        data:
          description: Payload on success. Omitted on failure (writeFail never writes data).
        trace_id:
          type: string
          description: Server-authoritative W3C trace id (32 hex).
          pattern: '^[0-9a-f]{32}$'

    ErrorEnvelope:
      type: object
      description: The failure shape of the Envelope — data is absent on failure.
      additionalProperties: false
      required: [success, code, message, trace_id]
      properties:
        success:
          type: boolean
          description: Always false on this shape.
          example: false
        code:
          type: string
          description: Stable snake_case business error code.
          example: workflow_not_found
        message:
          type: string
          description: Human-readable text. May change; clients must branch on code.
          example: workflow not found
        trace_id:
          type: string
          description: Server-authoritative W3C trace id (32 hex).
          pattern: '^[0-9a-f]{32}$'

    RegisterWorkflowResponse:
      type: object
      description: Echoes the persisted workflow id and non-fatal compile warnings.
      required: [workflow_id]
      properties:
        workflow_id:
          type: string
        warnings:
          type: array
          items:
            type: string
          description: Non-fatal compile diagnostics (node/referenced-node names only — never output or parameter values, §3.5).

    ExecuteWorkflowRequest:
      type: object
      required: [workflow]
      properties:
        workflow:
          $ref: "#/components/schemas/WorkflowDef"
        entry:
          type: string
          description: Explicit entry node; empty uses the graph default start node.
        input:
          type: object
          additionalProperties: true
        params:
          type: object
          additionalProperties: true

    ExecuteRegisteredRequest:
      type: object
      description: Optional body for executing a registered workflow by id.
      properties:
        entry:
          type: string
        input:
          type: object
          additionalProperties: true
        params:
          type: object
          additionalProperties: true

    ExecuteWorkflowResponse:
      type: object
      required: [execution_id]
      properties:
        execution_id:
          type: string

    SignalRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        data:
          type: object
          additionalProperties: true

    AcceptedResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
          example: true

    RevokedResponse:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: boolean
          example: true

    RemovedResponse:
      type: object
      required: [removed]
      properties:
        removed:
          type: boolean
          example: true

    WaitTimeoutResponse:
      type: object
      required: [execution_id, status, timed_out]
      properties:
        execution_id:
          type: string
        status:
          $ref: "#/components/schemas/ExecutionStatus"
        timed_out:
          type: boolean
          example: true

    LeaderResponse:
      type: object
      required: [is_leader]
      properties:
        is_leader:
          type: boolean

    HealthzResponse:
      type: object
      description: Bare (non-enveloped) liveness body — load balancers parse it directly.
      required: [status]
      properties:
        status:
          type: string
          example: ok

    ReadyResponse:
      type: object
      description: Bare (non-enveloped) readiness body — load balancers parse it directly.
      required: [ready, leader]
      properties:
        ready:
          type: boolean
        leader:
          type: boolean

    ExecutionDetail:
      type: object
      description: Audit snapshot of an execution (engine.ExecutionDetail).
      required: [execution_id, status]
      properties:
        execution_id:
          type: string
        status:
          $ref: "#/components/schemas/ExecutionStatus"
        error:
          type: string
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/NodeDetail"

    NodeDetail:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          $ref: "#/components/schemas/NodeStatus"
        attempt:
          type: integer
        port:
          type: string
        error:
          type: string
        output:
          type: object
          additionalProperties: true

    ExecutionStatus:
      type: string
      enum: [pending, running, success, failed, canceling, canceled, timeout]

    NodeStatus:
      type: string
      enum: [pending, running, committing, success, failed, skipped, suspended, continued, canceled, waiting]

    RunnerListItem:
      type: object
      description: One entry in the runner directory listing.
      required: [runner_id, enrolled]
      properties:
        runner_id:
          type: string
        enrolled:
          type: boolean
          description: |
            Whether this runner's credential came from the enrollment endpoint
            rather than a static policy file.

    RunnerSnapshot:
      type: object
      description: Read-only registration and liveness view of one runner.
      required: [runner_id, capacity, in_flight, last_heartbeat]
      properties:
        runner_id:
          type: string
        capacity:
          type: integer
        in_flight:
          type: integer
        labels:
          type: object
          additionalProperties:
            type: string
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        namespaces:
          type: array
          items:
            type: string
        last_heartbeat:
          type: string
          format: date-time

    Capability:
      type: object
      required: [node_type]
      properties:
        node_type:
          type: string
        node_version:
          type: integer
        runtimes:
          type: array
          items:
            type: string
        features:
          type: array
          items:
            type: string
        resources:
          type: array
          items:
            type: string
        credentials:
          type: array
          items:
            type: string

    DeadLetterListResponse:
      type: object
      description: One cursor-paginated page of dead-lettered outbox entries.
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/OutboxEntry"
        next_cursor:
          type: string
          description: Omitted (or empty) when the page is the last.

    OutboxEntry:
      type: object
      description: A durable task-delivery intent (engine.OutboxEntry).
      required: [id, task]
      properties:
        id:
          type: string
        task:
          $ref: "#/components/schemas/Task"
        available_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        attempts:
          type: integer
        leased_from_score_ms:
          type: integer
          description: Internal lease bookkeeping; present only on leased entries.
        lease_deadline_ms:
          type: integer
          description: Internal lease bookkeeping; present only on leased entries.

    Task:
      type: object
      required: [execution_id, node_name, node_idx, type]
      properties:
        execution_id:
          type: string
        node_name:
          type: string
        node_idx:
          type: integer
        type:
          type: integer
          description: Task type discriminator (engine.TaskType; 0 = node exec, 1 = node resume).
        payload:
          type: object
          additionalProperties: true
          description: Present only for node-resume tasks.

    DeadLetterReplayRequest:
      type: object
      required: [entry_id, reason]
      properties:
        entry_id:
          type: string
        request_id:
          type: string
          description: Caller-supplied idempotency key; empty means the store mints one.
        reason:
          type: string
          description: Required, length-bounded operator rationale.

    DeadLetterReplayResponse:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          description: |
            Stable replay outcome (replayed, already_replayed, not_found,
            rejected_terminal, rejected_inactive, rejected_node_terminal,
            rejected_activation_mismatch, rejected_metadata_missing,
            invalid_request, unauthorized).
        audit_id:
          type: string
        execution_id:
          type: string
        node_id:
          type: string
        activation_id:
          type: string

    RegistrationCodeCreateRequest:
      type: object
      description: |
        The scope granted to runners that enroll with the minted code
        (store.RunnerPolicy), plus the code's own lifetime.
      properties:
        allowed_namespaces:
          type: array
          items:
            type: string
          description: |
            Namespaces runners enrolled with this code may join. It is capped
            by the caller's own namespace grant: naming one outside it is 403.

            Omitting it is NOT "no restriction". A caller holding only
            `registration_code.create` gets its own namespace filled in; a
            `registration_code.create_global` holder gets 400, because that
            principal has no namespace-of-its-own to fall back on and
            expanding an omission to `*` would be an implicit maximal grant.
        allowed_node_types:
          type: array
          items:
            type: string
          description: |
            Node types runners enrolled with this code may execute. `["*"]`
            means all of them.

            Omitting it is NOT "no restriction" either — it is the opposite.
            The list is persisted as sent, and `RunnerPolicy.Allows` reports
            false for every node type when it is empty, so a code minted
            without this field enrolls runners that can execute nothing.
        expires_in_seconds:
          type: integer
          format: int64
          minimum: 0
          description: |
            How long the minted code stays usable. Omit it to take the
            deployment default (`--registration-code-ttl`); pass 0 to ask for
            a code that never expires.

            The deployment value is a CEILING, not just a default: a request
            longer than it — including 0, which asks for no expiry at all —
            is rejected with 400 rather than silently clamped, so a caller
            never walks away believing it got a lifetime it did not get. The
            ceiling binds `registration_code.create_global` holders exactly
            as it binds tenants; widening it is a deployment action, not an
            authorization one.

    RegistrationCodeCreateResponse:
      type: object
      description: |
        The ONLY place the plaintext code ever appears in this API. It is not
        recoverable afterwards — not from the list endpoint, not from the
        database (only its hash is persisted).
      required: [id, code]
      properties:
        id:
          type: string
        code:
          type: string
          description: |
            Plaintext registration code. Returned only here, never again —
            but usable for as many enrollments as its lifetime allows.


    RegistrationCodeView:
      type: object
      description: |
        The list projection of a registration code. Deliberately carries
        neither the plaintext nor its hash: publishing sha256(code) would make
        every code offline-crackable by anyone who can read the list.
      required: [id, revoked, created_at, allowed_namespaces, allowed_node_types]
      properties:
        id:
          type: string
        allowed_namespaces:
          type: array
          items:
            type: string
          description: |
            Always present, `[]` rather than `null` when the code grants
            nothing. Required so a generated client can type it as a plain
            array; the server normalizes at the projection boundary.
        allowed_node_types:
          type: array
          items:
            type: string
          description: |
            Always present, `[]` rather than `null`. An empty list is not "no
            restriction": `RunnerPolicy.Allows` reports false for every node
            type, so a runner enrolled with such a code can execute nothing.
        revoked:
          type: boolean
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: |
            When the code stops being accepted by enroll. Absent means it
            never expires. There is deliberately no computed `expired`
            boolean beside it: a second representation of the same fact is a
            second thing that can drift from the server's own verdict.

    EnrollAuditView:
      type: object
      description: One recorded enroll attempt (successful or failed) against a registration code.
      required: [success, at]
      properties:
        success:
          type: boolean
        reason:
          type: string
          description: Present only on a failed attempt.
        runner_id:
          type: string
          description: Present only on a successful attempt.
        source_ip:
          type: string
        at:
          type: string
          format: date-time

    WorkflowDef:
      type: object
      description: |
        The top-level DSL workflow definition (types.WorkflowDef). On write
        requests, id and namespace are optional server-authoritative fields.
      required: [name]
      properties:
        id:
          type: string
          description: Server-assigned resource id. Optional on writes; for PUT it must match the path id when supplied.
        namespace:
          type: string
          description: Server-authoritative isolation scope; optional on writes, injected by the handler, and never trusted from the client body.
        name:
          type: string
        version:
          type: string
        description:
          type: string
        spec:
          type: string
        runner_selector:
          $ref: "#/components/schemas/RunnerSelector"
        context:
          $ref: "#/components/schemas/WorkflowContext"
        settings:
          $ref: "#/components/schemas/WorkflowSettings"
        options:
          $ref: "#/components/schemas/WorkflowOptions"
        credentials:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CredentialDef"
        params:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ParamDef"
        node_templates:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/NodeTemplate"
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/NodeDef"
        groups:
          type: array
          items:
            type: object
        connections:
          $ref: "#/components/schemas/Connections"
        outputs:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/WorkflowOutput"
        pin_data:
          type: object
          additionalProperties: true
        dependency_edges:
          type: array
          items:
            $ref: "#/components/schemas/DependencyEdge"

    NodeDef:
      type: object
      required: [name, type]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        kind:
          $ref: "#/components/schemas/NodeKind"
        version:
          type: integer
        template:
          type: string
        position:
          $ref: "#/components/schemas/Position"
        disabled:
          type: boolean
        on_error:
          type: string
        runner_selector:
          $ref: "#/components/schemas/RunnerSelector"
        notes:
          type: string
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/PortDecl"
        output_schema:
          type: object
          additionalProperties: true
        parameters:
          type: object
          additionalProperties: true
        ui:
          type: object
          additionalProperties: true
        retry:
          $ref: "#/components/schemas/RetrySettings"
        timeout:
          type: integer
          description: Go duration (nanoseconds) for one node attempt.

    NodeKind:
      type: string
      enum: [action, trigger, supply]

    Position:
      type: object
      properties:
        x:
          type: number
        y:
          type: number

    PortDecl:
      type: object
      properties:
        name:
          type: string
        required:
          type: boolean

    Connection:
      type: object
      properties:
        node:
          type: string
        input:
          type: string

    Connections:
      type: object
      description: |
        Map[source_node]map[output_port]edges. Data ports marshal as the array
        shorthand ([]Connection) for a byte-identical runtime hash; dependency
        ports marshal as the object form ({type, targets}). Both forms decode
        on read (types.PortConnections custom marshal/unmarshal).
      additionalProperties:
        type: object
        additionalProperties:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/Connection"
            - $ref: "#/components/schemas/PortConnections"

    PortConnections:
      type: object
      description: |
        The object form a dependency-port connection marshals to
        ({type, targets}). Data ports use the array shorthand ([]Connection)
        and never reach this schema. required + additionalProperties: false
        bind the object form tightly so a renamed field or a stray extra key
        is caught by the contract test instead of silently validating.
      additionalProperties: false
      required: [type, targets]
      properties:
        type:
          type: string
          enum: [data, dependency]
        targets:
          type: array
          items:
            $ref: "#/components/schemas/Connection"

    DependencyEdge:
      type: object
      required: [node, supply]
      properties:
        node:
          type: string
        supply:
          type: string

    WorkflowContext:
      type: object
      properties:
        vars:
          type: object
          additionalProperties: true
        config:
          type: object
          additionalProperties: true

    WorkflowSettings:
      type: object
      properties:
        concurrency:
          type: integer
        timezone:
          type: string
        on_error:
