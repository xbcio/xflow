  /v1/node-types:
    get:
      operationId: listNodeTypes
      summary: List node-type form schemas
      description: |
        Returns the NodeFormSchema v1 projection of every (type, version)
        registered in the SERVER PROCESS's node registry, sorted by type then
        version, plus the server's `param_validation_mode` so an editor's
        blocking semantics follow the backend (off | warn | enforce).

        Scope: without `namespace`, only types registered in the server
        process. With `namespace`, the response also carries the types live
        runners serving that namespace reported at registration, marked
        `source: runner` with their `runner_pools`. A runner type never
        shadows a server type: when the server registry has the type (any
        version), or the type is `xflow.*`, the runner entry is dropped. A
        runner type disappears once its last runner's session is no longer
        live. A type no live runner reports is absent, and an editor treats
        such a node as having no schema (parameters edited as JSON).

        The projection is recomputed per request. `ETag` is a strong
        validator over the `data` payload bytes (not the envelope, whose
        `trace_id` differs per request), so it changes when runner types
        appear or disappear; a matching `If-None-Match` answers 304 with no
        body. Authorization requires the read-only `workflow.read` scope — the
        operation name GET /v1/workflows carries, now also its required scope.
        The write scope `workflow` implies it, so pre-split tokens keep reading.
        With `namespace` the decision is made against that namespace, and a
        namespace the caller may not read fails with 403.
      tags: [NodeTypes]
      parameters:
        - $ref: "#/components/parameters/NodeTypesNamespace"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Every registered node type.
          headers:
            ETag:
              $ref: "#/components/headers/NodeTypesETag"
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/NodeTypesResponse"
        "304":
          description: If-None-Match matched the current ETag; no body.
          headers:
            ETag:
              $ref: "#/components/headers/NodeTypesETag"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/node-types/{type}:
    get:
      operationId: getNodeType
      summary: Read one node-type form schema
      description: |
        Returns the NodeFormSchema of one node type, with the same scope,
        `namespace` handling and authorization as GET /v1/node-types.
        `version` selects a version; omitted or 0 selects the latest, matching
        registry Lookup. An unknown type or version fails with 404
        (`node_type_not_found`); a malformed version with 400
        (`node_type_version_invalid`). ETag / If-None-Match behave as on
        GET /v1/node-types.
      tags: [NodeTypes]
      parameters:
        - name: type
          in: path
          required: true
          description: Node type, e.g. xflow.trigger.kafka.
          schema:
            type: string
        - name: version
          in: query
          required: false
          description: Registered node version; omitted or 0 means the latest.
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/NodeTypesNamespace"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: The node type's form schema.
          headers:
            ETag:
              $ref: "#/components/headers/NodeTypesETag"
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/NodeFormSchema"
        "304":
          description: If-None-Match matched the current ETag; no body.
          headers:
            ETag:
              $ref: "#/components/headers/NodeTypesETag"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/current-user:
    get:
      operationId: getCurrentUser
      summary: Read the caller's own verified identity
      description: |
        Returns who the presented credential is, as the SERVER resolved it: the
        subject the authenticator verified, the namespace that credential is
        bound to, and the scopes it was issued. Nothing is read from the request
        — there is no parameter that names a principal — so this endpoint cannot
        disclose another one, and it grants a caller nothing it could not learn
        by attempting the operations its own scopes name.

        This is the call a console makes before it can render anything: the
        alternative is probing routes and inferring capability from which ones
        refuse, which guesses wrong on routes that 404 and spends an audited
        round trip per guess on the ones that do not.

        Authorization requires authentication only: the route is behind the
        bearer authz wrapper but demands no scope. Any scope here could only
        subtract callers while refusing them the ability to read the credential
        they already hold — and a console that cannot read its own scopes has
        every capability cleared (fail-closed), hiding controls the credential
        actually grants.

        Served only when the server was configured with a principal
        authenticator (`--auth-tokens-file`, or an embedder's
        `Config.PrincipalAuth`). A server without one has no verified identity to
        report and answers 404 — it never invents one.
      tags: [CurrentUser]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: The caller's own verified identity.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CurrentUserResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/supplies/{name}:
    # The write verb (PUT) is sealed (spec appendix Z.5). The only write entry
    # point is in-process: sdk/xflow.Server.UpdateSupply / UpdateSupplyIfMatch,
    # which an embedder is expected to wrap with its own session, authorization,
    # and audit. This path serves GET only.
    get:
      operationId: getSupply
      summary: Read supply content
      description: |
        Returns the raw supply bytes (§3.4). Success is application/octet-stream
        (or the stored content type, or application/x-xflow-encrypted when the
        runner requests it). Failure is a JSON Envelope. ETag carries the
        content hash; X-Supply-Revision carries the revision.
      tags: [Supplies]
      parameters:
        - $ref: "#/components/parameters/SupplyName"
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
        - name: Accept
          in: header
          required: false
          description: Send application/x-xflow-encrypted to request encrypted content.
          schema:
            type: string
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Supply bytes.
          headers:
            ETag:
              schema:
                type: string
            X-Supply-Revision:
              schema:
                type: string
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/x-xflow-encrypted:
              schema:
                type: string
                format: binary
        "304":
          description: Not modified (If-None-Match matched).
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/artifacts/{digest}:
    get:
      operationId: getArtifact
      summary: Fetch artifact bytes
      description: |
        Returns the raw bytes for a digest the caller's namespace references
        (§3.4). Authorization is an identity-table lookup, so an unreferenced or
        cross-namespace digest answers 404 (not 403) to avoid leaking existence.
      tags: [Artifacts]
      parameters:
        - $ref: "#/components/parameters/ArtifactDigest"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Artifact bytes.
          headers:
            ETag:
              schema:
                type: string
            Content-Length:
              schema:
                type: string
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/DefaultError"
    head:
      operationId: statArtifact
      summary: Stat an artifact
      description: Returns headers only (size, ETag) without the body.
      tags: [Artifacts]
      parameters:
        - $ref: "#/components/parameters/ArtifactDigest"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Artifact stat.
          headers:
            ETag:
              schema:
                type: string
            Content-Length:
              schema:
                type: string
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/hooks/{namespace}/{workflow_id}/{entry_unit}:
    post:
      operationId: deliverWebhookEntry
      summary: Deliver an event to a server-hosted webhook entry
      description: |
        Admits one event into the execution of a workflow whose entry unit is a
        `xflow.trigger.webhook` node. A runner cannot host this route — it is an
        outbound execution node with no stable address and no inbound port — so
        the server hosts it and admits the request through the same entry-seed
        admission a runner would have used: the event is deduplicated on its
        event id, subject to the workflow's concurrency policy, and fans out to
        the same downstream nodes.

        **Method.** The HTTP method is a property of the entry, not of the
        route: the entry's webhook node declares `method` (POST, PUT, ...), and a
        request using any other verb is answered 405 with an `Allow` header. This
        path item documents the operation once, under `post`, because that is the
        verb webhook senders overwhelmingly use.

        **Authentication.** Not bearerAuth. The sender signs the request body
        with HMAC-SHA256 under the secret the entry names (its `secret_supply`
        parameter, resolved server-side from the supply store), and sends it in
        `X-XFlow-Signature` as `sha256=<hex>`. The comparison is constant-time.
        A definition whose server-hosted webhook entry names no secret cannot be
        registered at all, so this route is never an unauthenticated
        execution-creating endpoint.

        **Event identity.** The event id is taken from the header the entry
        declares (`event_id_header`); without one it is `sha256(body)` bucketed
        to the minute. A redelivery of the same event — one event id carrying
        the same body, which is what a sender retries when it never saw an
        answer — never creates a second execution: it is answered 200 with
        `duplicate: true` and the execution id that already exists. The
        comparison covers what the delivery IS (its id and its body), never what
        the server happened to observe while receiving it, so a retry cannot be
        mistaken for a different delivery. Reusing one event id for a different
        body is the one genuine conflict: 409 `conflict`, same execution id.

        **Limits.** The body is read under the entry's declared
        `max_body_bytes` (default 1 MiB) and answered 413 when exceeded.

        **Body.** The request body is the event payload, sent as-is. It is
        delivered to downstream nodes as `$input.trigger.raw` (and, decoded into
        `$input.trigger.data`, alongside the method, path and headers the server
        observed).
      tags: [Webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookNamespace"
        - $ref: "#/components/parameters/WebhookWorkflowId"
        - $ref: "#/components/parameters/WebhookEntryUnit"
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        description: The event payload. Its bytes are exactly what the signature covers.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          text/plain:
            schema:
              type: string
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: |
            The event was admitted. A redelivery of the same event id with the
            same body lands here too, with `duplicate: true` and the execution id
            the first delivery created — the answer a retrying sender needs, and
            the reason a reused event id is only a conflict when its content
            differs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEntryAdmission"
        "401":
          description: |
            Signature missing, malformed, or not the HMAC of the body under the
            entry's secret. Deliberately one answer for all three.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEntryError"
        "404":
          description: |
            No such workflow, no such entry unit, or the path's namespace does
            not own the workflow. The three are not distinguished.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEntryError"
        "405":
          description: The entry declares a different HTTP method; `Allow` names it.
          headers:
            Allow:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEntryError"
        "409":
          description: |
            The event id was already admitted carrying a different body, so this
            is a different delivery wearing an identity that is taken. Nothing
            was executed for it. The body still names the execution that exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEntryAdmission"
        "413":
          description: The body exceeded the entry's `max_body_bytes`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEntryError"
        "429":
          description: |
            The event was refused before anything was persisted; retry after
            `Retry-After`. Two refusals share the status. The workflow's
            concurrency policy answers with the WebhookEntryRefusal body, which
            repeats the floor in `retry_after_seconds`. The API rate limit
            answers `{"error": "rate_limited"}` once the namespace+workflow
            pair has spent its budget (`--api-rate` / `--api-burst`); only a
            correctly signed request is charged.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WebhookEntryRefusal"
                  - $ref: "#/components/schemas/WebhookEntryError"
        "503":
          description: |
            Nothing was admitted. `entry_unavailable`: the entry's signing
            secret could not be resolved, so no caller can be authenticated.
            `server_overloaded`: this replica is at its inflight bound
            (`--api-max-inflight`) — for this route the webhook class's own
            sub-limit (a quarter of the bound, at least 1) answers it first, so a
            webhook flood cannot consume the capacity authenticated execute work
            needs; retryable, with a `Retry-After` floor.
          headers:
            Retry-After:
              description: Present on `server_overloaded` only.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEntryError"
        default:
          description: Unexpected server failure. Generic body — no internal detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEntryError"

  /v1/management/leader:
    get:
      operationId: getLeader
      summary: Report leadership status
      description: Returns whether this replica currently holds leadership.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Leader status.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LeaderResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/management/runners:
    get:
      operationId: listRunners
      summary: List the runner fleet roster
      description: |
        Lists every runner id known to the directory plus every enrollment-issued
        identity currently absent from that directory. Directory members are
        server-classified as `online` or `offline`; issued-only members are
        `never_connected`. The server owns the liveness threshold: `online`
        means a fresh heartbeat is confirmed, while `offline` means no fresh
        heartbeat is confirmed (including when no directory snapshot is
        available).

        `state` is liveness, not task-placement readiness. For example, a
        runner with `desired_state: draining` can remain `online` while it
        stops accepting new work.

        `enrolled: true` means the credential came from the enrollment endpoint,
        rather than a static policy file. This tells an operator which runners a
        revoked registration code would affect.

        Returns 501 `runner_listing_unsupported` when the configured runner
        directory does not structurally support enumeration, rather than an
        empty array — an empty list and "this backend cannot answer" must
        stay visibly distinct.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Runner list.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/RunnerListItem"
        "500":
          $ref: "#/components/responses/DefaultError"
        "501":
          $ref: "#/components/responses/DefaultError"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/management/runners/{id}:
    get:
      operationId: getRunner
      summary: Inspect a single runner
      description: Returns the registration and liveness snapshot for one runner id. Use the fleet roster endpoint to list runners.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/RunnerId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Runner snapshot.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RunnerSnapshot"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/management/runners/{id}/revoke-identity:
    post:
      operationId: revokeRunnerIdentity
      summary: Revoke a runner's issued identity
      description: |
        Revokes one runner's issued identity, taking effect on its next
        authenticated call. Requires `management.runner.revoke_identity`.

        This is a PLATFORM-LEVEL operation with no per-namespace confinement.
        An issued identity's scope is a set of namespaces, not a single owner,
        so "may this tenant revoke this runner" has no single correct answer —
        intersection would let one tenant kill another's runner, containment
        would be no confinement at all. Until that is designed, grant this
        scope to platform operators only.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/RunnerId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Revocation acknowledged.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          runner_id:
                            type: string
                          status:
                            type: string
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/management/runners/{id}/drain:
    post:
      operationId: drainRunner
      summary: Stop new work admission for a runner
      description: |
        Atomically changes the runner's desired scheduling state to `draining`.
        Once accepted, the control plane refuses all newly queued task claims for
        that runner; a finalized pre-drain lease may still be replayed to settle
        existing work. This endpoint does not remotely terminate the process,
        cancel a handler, or force-revoke a lease.

        Requires both `management.runner.drain` and the platform-only
        `management.runner.control_global` scope. `X-Request-Id` is a required
        idempotency key: a retry with the same principal, action, runner, and
        body returns its original receipt, while a changed body returns 409. A
        200 means the server-side admission gate is active, not that the runner
        has exited or every handoff has settled.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/RunnerId"
        - $ref: "#/components/parameters/RunnerControlRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunnerControlRequest"
      responses:
        "200":
          description: Current drain control projection or the original idempotency receipt.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RunnerControlSnapshot"
        "400":
          $ref: "#/components/responses/DefaultError"
        "404":
          $ref: "#/components/responses/DefaultError"
        "409":
          $ref: "#/components/responses/DefaultError"
        "501":
          $ref: "#/components/responses/DefaultError"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/management/runners/{id}/resume:
    post:
      operationId: resumeRunner
      summary: Reopen new work admission for a runner
      description: |
        Atomically changes the runner's desired scheduling state to `active`,
        allowing future compatible queue claims again. Existing drain receipts
        are immutable: retrying an earlier drain request cannot reapply it after
        this newer resume transition.

        Requires both `management.runner.resume` and the platform-only
        `management.runner.control_global` scope. `X-Request-Id` is required
        and has the same idempotency behavior as drain. This endpoint does not
        start a process or assign trigger activations synchronously; normal
        reconciliation remains responsible for subsequent activation placement.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/RunnerId"
        - $ref: "#/components/parameters/RunnerControlRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunnerControlRequest"
      responses:
        "200":
          description: Current active control projection or the original idempotency receipt.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RunnerControlSnapshot"
        "400":
          $ref: "#/components/responses/DefaultError"
        "404":
          $ref: "#/components/responses/DefaultError"
        "409":
          $ref: "#/components/responses/DefaultError"
        "501":
          $ref: "#/components/responses/DefaultError"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/management/executions/{id}:
    get:
      operationId: inspectExecutionManagement
      summary: Inspect an execution (management view)
      description: |
        Ops view of a single execution. Returns byte-identical body to
        GET /v1/executions/{id} (spec §7.2); the two Ops stay distinct so an
        ops token and a business token may be granted separately.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Execution detail.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ExecutionDetail"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/management/dead-letters/{execID}:
    get:
      operationId: listDeadLetters
      summary: List dead-lettered outbox entries
      description: |
        Cursor-paginated list of dead-lettered durable outbox entries for one
        execution (spec §3.3 cursor exception — this is the machine-scan
        endpoint, not a page list). An empty cursor starts from the oldest
        entry.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/DeadLetterExecId"
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Dead-letter page.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DeadLetterListResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/management/dead-letters/{execID}/replay:
    post:
      operationId: replayDeadLetter
      summary: Replay a dead-lettered entry
      description: |
        Moves a dead-lettered entry atomically back to the ready set for
        redelivery. Activation-safe: rejects entries whose node is terminal or
        whose activation no longer matches. Idempotent under request_id.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/DeadLetterExecId"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeadLetterReplayRequest"
      responses:
        "200":
          description: Replay result.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DeadLetterReplayResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServerOverloaded"
        default:
          $ref: "#/components/responses/DefaultError"

  /v1/management/runner-pools:
    post:
      operationId: createRunnerPool
      summary: Create a runner pool
      description: Creates a tenant pool, or a platform pool when the caller also holds `management.runner_pool.write_global`.
      tags: [Management]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
