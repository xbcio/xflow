name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

# Every `run:` step goes through `bash -eo pipefail`, not the implicit
# default. GitHub Actions only adds `-o pipefail` when a step (or this block)
# names `bash` explicitly; without it the implicit shell is `bash -e {0}`, so
# a step's exit code comes from the LAST command in a pipeline. The
# integration job's `make test-integration-required 2>&1 | tee ...` therefore
# reported tee's status — a green job no matter how the tests ended.
#
# Set here rather than on that one step so the trap stays disarmed for the
# next pipeline somebody adds. Scope is small either way: that step is
# currently the only pipeline in .github/workflows/.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: ./...

      - name: Unit tests
        run: make test

      - name: Concurrency tests
        run: make test-concurrency

      - name: Stress tests
        run: make test-stress

      - name: Coverage
        run: make test-coverage

      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # Integration tests need Redis + MySQL + Kafka. They are gated behind the
  # `integration` build tag and `test/env/.env`; running them in CI catches
  # regressions in the sqlstore / distributed backend paths that unit tests
  # (miniredis / in-memory) cannot reach.
  integration:
    name: Integration
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: xflow
          MYSQL_DATABASE: xflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pxflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      kafka:
        image: docker.io/apache/kafka:3.7.2
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: controller,broker
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          CLUSTER_ID: eGZsb3ctdGVzdC1rcmFmdA
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Wait for services
        run: |
          ok=0
          for i in $(seq 1 30); do
            if redis-cli -h 127.0.0.1 -p 6379 ping && \
               mysqladmin -h 127.0.0.1 -P 3306 -uroot -pxflow ping; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "ERROR: services did not become ready within 60s"
            exit 1
          fi

      - name: Apply MySQL schema
        run: mysql -h 127.0.0.1 -P 3306 -uroot -pxflow xflow < db/xflow_schema.sql

      - name: Integration tests
        run: make test-integration-required 2>&1 | tee integration-test-output.json
        env:
          XFLOW_TEST_REDIS_ADDR: 127.0.0.1:6379
          XFLOW_TEST_MYSQL_DSN: "root:xflow@tcp(127.0.0.1:3306)/xflow?parseTime=true"
          XFLOW_TEST_KAFKA_BROKERS: 127.0.0.1:9092

      - name: Upload A0 fault matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a0-fault-matrix-report
          path: test/integration/testdata/a0_fault_matrix_report.json
          if-no-files-found: error

      - name: Upload integration test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-output
          path: integration-test-output.json
          if-no-files-found: error

  web:
    name: Web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: cd web && pnpm install --frozen-lockfile

      - name: Lint
        run: cd web && pnpm lint

      - name: Typecheck
        run: cd web && pnpm typecheck

      - name: Test
        run: cd web && pnpm test

      - name: Check boundaries
        run: cd web && pnpm check:boundaries

      - name: Check production fixtures
        run: cd web && pnpm check:production-fixtures

      - name: Build
        run: cd web && pnpm build

      - name: Install Playwright browsers
        run: cd web && pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: cd web && pnpm e2e

      - name: Run e2e tests on production preview
        run: cd web && pnpm e2e:preview

      # Coverage runs after build/e2e so fast-feedback gates (lint/type/test/
      # boundaries/fixtures/build/e2e) surface failures first. test:coverage
      # re-executes the test suite with --coverage; a threshold regression
      # fails the job.
      - name: Coverage
        run: cd web && pnpm test:coverage

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  openapi:
    name: OpenAPI Contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc

      - name: Validate OpenAPI contract
        run: make validate-openapi
