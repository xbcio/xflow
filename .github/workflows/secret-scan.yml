name: Secret scan

# This repository is public, so a credential reaches the world when the commit
# does. The scan therefore runs on pull requests, where it can still stop
# something, and on pushes to main as a backstop.
#
# It lives in its own file rather than as a job in ci.yml so that a red secret
# scan is legible on its own and does not queue behind the test matrix.

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks git walks the commit graph, so it needs the whole graph.
          # At the default depth of 1 it would scan one commit and report clean.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      # A scan that cannot match anything reports exactly what a clean tree
      # reports. This has already bitten this repository once: a sweep for
      # internal addresses came back clean against a tree that provably
      # contained them, because the pattern used \b under POSIX ERE and matched
      # zero bytes. So prove the scanner fires before trusting that it didn't.
      #
      # The first payload written here was AWS's documented example key, which
      # gitleaks ships an allowlist for -- the probe reported clean and would
      # have made this whole step a formality. The token below is assembled from
      # pieces at runtime for the same class of reason in reverse: written out
      # whole, it would be a real match sitting in a scanned file, and the job
      # would fail on its own probe.
      - name: Prove the scanner can fail
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          prefix=xo; prefix="${prefix}xb"
          printf 'slack_token = "%s-123456789012-1234567890123-AbCdEfGhIjKlMnOpQrStUvWx"\n' \
            "$prefix" > "$dir/leak.md"
          if gitleaks dir "$dir" --no-banner --config .gitleaks.toml; then
            echo "::error::gitleaks reported a planted credential as clean; the scans below prove nothing"
            exit 1
          fi
          echo "scanner fires on a planted credential"

      - name: Scan history
        run: gitleaks git . --no-banner --config .gitleaks.toml --redact

      # History covers what is committed. This covers the working tree, which
      # on a pull_request checkout is the merge result -- the state that is
      # about to become history.
      - name: Scan working tree
        run: gitleaks dir . --no-banner --config .gitleaks.toml --redact
