name: Perf Sample

# D1: CI perf sampling for trend monitoring and downloadable artifacts. This
# is NOT a hard gate — results vary across GitHub-hosted runners and must not
# be read as capacity commitments. Capacity baselines require a controlled host
# with multiple samples and a separate report (see
# docs/references/capacity-report-template.md).
#
# Runs nightly and on manual dispatch. Avoids running on every PR to keep it
# a sampling/trend signal rather than a pass/fail gate.

on:
  schedule:
    # 07:00 UTC daily.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf-sample:
    name: Perf Sample
    runs-on: ubuntu-latest
    # `make perf-sample` runs the perf-bench suite (whose own Go watchdog is
    # 30m) plus the E2E load test against the service stack.
    timeout-minutes: 60
    # Sampling only — never block merges on runner-noisy bench numbers.
    continue-on-error: true
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      kafka:
        image: docker.io/apache/kafka:3.7.2
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: controller,broker
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          CLUSTER_ID: eGZsb3ctdGVzdC1rcmFmdA
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            redis-cli -h 127.0.0.1 -p 6379 ping && break
            sleep 2
          done

      - name: Run perf sample
        run: make perf-sample
        env:
          XFLOW_TEST_REDIS_ADDR: 127.0.0.1:6379
          XFLOW_TEST_KAFKA_BROKERS: 127.0.0.1:9092
          REDIS_ADDR: redis://127.0.0.1:6379/0
          KAFKA_BROKERS: 127.0.0.1:9092

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-sample-results
          path: perf-sample-results.txt
          retention-days: 90
