# gitleaks configuration for xflow.
#
# This repository is public. A credential committed here is disclosed the
# moment it is pushed, and deleting it later does not retract it -- the object
# stays reachable in the published history. So the job this config supports
# runs on pull requests, before that happens, rather than as an audit
# afterwards.
#
# Baseline, established by scanning all 1090 commits of history with the stock
# ruleset: five hits, all four distinct values below. No real credential has
# ever been committed. That is the number a future run should be compared
# against, and it is why the allowlist can afford to be this narrow. Three
# later test fixtures (two generic-api-key, one AWS-key-shaped editor-test
# literal) are pinned the same way below.

[extend]
useDefault = true

# Directories that hold downloaded or generated bytes rather than authored
# ones. gitleaks dir does NOT honour .gitignore, so without this a developer
# running it locally gets 56 hits from the Go module cache and a bundled
# vendor build -- none of which are in this repository or reachable from it.
# CI checkouts do not contain these paths at all; this is for the local run.
#
# Excluding a path is normally the wrong move, because it takes future files
# out of scope too. It is safe here and only here: nothing under these
# directories is tracked, so nothing under them can be published.
[allowlist]
paths = [
  '''^\.tmp/''',
  '''^web/apps/[^/]+/dist/''',
  '''^web/apps/[^/]+/node_modules/''',
  '''^\.superpowers/''',
]

# The rule allowlist below matches SECRET VALUES, not paths.
#
# Allowlisting a path would mean a real credential added to any of these files
# later goes unreported, and most of these are test files that grow. Pinning
# the exact value keeps the file in scope: a new secret next to an exempted one
# still fails the build.
[[rules]]
id = "generic-api-key"

  [rules.allowlist]
  regexTarget = "secret"
  regexes = [
    # A fixture credential in the test that proves the expression engine's
    # error text names the TYPE of a rejected argument and never its value.
    # Removing it would remove the thing the test asserts is not printed.
    '''^ulp-abcdef0123456789$''',

    # The bearer token the embedded test server's authenticator accepts.
    # 32 hex chars because BearerPrincipalAuth documents a 128-bit entropy
    # floor and the test asserts against that floor; it authenticates an
    # in-process server that exists for the duration of one test binary.
    '''^9f2c41ba7de05c83a6114e7d29b8f350$''',

    # Not secrets at all -- the generic-api-key heuristic firing on ordinary
    # source text. Kept as exact strings rather than widened into a pattern,
    # so the next false positive is a decision someone makes on purpose.
    '''^evalDetailKeyCap\+1$''',
    '''^submit/invoke$''',

    # The bearer token the runner control HTTP-metrics test hands to an
    # in-process httptest server. Sequential hex, minted for one test binary.
    '''^0123456789abcdef0123456789abcdef$''',

    # The stub supply_key an httptest responder returns to the runner verify
    # command (base64 of "supply-key"), asserting only that an issued key is
    # accepted. It moved from cmd/runner to sdk/runner; pinning the value
    # covers both the history hit and the current file.
    '''^c3VwcGx5LWtleQ==$''',
  ]

# The editor's node-form heuristic test asserts that looksLikeSecret() returns
# true for a credential-shaped literal, so its fixture must keep an AWS access
# key's shape (AKIA + 16 base32 chars, here the sequential alphabet). Pinned by
# value only: any other AWS-shaped string anywhere stays in scope.
[[rules]]
id = "aws-access-token"

  [rules.allowlist]
  regexTarget = "secret"
  regexes = [
    '''^AKIAABCDEFGHIJKLMNOP$''',
  ]
