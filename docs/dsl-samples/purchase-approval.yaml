# ============================================================
# 采购审批工作流 (v2.0 - 增强版)
# 支持三级金额分级路由，每级独立路径，互不干扰
# ============================================================
#
# 审批规则：
#   level_1: 金额 < 1,000    → 直属主管
#   level_2: 金额 < 10,000   → 直属主管 → 部门负责人
#   level_3: 金额 >= 10,000  → 直属主管 → 部门负责人 → VP + 财务并行
#
# v2.0 增强：
#   1. 错误处理链路：除错误处理路径自身外，HTTP/DB/function 节点都接了 error 出口。
#      该路径上的节点（handle_error、update_error、notify_error、log_result）故意
#      不接——它们就在 handle_error 的下游，再回跳会成环。HTTP/DB 节点要同时选
#      on_error: error_output 才会走 error 端口；function 节点的处理器错误直接发到
#      error 端口，无需 on_error。
#   2. 审批操作扩展：转签、加签、超时自动驳回
#      这几个动作 xflow.approval 节点已实现，但它们是**信号 action**，
#      不是节点参数：调用方发信号时在 payload 里带
#        action: approve | reject | return | delegate | add_signer | force
#      （delegate/add_signer 另带 assignee，add_signer 可带 position: before|after；
#       force 需节点配置 force_approvers，且只在该名单内的人发得起）。
#   3. 完整审计追踪：每级审批人、操作、时间、意见
#      节点发布 decisions：每条含 approver/action/comment/at（转签与加签另带
#      assignee/position），全量在册，不随模式变化。顶层 approved 是判定结果；
#      reject/return 在任何模式下都带 approver/comment，"any" 模式的 approve
#      判定同样带；"all"/"sequential" 下谁批的要看 decisions。
#
# 审批节点只写 xflow.approval 真实读取的参数：approvers / mode / timeout /
# timeout_action。timeout_action: reject 表示超时从 rejected 出口离开，与人工
# 驳回同路。returned（退回）出口本样例未接线：退回后由申请人在门户修改并重新
# 提交，不产生新的执行。
#
# 运行前提（跑通本样例所需的宿主配合）：
#   - 宿主注册 collectApprovalTrail 与 buildErrorContext 两个 Go function
#     （xflow.function 按 function_name 查找，节点本身不带实现）。
#   - db_conn / internal_api 凭证与 org_service 地址是占位值，需替换。
#   - xflow.notification 只记录通知请求（输出 data.sent=true），不真正投递。

spec: "1.0"
name: "purchase-approval"
version: "2.0.0"
description: "采购审批工作流 - 三级独立路径（增强版）"

context:
  vars:
    approval_levels:
      level_1_max: 1000
      level_2_max: 10000
    approval_timeout: 72h

  config:
    org_service: "https://org.internal.example.com"

settings:
  # settings 层没有 timeout 字段（写了不会被读取）；时限是节点级 timeout，
  # 下面的审批节点用的就是 $vars.approval_timeout。
  timezone: "Asia/Shanghai"

credentials:
  internal_api:
    name: "internal_service_auth"
    type: apiKey

  db_conn:
    name: "approval_db"
    type: postgres

params:
  request_id:
    type: string
    required: true
    display_name: "申请单号"

  applicant_id:
    type: string
    required: true
    display_name: "申请人ID"

  title:
    type: string
    required: true
    display_name: "采购标题"

  amount:
    type: number
    required: true
    display_name: "采购金额"
    validation:
      min: 0.01

  items:
    type: array
    required: true
    display_name: "采购明细"

# ──────────────────────────────────────
# 节点定义
# ──────────────────────────────────────
nodes:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 公共入口
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - name: start
    type: xflow.start

  - name: create_record
    type: xflow.database
    # 错误出口必须在节点上选择策略，否则下面 connections 里的 error 连线永远不会走
    on_error: error_output
    parameters:
      operation: insert
      table: approval_records
      credential: db_conn
      data:
        request_id: "${{ $params.request_id }}"
        applicant_id: "${{ $params.applicant_id }}"
        title: "${{ $params.title }}"
        amount: "${{ $params.amount }}"
        status: "pending"
        created_at: "${{ now() }}"

  - name: fetch_approvers
    type: xflow.http
    on_error: error_output
    # 重试是节点级参数（NodeDef.retry），不是 xflow.http 的 options.retry——
    # 后者节点不读。
    retry:
      enabled: true
      max_attempts: 3
      strategy: exponential
    parameters:
      method: GET
      url: "{{ $config.org_service }}/api/v1/approval-chain"
      authentication: internal_api
      query:
        user_id: "${{ $params.applicant_id }}"
        amount: "${{ $params.amount }}"
      options:
        # 时长要带单位：这里按 Go 的 duration 解析，"10000" 解析不出来。
        timeout: "10s"

  - name: route_by_amount
    type: xflow.switch
    parameters:
      mode: rules
      outputs: [level_1, level_2, level_3]
      rules:
        - condition: "$params.amount < $vars.approval_levels.level_1_max"
          output: level_1
        - condition: "$params.amount < $vars.approval_levels.level_2_max"
          output: level_2
      default_output: level_3

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Level 1：直属主管审批
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - name: l1_manager
    type: xflow.approval
    parameters:
      approvers: ["${{ $nodes['fetch_approvers'].manager_id }}"]
      mode: "any"
      timeout: "${{ $vars.approval_timeout }}"
      timeout_action: reject

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Level 2：直属主管 → 部门负责人
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - name: l2_manager
    type: xflow.approval
    parameters:
      approvers: ["${{ $nodes['fetch_approvers'].manager_id }}"]
      mode: "any"
      timeout: "${{ $vars.approval_timeout }}"
      timeout_action: reject

  - name: l2_director
    type: xflow.approval
    parameters:
      approvers: ["${{ $nodes['fetch_approvers'].director_id }}"]
      mode: "any"
      timeout: "${{ $vars.approval_timeout }}"
      timeout_action: reject

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Level 3：直属主管 → 部门负责人 → VP + 财务并行
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - name: l3_manager
    type: xflow.approval
    parameters:
      approvers: ["${{ $nodes['fetch_approvers'].manager_id }}"]
      mode: "any"
      timeout: "${{ $vars.approval_timeout }}"
      timeout_action: reject

  - name: l3_director
    type: xflow.approval
    parameters:
      approvers: ["${{ $nodes['fetch_approvers'].director_id }}"]
      mode: "any"
      timeout: "${{ $vars.approval_timeout }}"
      timeout_action: reject

  - name: l3_vp
    type: xflow.approval
    parameters:
      approvers: ["${{ $nodes['fetch_approvers'].vp_id }}"]
      mode: "any"
      timeout: "${{ $vars.approval_timeout }}"
      timeout_action: reject

  - name: l3_finance
    type: xflow.approval
    parameters:
      approvers: ["${{ $nodes['fetch_approvers'].finance_id }}"]
      mode: "any"
      timeout: "${{ $vars.approval_timeout }}"
      timeout_action: reject

  - name: l3_parallel_merge
    type: xflow.merge
    # 两条入边各自声明端口，merge 的输出即按端口名建键：
    # 下游读 $nodes['l3_parallel_merge'].vp / .finance。
    # wait_all 等两条 approved 都到达；若某条走了 rejected，它进这个 merge 的
    # 入边按跳过结算，merge 仍会执行，由 l3_final_check 判定是否两边都通过。
    inputs:
      - name: vp
      - name: finance
    parameters:
      mode: wait_all

  - name: l3_final_check
    type: xflow.switch
    parameters:
      mode: rules
      outputs: [approved, rejected]
      rules:
        # 缺一边时该端口的值为 nil；先落到 {} 再取字段，否则取 nil 的成员会运行期报错
        - condition: "($nodes['l3_parallel_merge'].vp ?? {}).approved == true && ($nodes['l3_parallel_merge'].finance ?? {}).approved == true"
          output: approved
      default_output: rejected

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 审批结果处理（三条路径在此汇合）
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  # 注：route_by_amount 保证同一执行中只有一条路径激活，因此这里的多条入边
  # 互斥（l1/l2 的通过路径与 l3 的最终判定只会有一条到达）。只有 main 一个
  # 端口：显式声明它是为了说明"谁到都行"，而不是漏写端口名。
  - name: merge_approved
    type: xflow.merge
    inputs:
      - name: main
    parameters:
      mode: wait_any

  # 收集通过路径的审计链（Go 函数处理多级数据聚合）
  - name: collect_approved_trail
    type: xflow.function
    parameters:
      function_name: collectApprovalTrail
      params:
        request_id: "${{ $params.request_id }}"
        amount: "${{ $params.amount }}"
        final_status: "approved"
        approval_levels: "${{ $vars.approval_levels }}"
        l1_manager: "${{ $nodes['l1_manager'] ?? nil }}"
        l2_manager: "${{ $nodes['l2_manager'] ?? nil }}"
        l2_director: "${{ $nodes['l2_director'] ?? nil }}"
        l3_manager: "${{ $nodes['l3_manager'] ?? nil }}"
        l3_director: "${{ $nodes['l3_director'] ?? nil }}"
        l3_vp: "${{ $nodes['l3_vp'] ?? nil }}"
        l3_finance: "${{ $nodes['l3_finance'] ?? nil }}"
      # 返回值结构：
      # {
      #   "chain": [
      #     { "role": "manager", "user_id": "...", "action": "approved",
      #       "comment": "...", "acted_at": "..." },
      #     ...
      #   ]
      # }

  - name: update_approved
    type: xflow.database
    on_error: error_output
    parameters:
      operation: update
      table: approval_records
      credential: db_conn
      where:
        request_id: "${{ $params.request_id }}"
      data:
        status: "approved"
        approved_at: "${{ now() }}"
        approval_chain: "${{ toJSON($nodes['collect_approved_trail'].chain) }}"

  - name: notify_approved
    type: xflow.notification
    parameters:
      channel: email
      to: "${{ $params.applicant_id }}"
      # 通知节点读的是 message（正文），没有 template 参数——写了不会生效。
      subject: "采购申请已通过：{{ $params.title }}"
      message: "您的采购申请《{{ $params.title }}》已通过审批。"
      data:
        approval_chain: "${{ $nodes['collect_approved_trail'].chain }}"

  # 驳回在此汇合：各审批节点的 rejected 出口（含 timeout_action: reject 的超时
  # 自动驳回），外加并行档位里 l3_final_check 的 rejected。顺序档位互斥，但
  # 并行两条各自驳回时会先后到达两条入边——wait_any 在第一条到达时调度执行，
  # 后到的入边不再触发第二次。
  - name: merge_rejected
    type: xflow.merge
    inputs:
      - name: main
    parameters:
      mode: wait_any

  # 收集驳回路径的审计链
  - name: collect_rejected_trail
    type: xflow.function
    parameters:
      function_name: collectApprovalTrail
      params:
        request_id: "${{ $params.request_id }}"
        amount: "${{ $params.amount }}"
        final_status: "rejected"
        approval_levels: "${{ $vars.approval_levels }}"
        l1_manager: "${{ $nodes['l1_manager'] ?? nil }}"
        l2_manager: "${{ $nodes['l2_manager'] ?? nil }}"
        l2_director: "${{ $nodes['l2_director'] ?? nil }}"
        l3_manager: "${{ $nodes['l3_manager'] ?? nil }}"
        l3_director: "${{ $nodes['l3_director'] ?? nil }}"
        l3_vp: "${{ $nodes['l3_vp'] ?? nil }}"
        l3_finance: "${{ $nodes['l3_finance'] ?? nil }}"
      # 返回值额外包含 reject_reason：
      # {
      #   "chain": [...],
      #   "reject_reason": "驳回人的意见"
      # }

  - name: update_rejected
    type: xflow.database
    on_error: error_output
    parameters:
      operation: update
      table: approval_records
      credential: db_conn
      where:
        request_id: "${{ $params.request_id }}"
      data:
        status: "rejected"
        rejected_at: "${{ now() }}"
        approval_chain: "${{ toJSON($nodes['collect_rejected_trail'].chain) }}"
        reject_reason: "${{ $nodes['collect_rejected_trail'].reject_reason }}"

  - name: notify_rejected
    type: xflow.notification
    parameters:
      channel: email
      to: "${{ $params.applicant_id }}"
      # 通知节点读的是 message（正文），没有 template 参数——写了不会生效。
      subject: "采购申请已驳回：{{ $params.title }}"
      message: "您的采购申请《{{ $params.title }}》已被驳回，原因：{{ $nodes['collect_rejected_trail'].reject_reason ?? '见审批意见' }}"
      data:
        approval_chain: "${{ $nodes['collect_rejected_trail'].chain }}"
        reject_reason: "${{ $nodes['collect_rejected_trail'].reject_reason }}"

  - name: final_merge
    type: xflow.merge
    inputs:
      - name: main
    parameters:
      mode: wait_any

  - name: log_result
    type: xflow.database
    parameters:
      operation: insert
      table: approval_logs
      credential: db_conn
      data:
        request_id: "${{ $params.request_id }}"
        workflow_name: "${{ $workflow.name }}"
        execution_id: "${{ $execution.id }}"
        completed_at: "${{ now() }}"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 错误处理
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - name: handle_error
    type: xflow.function
    # 四个 error 出口在这里汇合：全部入边结算后节点执行一次，先到的错误即输入。
    # 声明 main 说明这是唯一端口，而不是漏写端口名。
    inputs:
      - name: main
    parameters:
      function_name: buildErrorContext
      params:
        request_id: "${{ $params.request_id }}"
        workflow_name: "${{ $workflow.name }}"
        execution_id: "${{ $execution.id }}"

  - name: update_error
    type: xflow.database
    parameters:
      operation: update
      table: approval_records
      credential: db_conn
      where:
        request_id: "${{ $params.request_id }}"
      data:
        status: "error"
        error_at: "${{ now() }}"
        error_message: "${{ $nodes['handle_error'].message }}"

  - name: notify_error
    type: xflow.notification
    parameters:
      channel: email
      to: "${{ $params.applicant_id }}"
      # 通知节点读的是 message（正文），没有 template 参数——写了不会生效。
      subject: "采购申请处理异常：{{ $params.title }}"
      message: "您的采购申请《{{ $params.title }}》处理时发生异常，请联系管理员。"
      data:
        error: "${{ $nodes['handle_error'].message }}"

# ──────────────────────────────────────
# 连接定义
# ──────────────────────────────────────
connections:
  # ── 公共入口 ──
  start:
    main:
      - node: create_record

  create_record:
    main:
      - node: fetch_approvers
    error:
      - node: handle_error

  fetch_approvers:
    main:
      - node: route_by_amount
    error:
      - node: handle_error

  # ── 金额路由 → 三条独立路径 ──
  route_by_amount:
    level_1:
      - node: l1_manager
    level_2:
      - node: l2_manager
    level_3:
      - node: l3_manager

  # ── Level 1 路径 ──
  l1_manager:
    approved:
      - node: merge_approved
    rejected:
      - node: merge_rejected

  # ── Level 2 路径 ──
  l2_manager:
    approved:
      - node: l2_director
    rejected:
      - node: merge_rejected

  l2_director:
    approved:
      - node: merge_approved
    rejected:
      - node: merge_rejected

  # ── Level 3 路径 ──
  l3_manager:
    approved:
      - node: l3_director
    rejected:
      - node: merge_rejected

  l3_director:
    approved:
      - node: l3_vp
      - node: l3_finance
    rejected:
      - node: merge_rejected

  l3_vp:
    approved:
      - node: l3_parallel_merge
        input: vp
    rejected:
      - node: merge_rejected

  l3_finance:
    approved:
      - node: l3_parallel_merge
        input: finance
    rejected:
      - node: merge_rejected

  l3_parallel_merge:
    main:
      - node: l3_final_check

  l3_final_check:
    approved:
      - node: merge_approved
    rejected:
      - node: merge_rejected

  # ── 通过流程（含审计链收集）──
  merge_approved:
    main:
      - node: collect_approved_trail

  collect_approved_trail:
    main:
      - node: update_approved
      - node: notify_approved
    error:
      - node: handle_error

  update_approved:
    main:
      - node: final_merge
    error:
      - node: handle_error

  notify_approved:
    main:
      - node: final_merge

  # ── 驳回流程（含审计链收集）──
  merge_rejected:
    main:
      - node: collect_rejected_trail

  collect_rejected_trail:
    main:
      - node: update_rejected
      - node: notify_rejected
    error:
      - node: handle_error

  update_rejected:
    main:
      - node: final_merge
    error:
      - node: handle_error

  notify_rejected:
    main:
      - node: final_merge

  # ── 错误处理 ──
  handle_error:
    main:
      - node: update_error
      - node: notify_error

  update_error:
    main:
      - node: final_merge

  notify_error:
    main:
      - node: final_merge

  # ── 日志 ──
  final_merge:
    main:
      - node: log_result

# ──────────────────────────────────────
# 输出定义
# ──────────────────────────────────────
# 注：outputs 目前是声明性定义，运行时消费者尚未接线。status 想读的是
# log_result 的输出，而数据库 insert 的输出只有 last_insert_id/rows_affected，
# 真正的取值会落到 ?? 的兜底 'completed'；等 outputs 接线时应改读携带决策
# 结果的来源。
outputs:
  status:
    value: "${{ $nodes['log_result'].status ?? 'completed' }}"
    display_name: "审批结果"

  approval_chain:
    value: "${{ $nodes['collect_approved_trail'].chain ?? $nodes['collect_rejected_trail'].chain ?? [] }}"
    display_name: "审批链"
