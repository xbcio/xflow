# ============================================================
# 采购审批工作流 (v2.0 - 增强版)
# 支持三级金额分级路由，每级独立路径，互不干扰
# ============================================================
#
# 审批规则：
#   level_1: 金额 < 1,000    → 直属主管
#   level_2: 金额 < 10,000   → 直属主管 → 部门负责人
#   level_3: 金额 >= 10,000  → 直属主管 → 部门负责人 → VP + 财务并行
#
# v2.0 增强：
#   1. 全链路错误处理（HTTP/DB 节点均配置 error 出口）
#   2. 审批操作扩展：转签、加签、超时自动驳回
#      这几个动作 xflow.approval 节点已实现，但它们是**信号 action**，
#      不是节点参数：调用方发信号时在 payload 里带
#        action: approve | reject | return | delegate | add_signer | force
#      （delegate/add_signer 另带 assignee，add_signer 可带 position: before|after；
#       force 需节点配置 force_approvers，且只在该名单内的人发得起）。
#   3. 完整审计追踪：每级审批人、操作、时间、意见
#      节点发布 decisions：每条含 approver/action/comment/at（转签与加签另带
#      assignee/position），全量在册，不随模式变化。"any" 模式判定的那一次还会
#      把 approver/comment 一并放到节点输出顶层；"all"/"sequential" 模式只放
#      approved，谁批的要看 decisions。
#   4. 节点模板 node_templates：减少审批节点重复定义（DSL 扩展提案）
#
# 仍属提案、后端尚未实现的部分（本文件保留它们只为展示意图）：
#   node_templates 展开、节点级 title/detail 展示字段、标准审批模板里的
#   actions/reminder（UI 操作清单与提醒策略），以及 collectApprovalTrail
#   这类自定义 function 的具体实现。
#
# ⚠ 因此本文件当前**不可执行**：下面 12 个审批/校验节点只写了 template 没有
#   type，参数校验与注册能通过（编译器接受空 type），运行时却会以
#   "no handler registered for node type" 失败。等 node_templates 展开实现，
#   或把这 12 个节点的 type 与参数展开写全，它才能作为完整样例跑起来。

spec: "1.0"
name: "purchase-approval"
version: "2.0.0"
description: "采购审批工作流 - 三级独立路径（增强版）"

context:
  vars:
    approval_levels:
      level_1_max: 1000
      level_2_max: 10000
    approval_timeout: 72h
    reminder_interval: 24h
    reminder_max_count: 2

  config:
    org_service: "https://org.internal.example.com"

settings:
  timeout: 168h
  timezone: "Asia/Shanghai"

credentials:
  internal_api:
    name: "internal_service_auth"
    type: apiKey

  db_conn:
    name: "approval_db"
    type: postgres

params:
  request_id:
    type: string
    required: true
    display_name: "申请单号"

  applicant_id:
    type: string
    required: true
    display_name: "申请人ID"

  title:
    type: string
    required: true
    display_name: "采购标题"

  amount:
    type: number
    required: true
    display_name: "采购金额"
    validation:
      min: 0.01

  items:
    type: array
    required: true
    display_name: "采购明细"

# ──────────────────────────────────────
# 节点模板（DSL 扩展提案）
# 节点通过 template 字段引用模板，自身 parameters 与模板深度合并（节点级优先）。
# 合并规则：
#   - 对象（map）：递归深度合并，节点级 key 覆盖模板同名 key
#   - 数组（list）：整体替换，不做 append 或元素级合并
#   - 标量（string/number/bool）：节点级覆盖模板值
# 模板展开在编译阶段第一步完成，后续步骤处理展开后的完整节点定义。
# ──────────────────────────────────────
node_templates:
  # 标准审批节点：统一 approvers、mode、timeout、timeout_action
  #
  # 只有 approvers / mode / timeout / timeout_action / force_approvers 是
  # xflow.approval 真实读取的参数。下面的 title / detail / actions / reminder
  # 是编辑器与节点模板提案要用的展示与交互声明，节点本身不读，写在这里只为
  # 说明各自的意图；真正生效的审批配置是 approvers + mode + timeout_action。
  standard_approval:
    type: xflow.approval
    parameters:
      # 提案：展示字段（节点不读）
      detail:
        applicant: "${{ $params.applicant_id }}"
        amount: "${{ $params.amount }}"
        items: "$params.items"
      # 提案：UI 操作清单。key 是门户上的操作键（结果语义），发信号时用的是
      # 上面第 2 条那组真实 action 取值（approve/reject/…），两者不是同一个
      # 命名空间；节点也不接受用这份清单开关动作。
      actions:
        - key: approved
          label: "同意"
        - key: rejected
          label: "驳回"
          require_comment: true
        - key: delegate
          label: "转签"
          require_assignee: true
        - key: add_signer
          label: "加签"
          require_assignee: true
          position: before          # before=前加签 after=后加签
      # 真实参数
      timeout: "${{ $vars.approval_timeout }}"
      timeout_action: reject        # 超时自动驳回（另一个取值是 route，走 timeout 出口）
      # 提案：提醒策略，节点不读
      reminder:
        interval: "${{ $vars.reminder_interval }}"
        max_count: "${{ $vars.reminder_max_count }}"

  # 审批结果判断：统一 outputs，子节点只需覆盖首条 condition
  approval_check:
    type: xflow.switch
    parameters:
      mode: rules                   # xflow.switch 必填参数
      outputs: [approved, rejected]
      rules: []                    # 子节点需覆盖
      default_output: rejected     # 默认驳回

# ──────────────────────────────────────
# 节点定义
# ──────────────────────────────────────
nodes:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 公共入口
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - name: start
    type: xflow.start

  - name: create_record
    type: xflow.database
    # 错误出口必须在节点上选择策略，否则下面 connections 里的 error 连线永远不会走
    on_error: error_output
    parameters:
      operation: insert
      table: approval_records
      credential: db_conn
      data:
        request_id: "${{ $params.request_id }}"
        applicant_id: "${{ $params.applicant_id }}"
        title: "${{ $params.title }}"
        amount: "${{ $params.amount }}"
        status: "pending"
        created_at: "${{ now() }}"

  - name: fetch_approvers
    type: xflow.http
    on_error: error_output
    # 重试是节点级参数（NodeDef.retry），不是 xflow.http 的 options.retry——
    # 后者节点不读。
    retry:
      enabled: true
      max_attempts: 3
      strategy: exponential
    parameters:
      method: GET
      url: "{{ $config.org_service }}/api/v1/approval-chain"
      authentication: internal_api
      query:
        user_id: "${{ $params.applicant_id }}"
        amount: "${{ $params.amount }}"
      options:
        # 时长要带单位：这里按 Go 的 duration 解析，"10000" 解析不出来。
        timeout: "10s"

  - name: route_by_amount
    type: xflow.switch
    parameters:
      mode: rules
      outputs: [level_1, level_2, level_3]
      rules:
        - condition: "$params.amount < $vars.approval_levels.level_1_max"
          output: level_1
        - condition: "$params.amount < $vars.approval_levels.level_2_max"
          output: level_2
      default_output: level_3

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Level 1：直属主管审批
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - name: l1_manager
    template: standard_approval
    parameters:
      approvers: ["${{ $nodes['fetch_approvers'].manager_id }}"]
      mode: "any"
      title: "${{ sprintf('采购审批：%s（¥%.2f）', $params.title, $params.amount) }}"

  - name: l1_check
    template: approval_check
    parameters:
      rules:
        - condition: "$nodes['l1_manager'].approved == true"
          output: approved
      default_output: rejected

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Level 2：直属主管 → 部门负责人
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - name: l2_manager
    template: standard_approval
    parameters:
      approvers: ["${{ $nodes['fetch_approvers'].manager_id }}"]
      mode: "any"
      title: "${{ sprintf('采购审批（一级）：%s（¥%.2f）', $params.title, $params.amount) }}"
      detail:
        note: "审批通过后将提交部门负责人复核"

  - name: l2_manager_check
    template: approval_check
    parameters:
      rules:
        - condition: "$nodes['l2_manager'].approved == true"
          output: approved
      default_output: rejected

  - name: l2_director
    template: standard_approval
    parameters:
      approvers: ["${{ $nodes['fetch_approvers'].director_id }}"]
      mode: "any"
      title: "${{ sprintf('采购审批（二级）：%s（¥%.2f）', $params.title, $params.amount) }}"
      detail:
        manager_comment: "${{ $nodes['l2_manager'].comment ?? '' }}"

  - name: l2_director_check
    template: approval_check
    parameters:
      rules:
        - condition: "$nodes['l2_director'].approved == true"
          output: approved
      default_output: rejected

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Level 3：直属主管 → 部门负责人 → VP + 财务并行
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - name: l3_manager
    template: standard_approval
    parameters:
      approvers: ["${{ $nodes['fetch_approvers'].manager_id }}"]
      mode: "any"
      title: "${{ sprintf('采购审批（一级）：%s（¥%.2f）', $params.title, $params.amount) }}"
      detail:
        note: "审批通过后将依次提交部门负责人、VP 及财务审批"

  - name: l3_manager_check
    template: approval_check
    parameters:
      rules:
        - condition: "$nodes['l3_manager'].approved == true"
          output: approved
      default_output: rejected

  - name: l3_director
    template: standard_approval
    parameters:
      approvers: ["${{ $nodes['fetch_approvers'].director_id }}"]
      mode: "any"
      title: "${{ sprintf('采购审批（二级）：%s（¥%.2f）', $params.title, $params.amount) }}"
      detail:
        manager_comment: "${{ $nodes['l3_manager'].comment ?? '' }}"

  - name: l3_director_check
    template: approval_check
    parameters:
      rules:
        - condition: "$nodes['l3_director'].approved == true"
          output: approved
      default_output: rejected

  - name: l3_vp
    template: standard_approval
    parameters:
      approvers: ["${{ $nodes['fetch_approvers'].vp_id }}"]
      mode: "any"
      title: "${{ sprintf('采购审批（VP）：%s（¥%.2f）', $params.title, $params.amount) }}"

  - name: l3_finance
    template: standard_approval
    parameters:
      approvers: ["${{ $nodes['fetch_approvers'].finance_id }}"]
      mode: "any"
      title: "${{ sprintf('采购审批（财务）：%s（¥%.2f）', $params.title, $params.amount) }}"
      detail:
        budget_remaining: "${{ $nodes['fetch_approvers'].budget_remaining }}"

  - name: l3_parallel_merge
    type: xflow.merge
    # 两条入边各自声明端口，merge 的输出即按端口名建键：
    # 下游读 $nodes['l3_parallel_merge'].vp / .finance。
    inputs:
      - name: vp
      - name: finance
    parameters:
      mode: wait_all

  - name: l3_final_check
    type: xflow.switch
    parameters:
      mode: rules
      outputs: [approved, rejected]
      rules:
        - condition: "$nodes['l3_parallel_merge'].vp.approved == true && $nodes['l3_parallel_merge'].finance.approved == true"
          output: approved
      default_output: rejected

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 审批结果处理（三条路径在此汇合）
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  # 注：route_by_amount 保证同一执行中只有一条路径激活，
  # 因此 wait_any 等价于"等待唯一到达的那条路径"，不会重复触发。
  #
  # 这些汇合点的多条入边互斥（同一 switch 的不同分支），所以它们都只有
  # main 一个端口：显式声明它是为了说明"谁到都行"，而不是漏写端口名。
  - name: merge_approved
    type: xflow.merge
    inputs:
      - name: main
    parameters:
      mode: wait_any

  # 收集通过路径的审计链（Go 函数处理多级数据聚合）
  - name: collect_approved_trail
    type: xflow.function
    parameters:
      function_name: collectApprovalTrail
      params:
        request_id: "${{ $params.request_id }}"
        amount: "${{ $params.amount }}"
        final_status: "approved"
        approval_levels: "${{ $vars.approval_levels }}"
        l1_manager: "${{ $nodes['l1_manager'] ?? nil }}"
        l2_manager: "${{ $nodes['l2_manager'] ?? nil }}"
        l2_director: "${{ $nodes['l2_director'] ?? nil }}"
        l3_manager: "${{ $nodes['l3_manager'] ?? nil }}"
        l3_director: "${{ $nodes['l3_director'] ?? nil }}"
        l3_vp: "${{ $nodes['l3_vp'] ?? nil }}"
        l3_finance: "${{ $nodes['l3_finance'] ?? nil }}"
      # 返回值结构：
      # {
      #   "chain": [
      #     { "role": "manager", "user_id": "...", "action": "approved",
      #       "comment": "...", "acted_at": "..." },
      #     ...
      #   ]
      # }

  - name: update_approved
    type: xflow.database
    on_error: error_output
    parameters:
      operation: update
      table: approval_records
      credential: db_conn
      where:
        request_id: "${{ $params.request_id }}"
      data:
        status: "approved"
        approved_at: "${{ now() }}"
        approval_chain: "${{ toJSON($nodes['collect_approved_trail'].chain) }}"

  - name: notify_approved
    type: xflow.notification
    parameters:
      channel: email
      to: "${{ $params.applicant_id }}"
      subject: "采购申请已通过：{{ $params.title }}"
      template: approval_passed
      data:
        approval_chain: "${{ $nodes['collect_approved_trail'].chain }}"

  - name: merge_rejected
    type: xflow.merge
    inputs:
      - name: main
    parameters:
      mode: wait_any

  # 收集驳回路径的审计链
  - name: collect_rejected_trail
    type: xflow.function
    parameters:
      function_name: collectApprovalTrail
      params:
        request_id: "${{ $params.request_id }}"
        amount: "${{ $params.amount }}"
        final_status: "rejected"
        approval_levels: "${{ $vars.approval_levels }}"
        l1_manager: "${{ $nodes['l1_manager'] ?? nil }}"
        l2_manager: "${{ $nodes['l2_manager'] ?? nil }}"
        l2_director: "${{ $nodes['l2_director'] ?? nil }}"
        l3_manager: "${{ $nodes['l3_manager'] ?? nil }}"
        l3_director: "${{ $nodes['l3_director'] ?? nil }}"
        l3_vp: "${{ $nodes['l3_vp'] ?? nil }}"
        l3_finance: "${{ $nodes['l3_finance'] ?? nil }}"
      # 返回值额外包含 reject_reason：
      # {
      #   "chain": [...],
      #   "reject_reason": "驳回人的意见"
      # }

  - name: update_rejected
    type: xflow.database
    on_error: error_output
    parameters:
      operation: update
      table: approval_records
      credential: db_conn
      where:
        request_id: "${{ $params.request_id }}"
      data:
        status: "rejected"
        rejected_at: "${{ now() }}"
        approval_chain: "${{ toJSON($nodes['collect_rejected_trail'].chain) }}"
        reject_reason: "${{ $nodes['collect_rejected_trail'].reject_reason }}"

  - name: notify_rejected
    type: xflow.notification
    parameters:
      channel: email
      to: "${{ $params.applicant_id }}"
      subject: "采购申请已驳回：{{ $params.title }}"
      template: approval_rejected
      data:
        approval_chain: "${{ $nodes['collect_rejected_trail'].chain }}"
        reject_reason: "${{ $nodes['collect_rejected_trail'].reject_reason }}"

  - name: final_merge
    type: xflow.merge
    inputs:
      - name: main
    parameters:
      mode: wait_any

  - name: log_result
    type: xflow.database
    parameters:
      operation: insert
      table: approval_logs
      credential: db_conn
      data:
        request_id: "${{ $params.request_id }}"
        workflow_id: "${{ $workflow.id }}"
        execution_id: "${{ $execution.id }}"
        completed_at: "${{ now() }}"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 错误处理
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - name: handle_error
    type: xflow.function
    parameters:
      function_name: buildErrorContext
      params:
        request_id: "${{ $params.request_id }}"
        workflow_id: "${{ $workflow.id }}"
        execution_id: "${{ $execution.id }}"

  - name: update_error
    type: xflow.database
    parameters:
      operation: update
      table: approval_records
      credential: db_conn
      where:
        request_id: "${{ $params.request_id }}"
      data:
        status: "error"
        error_at: "${{ now() }}"
        error_message: "${{ $nodes['handle_error'].message }}"

  - name: notify_error
    type: xflow.notification
    parameters:
      channel: email
      to: "${{ $params.applicant_id }}"
      subject: "采购申请处理异常：{{ $params.title }}"
      template: approval_error
      data:
        error: "${{ $nodes['handle_error'].message }}"

# ──────────────────────────────────────
# 连接定义
# ──────────────────────────────────────
connections:
  # ── 公共入口 ──
  start:
    main:
      - node: create_record

  create_record:
    main:
      - node: fetch_approvers
    error:
      - node: handle_error

  fetch_approvers:
    main:
      - node: route_by_amount
    error:
      - node: handle_error

  # ── 金额路由 → 三条独立路径 ──
  route_by_amount:
    level_1:
      - node: l1_manager
    level_2:
      - node: l2_manager
    level_3:
      - node: l3_manager

  # ── Level 1 路径 ──
  l1_manager:
    main:
      - node: l1_check

  l1_check:
    approved:
      - node: merge_approved
    rejected:
      - node: merge_rejected

  # ── Level 2 路径 ──
  l2_manager:
    main:
      - node: l2_manager_check

  l2_manager_check:
    approved:
      - node: l2_director
    rejected:
      - node: merge_rejected

  l2_director:
    main:
      - node: l2_director_check

  l2_director_check:
    approved:
      - node: merge_approved
    rejected:
      - node: merge_rejected

  # ── Level 3 路径 ──
  l3_manager:
    main:
      - node: l3_manager_check

  l3_manager_check:
    approved:
      - node: l3_director
    rejected:
      - node: merge_rejected

  l3_director:
    main:
      - node: l3_director_check

  l3_director_check:
    approved:
      - node: l3_vp
      - node: l3_finance
    rejected:
      - node: merge_rejected

  l3_vp:
    main:
      - node: l3_parallel_merge
        input: vp

  l3_finance:
    main:
      - node: l3_parallel_merge
        input: finance

  l3_parallel_merge:
    main:
      - node: l3_final_check

  l3_final_check:
    approved:
      - node: merge_approved
    rejected:
      - node: merge_rejected

  # ── 通过流程（含审计链收集）──
  merge_approved:
    main:
      - node: collect_approved_trail

  collect_approved_trail:
    main:
      - node: update_approved
      - node: notify_approved

  update_approved:
    main:
      - node: final_merge
    error:
      - node: handle_error

  notify_approved:
    main:
      - node: final_merge

  # ── 驳回流程（含审计链收集）──
  merge_rejected:
    main:
      - node: collect_rejected_trail

  collect_rejected_trail:
    main:
      - node: update_rejected
      - node: notify_rejected

  update_rejected:
    main:
      - node: final_merge
    error:
      - node: handle_error

  notify_rejected:
    main:
      - node: final_merge

  # ── 错误处理 ──
  handle_error:
    main:
      - node: update_error
      - node: notify_error

  update_error:
    main:
      - node: final_merge

  notify_error:
    main:
      - node: final_merge

  # ── 日志 ──
  final_merge:
    main:
      - node: log_result

# ──────────────────────────────────────
# 输出定义
# ──────────────────────────────────────
outputs:
  status:
    value: "${{ $nodes['log_result'].status ?? 'completed' }}"
    display_name: "审批结果"

  approval_chain:
    value: "${{ $nodes['collect_approved_trail'].chain ?? $nodes['collect_rejected_trail'].chain ?? [] }}"
    display_name: "审批链"
