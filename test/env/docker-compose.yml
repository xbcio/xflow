name: xflow-test

services:
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: xflow-test-redis
    command: ["redis-server", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - xflow-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [xflow-test]

  mysql:
    image: docker.io/library/mysql:8.0
    container_name: xflow-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-xflow}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-xflow}"
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - xflow-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-xflow}"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [xflow-test]

  kafka:
    image: docker.io/apache/kafka:3.7
    container_name: xflow-test-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: xflowTestClusterId001
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - xflow-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 3s
      timeout: 5s
      retries: 30
    networks: [xflow-test]

volumes:
  xflow-redis-data:
  xflow-mysql-data:
  xflow-kafka-data:

networks:
  xflow-test:
    driver: bridge
